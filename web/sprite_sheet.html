/* ── 頭目的數值是算出來的，不是手打的 ────────────────────────
   第一版是十五組手打的數字，結果第二章的森之主血量剛好是玩家
   輸出的兩倍 —— 走通測試連續四十次都過不去。手打十五組數字，
   意思就是有十五次機會配錯，而且每一次都要玩到那一章才會發現。

   改成從「玩家走到這個深度時大概長什麼樣」反推。估算式來自模擬：
     等級 ≈ 深度/2　攻擊 ≈ 10+深度　防禦 ≈ 2+深度/4　體力 ≈ 19+深度×4.25
   目標手感：**打得完但打得久** —— 玩家約 8 回合打死它，
   它約 11 回合打死你。所以你有餘裕，但不能站著發呆。 */
const BOSS_KILL_TURNS = 8, BOSS_SURVIVE_TURNS = 14;
/* 估算式是從模擬「量出來」的，不是猜的 —— 而且刻意估得保守
   （低估玩家 → 頭目偏弱）。機器人不會用技能也不會逃跑，
   真人比它強，所以對機器人剛好的難度對真人才是舒服的。 */
/* 這三條是從實際開場數值回歸出來的，不是拍腦袋：
   換算深度 12.9 → 攻 27 / 防 9 / 體 71
   換算深度 20.0 → 攻 42 / 防 15 / 體 133
   換算深度 28.6 → 攻 51 / 防 15 / 體 157
   第一版低估了一半（攻寫成 10+0.62d），結果換算深度 28 的頭目
   只有 95 血、攻 13 —— 兩回合就倒，整場頭目戰等於不存在。 */
const pAtkAt = d => 8  + d*1.5;
const pHpAt  = d => 20 + d*5.0;
const pDefAt = d => 2  + d*0.45;
function bossStats(depth){
  const d = Math.max(1, depth);
  /* 防禦一定要有上限。減傷是 (15/16)^防禦 的指數式，
     深度 100 照線性長下去就是 39 點防禦、減傷只剩 8% ——
     頭目會變成一面打不動的牆，那不是難，那是壞掉。 */
  const def = Math.min(16, Math.round(3 + d*0.35));
  const myDmg = pAtkAt(d) * Math.pow(15/16, def);
  return {
    hp:  Math.max(40, Math.round(myDmg * BOSS_KILL_TURNS)),
    atk: Math.max(4,  Math.round((pHpAt(d) / BOSS_SURVIVE_TURNS) / Math.pow(15/16, pDefAt(d)))),
    def,
  };
}

/* 發動需要的魔力。被動不需要；抽乾型要求至少半條，
   否則「剩 1 MP 也能瞬移逃走」會讓逃跑技能完全沒有代價。 */
function abilCost(a, p){
  if(a.t === 'pass') return 0;
  if(a.mpAll) return Math.ceil(p.mmp * .5);
  if(a.mpPct) return Math.ceil(p.mmp * a.mpPct);
  // 赤魔導士 Master：每個技能便宜 1 點（最低還是要 1）
  const off = (typeof hasMaster === 'function' && hasMaster('red')) ? 1 : 0;
  return Math.max(1, (a.mp || 0) - off);
}
function payAbil(a, p){
  if(a.t === 'pass') return;
  if(a.mpAll){ p.mp = 0; return; }
  p.mp = Math.max(0, p.mp - abilCost(a, p));
}
const ABIL_T = {atk:'攻擊', def:'輔助', pass:'被動', esc:'逃跑', rev:'復活'};
function costLabel(a, p){
  if(a.t === 'pass') return TX('ui.passive','被動');
  if(a.mpAll) return `${TX('ui.allmp','全部 MP')}（${abilCost(a,p)}）`;
  return abilCost(a, p) + ' MP';
}

/* 訊息用具名佔位符 —— `{nm}`、`{n}`。用位置參數（{0}{1}）的話，
   譯者看不出第二個數字是傷害還是層數，而看不出來就會翻錯。 */
function M(key, zh, vars){
  let t = TX(key, zh);
  if(vars) for(const k in vars) t = t.split('{'+k+'}').join(vars[k]);
  return t;
}
function TX(key, zh){
  if(LANG === 'zh') return zh;
  const v = DICT[LANG] && DICT[LANG][key];
  return v === undefined ? zh : v;
}

/* ─── 決定論亂數 ───────────────────────────────────────────── */
function RNG(seed){
  let s = seed >>> 0 || 1;
  const f = () => { s ^= s<<13; s>>>=0; s ^= s>>17; s ^= s<<5; s>>>=0; return s/4294967296; };
  f.i = (a,b) => a + Math.floor(f()*(b-a+1));
  f.pick = arr => arr[f.i(0,arr.length-1)];
  f.chance = p => f() < p;
  f.shuffle = arr => { for(let i=arr.length-1;i>0;i--){ const j=f.i(0,i); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; };
  f.weight = (arr, wf) => {
    let tot = 0; for(const a of arr) tot += wf(a);
    if(tot<=0) return null;
    let r = f()*tot;
    for(const a of arr){ r -= wf(a); if(r<=0) return a; }
    return arr[arr.length-1];
  };
  return f;
}

const atlas = {};
function bake(rows, w=T, h=T){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const x = c.getContext('2d');
  for(let y=0;y<rows.length;y++){
    const row = rows[y];
    for(let i=0;i<row.length;i++){
      const col = PAL[row[i]];
      if(col){ x.fillStyle=col; x.fillRect(i,y,1,1); }
    }
  }
  return c;
}
for(const k in SPR) atlas[k] = bake(SPR[k]);

/* ── 頭目的外觀 ──────────────────────────────────────────────
   十五隻頭目各畫一張 16x16 不划算，而且會畫得很平。
   改成「同族雜魚的剪影 + 一圈金邊 + 壓暗的底色」：
   玩家一眼就看得出「這一隻不一樣」，剪影又還是認得出是什麼族。 */
const BOSS_BASE = {
  b_warden:'golem', b_treant:'shroom', b_ballista:'turret', b_pyro:'mage',
  b_lord:'slime', b_phoenix:'imp', b_hanzo:'wolf', b_oni:'knight',
  b_gaoler:'skeleton', b_queen:'mage', b_prism:'turret', b_mermaid:'mage',
  b_gate:'knight',
};
function crownSprite(base){
  const src = atlas[base] || atlas.rat;
  const c = document.createElement('canvas'); c.width=T; c.height=T;
  const x = c.getContext('2d');
  x.drawImage(src, 0, 0);
  // getImageData 不是永遠拿得到（畫布被污染、或在無頭環境跑邏輯測試）。
  // 拿不到就退回原圖 —— 美術效果可以少，遊戲不能因為描邊掛掉。
  const d = x.getImageData(0,0,T,T);
  if(!d || !d.data || !x.createImageData) return c;
  const a = d.data;
  const solid = (px_,y)=> px_>=0 && y>=0 && px_<T && y<T && a[(y*T+px_)*4+3] > 0;
  const out = x.createImageData(T,T);
  for(let y=0;y<T;y++) for(let px_=0;px_<T;px_++){
    const i=(y*T+px_)*4;
    if(solid(px_,y)){                        // 本體壓暗，金邊才跳得出來
      out.data[i]   = a[i]*0.72;
      out.data[i+1] = a[i+1]*0.72;
      out.data[i+2] = a[i+2]*0.78;
      out.data[i+3] = a[i+3];
    } else if(solid(px_-1,y)||solid(px_+1,y)||solid(px_,y-1)||solid(px_,y+1)){
      out.data[i]=245; out.data[i+1]=220; out.data[i+2]=122; out.data[i+3]=255;
    }
  }
  x.putImageData(out,0,0);
  return c;
}
for(const id in BOSS_BASE) atlas[id] = crownSprite(BOSS_BASE[id]);

/* body: 色盤索引；age: 'adult'|'old'|'child'；star: 主角的星芒記號 */
function makeBlob(body, {age='adult', star=false, hat=null, dark='0'}={}){
  const c = document.createElement('canvas'); c.width = T; c.height = T;
  const x = c.getContext('2d');
  const child = age === 'child';
  const m = shapeMask(child ? BLOB_CHILD : BLOB_BODY);
  paintMask(x, m, PAL[body], PAL[dark], null, 99);

  // 眼睛放在身體的上三分之一。放在正中間的話，眼睛會跟最寬的那一排
  // 對齊，整隻生物就失去上下的方向感。
  // y6 而不是 y5：帽緣壓在 y4–5，眼睛放 y5 會被每一頂帽子蓋掉
  const ey = child ? 6 : 6, ex1 = child ? 5 : 4, ex2 = child ? 9 : 10;
  px(x,PAL[dark],ex1,ey,2,2); px(x,PAL[dark],ex2,ey,2,2);
  if(child){ px(x,PAL['6'],ex1,ey,1,1); px(x,PAL['6'],ex2,ey,1,1); }   // 小孩眼睛有光

  // 腳的內側再壓一道暗色 —— 四隻腳之間才有厚度，不會變成一排柵欄
  const ly = child ? 11 : 12;
  for(const lx of (child ? [5,8,11] : [3,6,10,13])) px(x,PAL[dark],lx,ly,1,2);

  px(x,PAL['6'],child?5:4,child?5:3,1,1);                              // 左上受光

  if(age === 'old'){                                                    // 老人：白鬍與垂眼
    px(x,PAL['6'],6,9,4,1); px(x,PAL['6'],5,10,6,1);
    px(x,PAL[dark],5,10,1,1); px(x,PAL[dark],10,10,1,1);
    px(x,PAL[dark],ex1,ey+2,2,1); px(x,PAL[dark],ex2,ey+2,2,1);
  }
  if(star){
    // 菱形，不是九宮格。九宮格全填在 16px 下就只是一坨白。
    const sy = 9;
    px(x,PAL['+'],7,sy-1,2,1);
    px(x,PAL['+'],6,sy,4,1);
    px(x,PAL['+'],7,sy+1,2,1);
  }
  if(hat && HAT_ART[hat]) HAT_ART[hat](x);
  return c;
}

const heroCache = {};

/* ─── 道具圖示：參數化生成 ────────────────────────────────────

   只換顏色的話玩家會覺得所有草都是同一種。 */
function px(x,c,X,Y,W,H){ if(!c) return; x.fillStyle=c; x.fillRect(X,Y,W||1,H||1); }
function outline(x,pts,col){ x.fillStyle=col; for(const [a,b] of pts) x.fillRect(a,b,1,1); }

/* 由「跨距表」建出遮罩，再自動描邊。
   這樣每種輪廓可以真的長得不一樣，而不是同一個矩形換顏色 ——
   只換顏色的話，玩家會覺得所有草都是同一種，隨機外觀就失去意義了。 */
function shapeMask(spans){
  const m = Array.from({length:T}, ()=>new Array(T).fill(0));
  for(const [y,x0,w] of spans) for(let i=0;i<w;i++) if(x0+i<T && y<T) m[y][x0+i]=1;
  return m;
}
function paintMask(x, m, fill, edge, liquid, liqFrom){
  for(let y=0;y<T;y++) for(let px_=0;px_<T;px_++){
    if(m[y][px_]){
      x.fillStyle = (liquid && y>=liqFrom) ? liquid : fill;
      x.fillRect(px_,y,1,1);
    } else if((m[y-1]&&m[y-1][px_]) || (m[y+1]&&m[y+1][px_]) || m[y][px_-1] || m[y][px_+1]){
      x.fillStyle = edge; x.fillRect(px_,y,1,1);
    }
  }
}
function maskTop(m){ for(let y=0;y<T;y++) for(let x2=0;x2<T;x2++) if(m[y][x2]) return y; return 0; }
function maskBottom(m){ for(let y=T-1;y>=0;y--) for(let x2=0;x2<T;x2++) if(m[y][x2]) return y; return T-1; }

/* 六種瓶形 —— 圓底燒瓶 / 高細瓶 / 扁圓罐 / 錐形瓶 / 葫蘆瓶 / 安瓿 */

/* 五種卷軸形制 —— 直筒 / 攤開 / 綁緞帶 / 折疊信 / 卷軸盒。
   同一條規則：外觀必須換輪廓。只換封蠟顏色的話，玩家會覺得
   十一種卷軸長得一模一樣，「盲讀哪一張」的判斷就變成純猜。 */
function makeScroll(v){
  const c=document.createElement('canvas'); c.width=T; c.height=T; const x=c.getContext('2d');
  const seals=['g','p','l','u','q','f','m','r','h','5','t'];
  const seal=PAL[seals[v%seals.length]], paper=PAL['d'], shade=PAL['c'], dark=PAL['0'];
  const ink=PAL['9'];

    px(x,dark,5,1,6,14);
    px(x,paper,6,2,4,12); px(x,shade,6,2,1,12);
    px(x,seal,5,1,6,2);  px(x,dark,5,1,6,1);

    px(x,ink,7,5,2,1); px(x,ink,7,8,2,1); px(x,ink,7,11,2,1);
  } else if(shape===1){                             // 攤開：寬扁的一張紙
    px(x,dark,1,4,14,8);

    px(x,ink,7,4,2,1); px(x,ink,7,11,2,1);
    px(x,dark,1,6,14,4); px(x,seal,1,7,14,2); px(x,PAL['d'],2,7,2,1);
  } else if(shape===3){                             // 折疊信：上緣一個三角封口
    px(x,dark,2,4,12,10);
    px(x,paper,3,5,10,8); px(x,shade,3,12,10,1);
    for(let i=0;i<4;i++){ px(x,shade,3+i,5+i,1,1); px(x,shade,12-i,5+i,1,1); }
    px(x,dark,7,7,3,3); px(x,seal,7,8,3,2);

    px(x,dark,1,4,14,8);
    px(x,paper,2,6,12,4); px(x,shade,2,9,12,1); px(x,PAL['6'],3,6,10,1);
    px(x,dark,1,4,3,8);  px(x,seal,2,5,2,6);
    px(x,dark,12,4,3,8); px(x,seal,12,5,2,6);

}
/* 三種杖身 x 三種杖頭 = 九種外觀，每一種的輪廓都不一樣。

function makeWand(v){
  const c=document.createElement('canvas'); c.width=T; c.height=T; const x=c.getContext('2d');
  // 杖身用暖色與淺色，不用冷灰 —— 冷灰是地形的色溫，握在手上的木頭不該撞色
  const woods=['9','8','a','b','c','6','d','5','v'];
  const tips=['r','v','m','g','q','u','h','l','6'];
  const wood=PAL[woods[v%woods.length]], tip=PAL[tips[v%tips.length]], dark=PAL['0'];
  const shaft=Math.floor(v/3)%3, head=v%3;

  if(shaft===0){                                    // 直杖
    px(x,dark,6,4,4,11); px(x,wood,7,5,2,9); px(x,PAL['d'],7,6,1,5);
    px(x,PAL['8'],6,13,4,1);
  } else if(shaft===1){                             // 節杖：兩處膨大的節
    px(x,dark,6,4,4,11); px(x,wood,7,5,2,9); px(x,PAL['d'],7,6,1,3);
    for(const ky of [7,11]){                        // 節：外描邊 + 木頭鼓起，不能整塊塗黑
      px(x,dark,5,ky,6,3);
      px(x,wood,6,ky+1,4,1); px(x,wood,7,ky,2,1); px(x,wood,7,ky+2,2,1);
    }
  } else {                                          // 彎杖：逐列偏移，剪影是歪的但不斷開
    const off = y => (y<7 ? 1 : (y<11 ? -1 : 1));
    for(let y=4;y<15;y++)  px(x,dark, 6+off(y), y, 4, 1);
    for(let y=5;y<14;y++)  px(x,wood, 7+off(y), y, 2, 1);
    px(x,PAL['8'],7,13,4,1);
  }
  const hx = shaft===2 ? 8 : 7;                     // 彎杖的頭要跟著頂端偏移
  if(head===0){                                     // 寶珠
    px(x,dark,hx-2,0,5,5); px(x,tip,hx-1,1,3,3); px(x,PAL['6'],hx-1,1,1,1);
  } else if(head===1){                              // 新月
    px(x,dark,hx-2,0,5,4); px(x,tip,hx-1,1,3,1); px(x,tip,hx-2,2,1,1); px(x,tip,hx+2,2,1,1);
  } else {                                          // 雙叉
    px(x,dark,hx-2,0,5,4); px(x,tip,hx-1,0,1,3); px(x,tip,hx+1,0,1,3); px(x,tip,hx,2,1,1);
  }
  return c;
}

  const bl=PAL[blades[v]||'6'], hi=PAL[hilts[v]||'9'], dark=PAL['0'];
  if(v===0){ px(x,dark,6,2,4,11); px(x,PAL['9'],7,3,2,9); px(x,PAL['b'],7,3,1,4);
             px(x,PAL['8'],6,12,4,2); return c; }
  if(v===2){ px(x,dark,7,1,2,12); px(x,bl,7,2,2,3); px(x,PAL['6'],7,2,1,2);
             px(x,PAL['9'],7,5,2,8); px(x,dark,5,5,6,1); px(x,hi,5,5,6,1); return c; }
  px(x,dark,6,1,4,10);
  px(x,bl,7,2,2,8);
  px(x,PAL['6'],7,2,1,6);
  px(x,dark,4,10,8,2); px(x,hi,4,10,8,1);
  px(x,dark,7,12,2,3); px(x,PAL['8'],7,12,2,2);
  px(x,PAL['u'],7,14,2,1);
  return c;
}
function makeShield(v){
  const c=document.createElement('canvas'); c.width=T; c.height=T; const x=c.getContext('2d');
  const faces=['9','a','5','r'], rims=['8','9','4','6'];
  const fa=PAL[faces[v%4]], rm=PAL[rims[v%4]], dark=PAL['0'];
  // 四種輪廓：heater（上平下尖）/ 圓盾 / 鳶形（細長下尖）/ 塔盾（方正）
  const SHAPES = [
    [[3,4,8],[4,3,10],[5,3,10],[6,3,10],[7,3,10],[8,4,8],[9,4,8],[10,5,6],[11,6,4],[12,7,2]],
    [[3,6,4],[4,4,8],[5,3,10],[6,2,12],[7,2,12],[8,2,12],[9,2,12],[10,3,10],[11,4,8],[12,6,4]],
    [[2,6,4],[3,5,6],[4,4,8],[5,4,8],[6,4,8],[7,4,8],[8,5,6],[9,5,6],[10,6,4],[11,6,4],[12,7,2],[13,7,2]],
    [[2,4,8],[3,3,10],[4,3,10],[5,3,10],[6,3,10],[7,3,10],[8,3,10],[9,3,10],[10,3,10],[11,3,10],[12,4,8]],
  ];
  const m = shapeMask(SHAPES[v%4]);
  paintMask(x, m, rm, dark, null, 99);
  // 內面：把遮罩往內縮一圈
  for(let y=1;y<T-1;y++) for(let i=1;i<T-1;i++)
    if(m[y][i] && m[y-1][i] && m[y+1][i] && m[y][i-1] && m[y][i+1]){ x.fillStyle=fa; x.fillRect(i,y,1,1); }
  px(x,PAL['d'],5,4,2,2);                                  // 高光
  if(v===3){ px(x,PAL['6'],6,5,4,4); px(x,PAL['r'],7,6,2,2); }   // 鏡面
  else px(x,PAL['u'],7,6,2,2);                             // 盾徽
  return c;
}

/* ─── 地形：程序化，比手繪更耐看也更少程式碼 ────────────────
   牆用 3/4 視角畫（亮頂面 + 暗立面），這一個決定就撐起 16-bit 地牢的體感。*/
function makeFloor(seed, corridor){
  const c=document.createElement('canvas'); c.width=T; c.height=T; const x=c.getContext('2d');
  const r = RNG(seed*2654435761);
  const base = corridor?'x':'y', lit = corridor?'y':'z', mortar = corridor?'w':'x';
  x.fillStyle=PAL[base]; x.fillRect(0,0,T,T);
  // 磚縫
  x.fillStyle=PAL[mortar];
  x.fillRect(0,0,T,1); x.fillRect(0,8,T,1);
  x.fillRect(0,0,1,8); x.fillRect(8,8,1,8);
  // 顆粒
  for(let i=0;i<26;i++){
    const px_=r.i(1,15), py=r.i(1,15);
    x.fillStyle = r.chance(.55)?PAL[lit]:PAL[mortar];
    x.fillRect(px_,py,1,1);
  }
  return c;
}
function makeWall(face){
  const c=document.createElement('canvas'); c.width=T; c.height=T; const x=c.getContext('2d');
  const r=RNG(99173);
  // 牆比地板暗一階、磚縫比地板深 —— 「能走／不能走」要用明度分，不是用花紋分
  x.fillStyle=PAL['0']; x.fillRect(0,0,T,T);
  x.fillStyle=PAL['w'];
  x.fillRect(1,1,6,6); x.fillRect(9,1,6,6); x.fillRect(1,9,6,6); x.fillRect(9,9,6,6);
  x.fillStyle=PAL['x'];
  x.fillRect(1,1,6,1); x.fillRect(9,1,6,1); x.fillRect(1,9,6,1); x.fillRect(9,9,6,1);
  for(let i=0;i<18;i++){ x.fillStyle = r.chance(.5)?PAL['x']:PAL['0']; x.fillRect(r.i(0,15),r.i(0,15),1,1); }
  if(face){
    // 立面：下方有地板時畫出厚度，深度感就出來了
    x.fillStyle=PAL['z']; x.fillRect(0,10,T,1);
    x.fillStyle=PAL['y']; x.fillRect(0,11,T,2);
    x.fillStyle=PAL['w']; x.fillRect(0,13,T,3);
    x.fillStyle=PAL['0']; x.fillRect(0,15,T,1);
    for(let i=0;i<5;i++) x.fillRect(r.i(0,15),r.i(11,14),1,1);
  }
  return c;
}
function makeStairs(){
  const c=document.createElement('canvas'); c.width=T; c.height=T; const x=c.getContext('2d');
  // 樓梯是整層唯一的目標，必須一眼看到 —— 用整張圖裡沒有別人在用的
  // 金色踏面 + 全黑深井，跟冷色地板拉開最大距離
  x.fillStyle=PAL['x']; x.fillRect(0,0,T,T);
  x.fillStyle=PAL['0']; x.fillRect(1,1,14,14);
  for(let i=0;i<4;i++){
    const y=2+i*3, w=12-i*2, sx=Math.floor((T-w)/2);
    x.fillStyle=PAL['0']; x.fillRect(sx,y,w,3);
    x.fillStyle=PAL[['v','u','t','s'][i]]; x.fillRect(sx,y,w,1);
    x.fillStyle=PAL[['t','s','s','0'][i]]; x.fillRect(sx+1,y+1,w-2,1);
  }
  x.fillStyle=PAL['0']; x.fillRect(3,14,10,2);
  return c;
}
// 未探索區域：不是純黑，是「還沒挖開的岩盤」。
// 純黑會讓人以為畫面沒畫出來；有紋理的暗岩則讀成「這裡是實心的」，
// 一整片黑佔掉半個螢幕的違和感就沒了。
function makeRock(){
  const S=32, c=document.createElement('canvas'); c.width=S; c.height=S;
  const x=c.getContext('2d'), r=RNG(0x9e3779b1);
  x.fillStyle='#07090b'; x.fillRect(0,0,S,S);
  for(let i=0;i<70;i++){
    x.fillStyle = r.chance(.6)?'#0b0e11':'#040506';
    x.fillRect(r.i(0,S-1), r.i(0,S-1), r.i(1,3), 1);
  }
  for(let i=0;i<10;i++){ x.fillStyle='#101418'; x.fillRect(r.i(0,S-1), r.i(0,S-1), 1, 1); }
  return c;
}
/* 回村的出口：向上的拱門。整座地牢所有的光都是往下的，
   只有這一格是往上的 —— 那就是它的意思。 */
function makeExit(){
  const c=document.createElement('canvas'); c.width=T; c.height=T; const x=c.getContext('2d');
  x.fillStyle=PAL['x']; x.fillRect(0,0,T,T);
  px(x,PAL['0'],2,2,12,14);
  px(x,PAL['z'],3,3,10,12); px(x,PAL['y'],4,4,8,11);
  px(x,PAL['v'],5,5,6,10); px(x,PAL['u'],5,5,6,2);       // 拱內的光
  px(x,PAL['0'],5,5,1,1);  px(x,PAL['0'],10,5,1,1);
  px(x,PAL['d'],7,7,2,8);
  px(x,PAL['0'],2,14,12,2);
  return c;
}
/* 帽子的道具圖示：直接畫那頂帽子，不另外設計 ——
   地上看到的跟戴在頭上的必須是同一個東西 */
function makeHat(i){
  const c = document.createElement('canvas'); c.width = T; c.height = T;
  const x = c.getContext('2d');
  const tmp = document.createElement('canvas'); tmp.width = T; tmp.height = T;
  const tx = tmp.getContext('2d');
  // 直接讀 HAT，不要另外抄一份 id 清單 ——
  // 抄一份的下場是加了新職業之後，地上的圖示還是舊的那六頂。
  const art = HAT_ART[(HAT[i % HAT.length] || HAT[0]).id];
  (art || HAT_ART.helm)(tx);
  x.drawImage(tmp, 0, 4);              // 往下移，圖示才落在格子中間
  return c;
}

const TILE_ART = {
  floor:[makeFloor(1,0),makeFloor(2,0),makeFloor(3,0),makeFloor(4,0)],
  corr:[makeFloor(11,1),makeFloor(12,1),makeFloor(13,1)],
  wall:makeWall(0), wallFace:makeWall(1), stairs:makeStairs(), rock:makeRock(),
  exit:makeExit(),
};
const goldIcon = (()=>{ const c=document.createElement('canvas'); c.width=T;c.height=T;
  const x=c.getContext('2d');
  px(x,PAL['0'],4,8,8,5); px(x,PAL['t'],5,9,6,3); px(x,PAL['u'],5,9,6,1); px(x,PAL['v'],6,9,2,1);
  px(x,PAL['0'],3,5,6,4); px(x,PAL['t'],4,6,4,2); px(x,PAL['v'],4,6,2,1);

const trapIcon = (()=>{ const c=document.createElement('canvas'); c.width=T;c.height=T;
  const x=c.getContext('2d');
  px(x,PAL['0'],3,5,10,9); px(x,PAL['e'],4,6,8,7);
  for(let i=0;i<4;i++){ px(x,PAL['6'],5+i*2,6,1,3); px(x,PAL['6'],5+i*2,10,1,3); }
  px(x,PAL['g'],4,6,8,1);
  return c; })();
