function abilCost(a, p){
  if(a.t === 'pass') return 0;
  if(a.mpAll) return Math.ceil(p.mmp * .5);
  if(a.mpPct) return Math.ceil(p.mmp * a.mpPct);

  const off = (typeof hasMaster === 'function' && hasMaster('red')) ? 1 : 0;
  return Math.max(1, (a.mp || 0) - off);
}
function payAbil(a, p){
  if(a.t === 'pass') return;
  if(a.mpAll){ p.mp = 0; return; }
  p.mp = Math.max(0, p.mp - abilCost(a, p));
}

  if(a.t === 'pass') return '被動';
  if(a.mpAll) return `全部 MP（需 ${abilCost(a,p)}）`;
  return abilCost(a, p) + ' MP';
}

/* ─── 決定論亂數 ───────────────────────────────────────────── */
function RNG(seed){
  let s = seed >>> 0 || 1;
  const f = () => { s ^= s<<13; s>>>=0; s ^= s>>17; s ^= s<<5; s>>>=0; return s/4294967296; };
  f.i = (a,b) => a + Math.floor(f()*(b-a+1));
  f.pick = arr => arr[f.i(0,arr.length-1)];
  f.chance = p => f() < p;
  f.shuffle = arr => { for(let i=arr.length-1;i>0;i--){ const j=f.i(0,i); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; };
  f.weight = (arr, wf) => {
    let tot = 0; for(const a of arr) tot += wf(a);
    if(tot<=0) return null;
    let r = f()*tot;
    for(const a of arr){ r -= wf(a); if(r<=0) return a; }
    return arr[arr.length-1];
  };
  return f;
}

/* ─── 精靈圖集：把像素資料燒進離屏 canvas ─────────────────── */
const atlas = {};
function bake(rows, w=T, h=T){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const x = c.getContext('2d');
  for(let y=0;y<rows.length;y++){
    const row = rows[y];
    for(let i=0;i<row.length;i++){
      const col = PAL[row[i]];
      if(col){ x.fillStyle=col; x.fillRect(i,y,1,1); }
    }
  }
  return c;
}

/* body: 色盤索引；age: 'adult'|'old'|'child'；star: 主角的星芒記號 */
function makeBlob(body, {age='adult', star=false, hat=null, dark='0'}={}){
  const c = document.createElement('canvas'); c.width = T; c.height = T;
  const x = c.getContext('2d');
  const child = age === 'child';
  const m = shapeMask(child ? BLOB_CHILD : BLOB_BODY);
  paintMask(x, m, PAL[body], PAL[dark], null, 99);

  // 眼睛放在身體的上三分之一。放在正中間的話，眼睛會跟最寬的那一排
  // 對齊，整隻生物就失去上下的方向感。
  // y6 而不是 y5：帽緣壓在 y4–5，眼睛放 y5 會被每一頂帽子蓋掉
  const ey = child ? 6 : 6, ex1 = child ? 5 : 4, ex2 = child ? 9 : 10;
  px(x,PAL[dark],ex1,ey,2,2); px(x,PAL[dark],ex2,ey,2,2);
  if(child){ px(x,PAL['6'],ex1,ey,1,1); px(x,PAL['6'],ex2,ey,1,1); }   // 小孩眼睛有光

  // 腳的內側再壓一道暗色 —— 四隻腳之間才有厚度，不會變成一排柵欄
  const ly = child ? 11 : 12;
  for(const lx of (child ? [5,8,11] : [3,6,10,13])) px(x,PAL[dark],lx,ly,1,2);

  px(x,PAL['6'],child?5:4,child?5:3,1,1);                              // 左上受光

  if(age === 'old'){                                                    // 老人：白鬍與垂眼
    px(x,PAL['6'],6,9,4,1); px(x,PAL['6'],5,10,6,1);
    px(x,PAL[dark],5,10,1,1); px(x,PAL[dark],10,10,1,1);
    px(x,PAL[dark],ex1,ey+2,2,1); px(x,PAL[dark],ex2,ey+2,2,1);
  }
  if(star){
    // 菱形，不是九宮格。九宮格全填在 16px 下就只是一坨白。
    const sy = 9;
    px(x,PAL['+'],7,sy-1,2,1);
    px(x,PAL['+'],6,sy,4,1);
    px(x,PAL['+'],7,sy+1,2,1);
  }

  return c;
}

   只換顏色的話，玩家會覺得所有草都是同一種，隨機外觀就失去意義了。 */
function shapeMask(spans){
  const m = Array.from({length:T}, ()=>new Array(T).fill(0));
  for(const [y,x0,w] of spans) for(let i=0;i<w;i++) if(x0+i<T && y<T) m[y][x0+i]=1;
  return m;
}
function paintMask(x, m, fill, edge, liquid, liqFrom){
  for(let y=0;y<T;y++) for(let px_=0;px_<T;px_++){

      x.fillStyle = (liquid && y>=liqFrom) ? liquid : fill;
      x.fillRect(px_,y,1,1);
    } else if((m[y-1]&&m[y-1][px_]) || (m[y+1]&&m[y+1][px_]) || m[y][px_-1] || m[y][px_+1]){
      x.fillStyle = edge; x.fillRect(px_,y,1,1);
    }

}

   只有這一格是往上的 —— 那就是它的意思。 */
function makeExit(){
  const c=document.createElement('canvas'); c.width=T; c.height=T; const x=c.getContext('2d');
  x.fillStyle=PAL['x']; x.fillRect(0,0,T,T);
  px(x,PAL['0'],2,2,12,14);
  px(x,PAL['z'],3,3,10,12); px(x,PAL['y'],4,4,8,11);
  px(x,PAL['v'],5,5,6,10); px(x,PAL['u'],5,5,6,2);       // 拱內的光
  px(x,PAL['0'],5,5,1,1);  px(x,PAL['0'],10,5,1,1);
  px(x,PAL['d'],7,7,2,8);
  px(x,PAL['0'],2,14,12,2);
  return c;
}
/* 帽子的道具圖示：直接畫那頂帽子，不另外設計 ——
   地上看到的跟戴在頭上的必須是同一個東西 */
function makeHat(i){
  const c = document.createElement('canvas'); c.width = T; c.height = T;
  const x = c.getContext('2d');
  const tmp = document.createElement('canvas'); tmp.width = T; tmp.height = T;
  const tx = tmp.getContext('2d');
  // 直接讀 HAT，不要另外抄一份 id 清單 ——
  // 抄一份的下場是加了新職業之後，地上的圖示還是舊的那六頂。
  const art = HAT_ART[(HAT[i % HAT.length] || HAT[0]).id];
  (art || HAT_ART.helm)(tx);
  x.drawImage(tmp, 0, 4);              // 往下移，圖示才落在格子中間
  return c;
}

const TILE_ART = {
  floor:[makeFloor(1,0),makeFloor(2,0),makeFloor(3,0),makeFloor(4,0)],
  corr:[makeFloor(11,1),makeFloor(12,1),makeFloor(13,1)],
  wall:makeWall(0), wallFace:makeWall(1), stairs:makeStairs(), rock:makeRock(),
  exit:makeExit(),
};
const goldIcon = (()=>{ const c=document.createElement('canvas'); c.width=T;c.height=T;
  const x=c.getContext('2d');
  px(x,PAL['0'],4,8,8,5); px(x,PAL['t'],5,9,6,3); px(x,PAL['u'],5,9,6,1); px(x,PAL['v'],6,9,2,1);
  px(x,PAL['0'],3,5,6,4); px(x,PAL['t'],4,6,4,2); px(x,PAL['v'],4,6,2,1);
  return c; })();
const trapIcon = (()=>{ const c=document.createElement('canvas'); c.width=T;c.height=T;
  const x=c.getContext('2d');
  px(x,PAL['0'],3,5,10,9); px(x,PAL['e'],4,6,8,7);
  for(let i=0;i<4;i++){ px(x,PAL['6'],5+i*2,6,1,3); px(x,PAL['6'],5+i*2,10,1,3); }
  px(x,PAL['g'],4,6,8,1);
  return c; })();

function add(g, cv, label){
  const d=document.createElement('div'); d.className='cell';
  const c=document.createElement('canvas'); c.width=16;c.height=16;
  c.getContext('2d').drawImage(cv,0,0);
  d.appendChild(c); const s=document.createElement('div'); s.textContent=label; d.appendChild(s);
  g.appendChild(d);
}
