/* 這一層抽得到哪些怪。
   有 `zn` 的只在指定地貌出現；沒有 `zn` 的到處都有，但在**有專屬名單的
   地貌裡權重砍半** —— 這樣森林裡還是會有哥布林（世界要有連續性），
   但主要看到的是蜂、樹靈與苔背熊。
   全域怪完全排除的話，每一章會變成各自獨立的圖鑑，反而不像同一個世界。 */
function monWeight(m, md, theme){
  if(md < m.fl[0] || md > m.fl[1]) return 0;
  if(m.zn) return m.zn.includes(theme) ? m.w * 1.6 : 0;
  return THEME_HAS_ROSTER[theme] ? m.w * 0.5 : m.w;
}
const THEME_HAS_ROSTER = {};
for(const m of MONS) if(m.zn) for(const z of m.zn) THEME_HAS_ROSTER[z] = 1;

/* ── 頭目的數值是算出來的，不是手打的 ────────────────────────
   第一版是十五組手打的數字，結果第二章的森之主血量剛好是玩家
   輸出的兩倍 —— 走通測試連續四十次都過不去。手打十五組數字，
   意思就是有十五次機會配錯，而且每一次都要玩到那一章才會發現。

   改成從「玩家走到這個深度時大概長什麼樣」反推。估算式來自模擬：
     等級 ≈ 深度/2　攻擊 ≈ 10+深度　防禦 ≈ 2+深度/4　體力 ≈ 19+深度×4.25
   目標手感：**打得完但打得久** —— 玩家約 8 回合打死它，
   它約 11 回合打死你。所以你有餘裕，但不能站著發呆。 */
/* SURVIVE 從 14 拉到 20，是因為原本的算式只算了頭目一個人打你。
   頭目層還有兩隻雜魚，實測牠們貢獻了將近一半的傷害 ——
   「頭目 14 回合打死你」在場上其實是「7 回合」。 */
const BOSS_KILL_TURNS = 8, BOSS_SURVIVE_TURNS = 20;
/* 估算式是從模擬「量出來」的，不是猜的 —— 而且刻意估得保守
   （低估玩家 → 頭目偏弱）。機器人不會用技能也不會逃跑，
   真人比它強，所以對機器人剛好的難度對真人才是舒服的。 */
/* 這三條是從實際開場數值回歸出來的，不是拍腦袋：
   換算深度 12.9 → 攻 27 / 防 9 / 體 71
   換算深度 20.0 → 攻 42 / 防 15 / 體 133
   換算深度 28.6 → 攻 51 / 防 15 / 體 157
   第一版低估了一半（攻寫成 10+0.62d），結果換算深度 28 的頭目
   只有 95 血、攻 13 —— 兩回合就倒，整場頭目戰等於不存在。 */
const pAtkAt = d => 6  + d*1.4;   // 實測換算深度 28.6 時是 46，舊式高估了 5
const pHpAt  = d => 20 + d*5.0;
const pDefAt = d => 2  + d*0.45;
function bossStats(depth){
  const d = Math.max(1, depth);
  /* 防禦一定要有上限。減傷是 (15/16)^防禦 的指數式，
     深度 100 照線性長下去就是 39 點防禦、減傷只剩 8% ——
     頭目會變成一面打不動的牆，那不是難，那是壞掉。 */
  const def = Math.min(16, Math.round(3 + d*0.35));
  const myDmg = pAtkAt(d) * Math.pow(15/16, def);
  return {
    hp:  Math.max(40, Math.round(myDmg * BOSS_KILL_TURNS)),
    atk: Math.max(4,  Math.round((pHpAt(d) / BOSS_SURVIVE_TURNS) / Math.pow(15/16, pDefAt(d)))),
    def,
  };
}

/* 發動需要的魔力。被動不需要；抽乾型要求至少半條，
   否則「剩 1 MP 也能瞬移逃走」會讓逃跑技能完全沒有代價。 */
function abilCost(a, p){
  if(a.t === 'pass') return 0;
  if(a.mpAll) return Math.ceil(p.mmp * .5);
  if(a.mpPct) return Math.ceil(p.mmp * a.mpPct);
  // 赤魔導士 Master：每個技能便宜 1 點（最低還是要 1）
  const off = (typeof hasMaster === 'function' && hasMaster('red')) ? 1 : 0;
  return Math.max(1, (a.mp || 0) - off);
}
function payAbil(a, p){
  if(a.t === 'pass') return;
  if(a.mpAll){ p.mp = 0; return; }
  p.mp = Math.max(0, p.mp - abilCost(a, p));
}
const ABIL_T = {atk:'攻擊', def:'輔助', pass:'被動', esc:'逃跑', rev:'復活'};
function costLabel(a, p){
  if(a.t === 'pass') return TX('ui.passive','被動');
  if(a.mpAll) return `${TX('ui.allmp','全部 MP')}（${abilCost(a,p)}）`;
  return abilCost(a, p) + ' MP';
}

/* 幻獸：四系各一隻，需要該系 4 級。代價是三成胃袋 ——
   在一款餓死是主要死因的遊戲裡，這才是真正需要猶豫的代價。 */
const SUMMONS = [

  {sc:'aqua', id:'niv', nm:'冰姬', atk:22, hp:52, ttl:18, col:'r'},

  {sc:'wind', id:'syl', nm:'風龍', atk:20, hp:44, ttl:22, col:'m'},
];
const SUMMON_COST = 0.30;
const SUMMON_AT = 4;

/* ── 五系的格數與取得速度 ──────────────────────────────────────
   原本是「每系十格、等級 10 之後每升一級 +1 點」。使用者玩到第五章、
   等級 8 的時候，畫面上是五排各十個空格、手上零點 ——
   他的原話：「很難拿魔法點數……如果原本是設定不太好升級的遊戲參數，
   是不是魔法點數各屬性不需要調這麼多格？也許各 3 格就好？」

   他指到的是真的問題，但病灶不在格數，在**第一點來得太晚**：
   等級 10 之前完全沒有魔法，而戰役前五章的等級只到 8 左右 ——
   也就是說整套魔法系統在前五章根本不存在。

   兩件事一起改：
     · 第一點提前到等級 3 —— 第一章就摸得到魔法。
     · 每系上限 10 → 5 —— 有意義的門檻本來就只有 1（第一個法術）、
       3（第二個）、4（幻獸）、滿級（奧義）四個，塞進十格只是把
       每一點稀釋成看不出差別。五格剛好一格一個門檻。
   威力與魔力上限用 SCH_SCALE 補回來，所以「點滿一系」的強度不變 ——
   改的是節奏，不是數值。 */
const SCH_MAX = 5;
const SCH_SCALE = 10 / SCH_MAX;   // 格數變少，每一格就要更值錢
const SP_FROM_LV = 3;        // 從第 3 級開始，每升一級 +1 魔法點數
const POCKET_LV = 10;        // 萬用口袋還是等級 10 的里程碑，跟魔法點數脫鉤
const spellsFor  = p => SPELLS.filter(sp => (p.sch[sp.sc]||0) >= sp.at);
const summonsFor = p => SUMMONS.filter(sm => (p.sch[sm.sc]||0) >= SUMMON_AT);
const schoolTotal = p => SCHOOLS.reduce((n,s)=> n + (p.sch[s.id]||0), 0);
const maxMp = p => Math.round((8 + (p.lv-1)*3 + schoolTotal(p)*5*SCH_SCALE)
                              * (typeof hasMaster === 'function' && hasMaster('sor') ? 1.2 : 1));
/* 威力跟著系級走 —— 點下去要立刻感覺得到差別，不然沒人願意投資 */
const power = (p, sp, base, per) => base + (p.sch[sp.sc]||0) * per * SCH_SCALE;

/* ── 餘力煉成：魔法點數的出路 ─────────────────────────────────
   使用者的原話：「魔法點數也是，點到滿，結果每升一級都還會有點數，
   感覺一堆點數都不能用，很沒作用⋯」

   五系各 5 級，總共 25 點就到頂；而點數從第 3 級起每升一級就給一點，
   走到後半章節手上會躺著十幾點永遠花不掉的東西。
   一個給了卻不能用的獎勵，比不給還糟 —— 它每一次升級都在提醒玩家
   「這個系統對你已經結束了」。

   所以滿級之後開一條路：把多的點數煉成永久的身體素質。
   三件事是刻意的：
     · 只有五系全滿才開。不然玩家會在前期把點數丟去換數值，
       而魔法系統才是這一款的招牌。
     · 換到的東西存在村莊，跟純淨之泉與勇者的頭盔同一格 ——
       用點數換來的成長不該因為一次失敗蒸發。
     · 沒有上限（除了存檔夾住的那個很大的值）。錢與點數都要有
       一個永遠倒得進去的地方，那才是後期的成就感。 */
const REFINE = [
  {id:'hp',  sp:2, key:'hpBonus',  n:10, cap:400, nm:'體力上限 +10'},
  {id:'str', sp:3, key:'strBonus', n:1,  cap:40,  nm:'力量 +1'},
  {id:'def', sp:3, key:'defBonus', n:1,  cap:40,  nm:'防禦 +1'},
];
const schFull = p => SCHOOLS.every(s => (p.sch[s.id]||0) >= SCH_MAX);
/* 煉成一次。回傳 false 代表點數不夠或已經到頂 —— 呼叫端不必自己再判一次。 */
function refine(p, r){
  if(!r || p.sp < r.sp) return false;
  const cur = VILLAGE[r.key] | 0;
  if(cur >= r.cap) return false;
  p.sp -= r.sp;
  VILLAGE[r.key] = Math.min(r.cap, cur + r.n);
  VILLAGE.sp = p.sp;
  saveVillage();
  // 立刻生效，不必等下一趟。防禦是 pDef() 當場讀村莊的，不用在這裡加。
  if(r.key === 'hpBonus'){ p.mhp += r.n; p.hp += r.n; }
  if(r.key === 'strBonus') p.strb += r.n;
  return true;
}

acti.mine|You wake at the very bottom, remembering nothing. All you know is that you can learn.|いちばん したで めが さめた。なにも おぼえていない。まなべる ことだけを しっている。
acti.forest|In the mist, every step is your own call. Nobody tells you which way is right.|きりの なか、いっぽ いっぽ じぶんで きめる。どちらが ただしいか だれも おしえない。
acti.trial|The path changes. The route you memorised stops working — all you can carry out is how to find a route again.|やまみちは かわる。おぼえた みちは つうじない。もちだせるのは 「みちの さがしかた」だけ。
acti.ordeal|One empty room, four walls feeding things in. This is not a test of skill — it asks whether you last.|からの へや ひとつ、しほうから おくりこまれる。ぎじゅつでは なく、たえられるかを とう。
acti.briar|The flame sorcerer fires every third turn. Read the rhythm and you have already won.|ほのおの じゅつしは 3ターンごとに うつ。リズムが よめれば かちだ。
acti.lake|The water shows what you are now. Not what woke up at the bottom.|みなもは いまの あなたを うつす。めざめた ころとは もう ちがう。
acti.beast|The beasts do not attack. They are waiting for you to prove you deserve their power.|げんじゅうは おそって こない。ちからに ふさわしいと しめすのを まっている。
acti.ninja|The people here dislike being seen. What you must learn is when not to strike.|ここの ものは みられるのを きらう。まなぶのは 「うたない とき」だ。
acti.heian|Three bridges, three lesser kings. Cross them and you are given someone's name.|みっつの はし、みっつの こおう。わたれば ひとりの なまえを もらう。
acti.gaol|Sixteen floors down. Everyone held here once climbed the way you are climbing.|16かい したへ。ここの ものは みな かつて あなたと おなじく のぼった。
acti.mirror|Left and right are swapped. You think you go right — you go left. You cannot even trust yourself.|さゆうが はんてん。みぎと おもえば ひだり。じぶんさえ しんじられない。
acti.crystal|Here light travels straight, and it reflects. For the first time you see the rule itself.|ここでは ひかりは まっすぐ すすみ、はんしゃする。はじめて 「きそく」そのものを みる。
acti.tower|Twenty floors up. At the top there is a door, and behind it is not a place but a time.|20かい うえへ。とうちょうに とびら。その さきは ばしょでは なく じかん。
acti.final|No map. No shop. You do not need them any more.|ちずも みせも ない。もう ひつようが ない。
acti.chaos|No walls here, and no ceiling. Only the Mind — and you, about to become it.|かべも てんじょうも ない。あるのは「いしき」、そして それに なろうと している あなた。

const DICT = (()=>{
  const m = {en:{}, ja:{}};
  for(const line of DICT_RAW.split('\n')){
    const p = line.split('|');
    if(p.length !== 3) continue;
    m.en[p[0]] = p[1]; m.ja[p[0]] = p[2];
  }
  return m;
})();
/* zh 直接回傳 fallback（也就是程式裡的中文原文）—— 中文不需要查表 */
/* 訊息用具名佔位符 —— `{nm}`、`{n}`。用位置參數（{0}{1}）的話，
   譯者看不出第二個數字是傷害還是層數，而看不出來就會翻錯。 */
function M(key, zh, vars){
  let t = TX(key, zh);
  if(vars) for(const k in vars) t = t.split('{'+k+'}').join(vars[k]);
  return t;
}
function TX(key, zh){
  if(LANG === 'zh') return zh;
  const v = DICT[LANG] && DICT[LANG][key];
  return v === undefined ? zh : v;
}
/* 資料表上的名字：id 有衝突的（睡眠之杖 vs 睡眠卷軸、鋼之盾 vs 鋼之劍）
   在詞條裡加前綴，這裡把類別對上去。 */
const NAME_FIX = {'wand/sleep':'w_sleep', 'pot/ident':'p_ident', 'shld/steel':'s_steel'};
function locName(cat, d){
  /* 吃到等級補正的怪物要看得出來。玩家憑什麼知道這一隻洞穴鼠
     跟三層前那一隻不一樣？加在名字上是最不會漏的做法 ——
     名牌、戰鬥訊息、圖鑑全部走這一支，改一個地方就全部一致。 */
  const pfx = (cat === 'mon' && d.lvup) ? TX('mon.pfx','強化的') : '';
  if(LANG === 'zh') return pfx + d.nm;
  if(cat === 'hat')  return TX('hat.' + d.id, d.nm);
  if(cat === 'mon')  return pfx + TX('mon.' + d.id, d.nm);
  const id = NAME_FIX[cat + '/' + d.id] || d.id;
  return TX('it.' + id, d.nm);
}

function locHow(h){

}

/* ─── 決定論亂數 ───────────────────────────────────────────── */
function RNG(seed){
  let s = seed >>> 0 || 1;
  const f = () => { s ^= s<<13; s>>>=0; s ^= s>>17; s ^= s<<5; s>>>=0; return s/4294967296; };
  f.i = (a,b) => a + Math.floor(f()*(b-a+1));
  f.pick = arr => arr[f.i(0,arr.length-1)];
  f.chance = p => f() < p;
  f.shuffle = arr => { for(let i=arr.length-1;i>0;i--){ const j=f.i(0,i); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; };
  f.weight = (arr, wf) => {
    let tot = 0; for(const a of arr) tot += wf(a);
    if(tot<=0) return null;
    let r = f()*tot;
    for(const a of arr){ r -= wf(a); if(r<=0) return a; }
    return arr[arr.length-1];
  };
  return f;
}

const atlas = {};
function bake(rows, w=T, h=T){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const x = c.getContext('2d');
  for(let y=0;y<rows.length;y++){
    const row = rows[y];
    for(let i=0;i<row.length;i++){
      const col = PAL[row[i]];
      if(col){ x.fillStyle=col; x.fillRect(i,y,1,1); }
    }
  }
  return c;
}
for(const k in SPR) atlas[k] = bake(SPR[k]);

/* ── 頭目的外觀 ──────────────────────────────────────────────
   十五隻頭目各畫一張 16x16 不划算，而且會畫得很平。
   改成「同族雜魚的剪影 + 一圈金邊 + 壓暗的底色」：
   玩家一眼就看得出「這一隻不一樣」，剪影又還是認得出是什麼族。 */
const BOSS_BASE = {
  b_warden:'golem', b_treant:'shroom', b_ballista:'turret', b_pyro:'mage',
  b_lord:'slime', b_phoenix:'imp', b_hanzo:'wolf', b_oni:'knight',
  b_gaoler:'skeleton', b_queen:'mage', b_prism:'turret', b_mermaid:'mage',
  b_gate:'knight',

function crownSprite(base){
  const src = atlas[base] || atlas.rat;
  const c = document.createElement('canvas'); c.width=T; c.height=T;
  const x = c.getContext('2d');
  x.drawImage(src, 0, 0);
  // getImageData 不是永遠拿得到（畫布被污染、或在無頭環境跑邏輯測試）。
  // 拿不到就退回原圖 —— 美術效果可以少，遊戲不能因為描邊掛掉。
  const d = x.getImageData(0,0,T,T);
  if(!d || !d.data || !x.createImageData) return c;
  const a = d.data;
  const solid = (px_,y)=> px_>=0 && y>=0 && px_<T && y<T && a[(y*T+px_)*4+3] > 0;
  const out = x.createImageData(T,T);
  for(let y=0;y<T;y++) for(let px_=0;px_<T;px_++){
    const i=(y*T+px_)*4;
    if(solid(px_,y)){                        // 本體壓暗，金邊才跳得出來
      out.data[i]   = a[i]*0.72;
      out.data[i+1] = a[i+1]*0.72;
      out.data[i+2] = a[i+2]*0.78;
      out.data[i+3] = a[i+3];
    } else if(solid(px_-1,y)||solid(px_+1,y)||solid(px_,y-1)||solid(px_,y+1)){
      out.data[i]=245; out.data[i+1]=220; out.data[i+2]=122; out.data[i+3]=255;
    }
  }
  x.putImageData(out,0,0);
  return c;
}
for(const id in BOSS_BASE) atlas[id] = crownSprite(BOSS_BASE[id]);


/* ═══ 通用生物骨架 ═══════════════════════════════════════════
   主角與所有村民共用同一個剪影：寬扁的身體、兩側短鰭、四隻小腳、
   兩顆方眼睛。只換顏色、年齡變體與帽子。

   共用剪影是刻意的 —— 玩家要先認出「這是同一族」，再分辨是誰。
   剪影一致、顏色分派，順序不能反過來。 */
/* 上下要一眼分得出來。舊剪影是「上下對稱的橢圓 + 最寬的一排在正中間」，
   腳只是身體下緣兩根暗色短柱 —— 暗色在暗色描邊旁邊等於沒有畫。
   於是整隻生物讀起來上下顛倒：中間那排側鰭看起來才像張開的腳。

   三個修正，缺一不可：
   1. 頂緣收窄成圓頂，底緣維持寬 —— 重心壓到下面
   2. 最寬的側鰭從 y7 移到 y8–9，也就是身體的下半
   3. 四隻腳寫進剪影本身，讓自動描邊替每一隻畫外框，
      中間那道 2px 的空隙把前腳與後腳分開 */
/* 六種體型。顏色只換色相，換不掉「這隻長什麼樣」——
   而玩家想要的個人化是後者：他要的是「這是我的角色」，
   不是「這是那隻章魚，只是顏色不同」。

   六種都遵守同一組解剖位置：眼睛在 y6、胸口的星在 y9、帽子壓在 y1–5。
   不遵守的話換一個體型帽子就會浮在半空中，職業辨識立刻壞掉。 */
const BLOB_SKINS = {
  /* 六種體型的差別必須是**比例**，不是細節。
     第一版只在同一團身體上加耳朵、加喙、加天線 —— 放大到六倍才看得出來，
     在 16px 的遊戲畫面上六隻長得一模一樣。
     所以這一版每一種的整體輪廓都不同：矮寬 / 瘦高 / 帶耳 / 水滴 / 方正 / 無腳。 */
  blob: [                                   // 史萊姆：矮而寬，最寬的一排在下半
    [4,5,6],[5,4,8],
    [6,3,10],[7,2,12],
    [8,1,14],[9,1,14],[10,1,14],
    [11,2,12],
    [12,2,2],[12,5,2],[12,9,2],[12,12,2],
    [13,2,2],[13,5,2],[13,9,2],[13,12,2],
  ],
  biped: [                                  // 旅人：瘦高，頭與身體之間有脖子
    [1,5,6],[2,4,8],[3,4,8],[4,4,8],
    [5,4,8],[6,4,8],
    [7,6,4],                                // 脖子 —— 這一格是「這是人」的關鍵
    [8,3,10],[9,2,12],[10,3,10],[11,4,8],
    [12,4,2],[12,10,2],
    [13,4,2],[13,10,2],
  ],
  cat: [                                    // 貓：耳朵高過頭頂，尾巴翹在右後方
    [0,3,2],[0,10,2],
    [1,2,4],[1,9,4],
    [2,3,10],[3,3,10],
    [4,3,10],[5,3,10],[6,3,10],[7,3,10],
    [3,13,2],[4,13,2],[5,12,2],             // 尾巴
    [8,2,12],[9,2,12],[10,2,12],[11,3,10],
    [12,3,2],[12,6,2],[12,9,2],
    [13,3,2],[13,6,2],[13,9,2],
  ],
  bird: [                                   // 鳥：上圓下尖的水滴 + 突出的喙
    [2,6,4],[3,5,6],
    [4,4,8],[5,4,8],[6,4,8],
    [6,12,2],[7,13,1],                      // 喙
    [7,4,8],[8,3,10],[9,3,10],
    [10,4,8],[11,5,6],
    [12,5,2],[12,9,2],
    [13,4,3],[13,9,3],
  ],
  bot: [                                    // 機械：完全方正，底下是履帶
    [2,3,10],[3,3,10],[4,3,10],[5,3,10],
    [6,3,10],[7,3,10],
    [8,1,14],[9,1,14],[10,1,14],
    [11,1,14],
    [12,1,14],
    [13,2,3],[13,7,2],[13,11,3],
  ],
  ghost: [                                  // 幽靈：瘦長、沒有腳、下襬是波浪
    [1,5,6],[2,4,8],
    [3,3,10],[4,3,10],[5,3,10],[6,3,10],
    [7,2,12],[8,2,12],[9,2,12],[10,2,12],
    [11,2,12],
    [12,2,3],[12,7,2],[12,11,3],
    [13,2,2],[13,8,1],[13,12,2],
  ],
};
const SKINS = Object.keys(BLOB_SKINS);
/* 可選的顏色。放在美術層 —— heroSprite() 要用，而它在模組初始化時就會跑，
   放在遊戲層（VILLAGE 旁邊）的話會撞上 const 的暫時性死區。 */
const BLOB_COLS = ['#','l','q','u','b','6','m','g','r','v'];
const BLOB_COL_NM = {'#':'陶土','l':'苔綠','q':'湖藍','u':'琥珀','b':'土棕',
                     '6':'霜白','m':'薄荷','g':'緋紅','r':'天青','v':'鎏金'};
const BLOB_CHILD = [
  [4,6,4],
  [5,5,6],[6,4,8],
  [7,3,10],[8,3,10],
  [9,4,8],[10,4,8],
  [11,4,2],[11,7,2],[11,10,2],
  [12,4,2],[12,7,2],[12,10,2],
];
/* 六頂帽子＝六種職業。帽子畫在頭頂那一排，剪影要一眼分得出來 —— 
   職業是靠帽子辨識的，帽子長得像就等於職業長得像。 */
const HAT_ART = {
  // 全部畫在 y1~y4，帽緣壓在身體頂緣（y3）上 —— 浮在頭上會像貼圖不像戴著
  helm:  x=>{ px(x,PAL['0'],3,1,10,4); px(x,PAL['5'],4,2,8,2); px(x,PAL['6'],4,2,8,1);
              px(x,PAL['0'],7,2,2,3); px(x,PAL['4'],2,4,12,1); px(x,PAL['0'],2,5,12,1); },
  cone:  x=>{ px(x,PAL['0'],7,0,2,2); px(x,PAL['0'],6,1,4,1); px(x,PAL['0'],5,2,6,2);
              px(x,PAL['o'],7,0,2,1); px(x,PAL['p'],6,1,4,1); px(x,PAL['o'],5,2,6,1);
              px(x,PAL['0'],2,4,12,2); px(x,PAL['p'],2,4,12,1); px(x,PAL['u'],7,3,2,1); },
  hood:  x=>{ px(x,PAL['0'],4,1,8,5); px(x,PAL['d'],5,2,6,3); px(x,PAL['6'],5,2,6,1);
              px(x,PAL['0'],3,4,10,2); px(x,PAL['d'],3,4,10,1); px(x,PAL['g'],6,4,4,1); },
  // 吟遊詩人：軟呢貝雷帽，帽身偏一邊，右側一撮綠羽
  beret: x=>{ px(x,PAL['0'],4,2,8,3); px(x,PAL['o'],5,3,6,2); px(x,PAL['p'],5,3,5,1);
              px(x,PAL['0'],3,4,10,2); px(x,PAL['o'],3,4,10,1);
              px(x,PAL['0'],11,1,3,2); px(x,PAL['l'],11,2,3,1); px(x,PAL['m'],12,1,2,1); },
  // 赤魔導士：寬簷紅帽 + 白羽。帽簷要比別人寬，剪影才認得出來
  rhat:  x=>{ px(x,PAL['0'],4,1,8,4); px(x,PAL['f'],5,2,6,3); px(x,PAL['g'],5,2,6,1);
              px(x,PAL['0'],1,4,14,2); px(x,PAL['f'],1,4,14,1); px(x,PAL['e'],1,5,14,1);
              px(x,PAL['0'],10,0,4,2); px(x,PAL['6'],10,1,4,1); px(x,PAL['d'],11,0,2,1); },
  // 召喚士：三叉角冠。金色 + 中央一顆藍寶石
  crown: x=>{ px(x,PAL['0'],3,1,10,4);
              px(x,PAL['t'],4,3,8,2); px(x,PAL['u'],4,3,8,1);
              px(x,PAL['0'],4,0,2,3); px(x,PAL['u'],4,1,1,2);
              px(x,PAL['0'],7,0,2,3); px(x,PAL['v'],7,0,2,2);
              px(x,PAL['0'],10,0,2,3); px(x,PAL['u'],11,1,1,2);
              px(x,PAL['q'],7,3,2,1);
              px(x,PAL['0'],3,5,10,1); },
  // 忍者：一條頭帶，兩端在右後方飄。剪影最低調的一頂 —— 那正是忍者
  band:  x=>{ px(x,PAL['0'],3,3,10,3); px(x,PAL['2'],4,4,8,1); px(x,PAL['4'],4,4,8,1);
              px(x,PAL['1'],4,5,8,1);
              px(x,PAL['0'],12,3,3,2); px(x,PAL['4'],12,4,2,1);
              px(x,PAL['0'],12,6,3,2); px(x,PAL['4'],12,6,2,1);
              px(x,PAL['f'],7,4,2,1); },                              // 額心一點赤
  plume: x=>{ px(x,PAL['0'],4,2,8,3); px(x,PAL['j'],5,3,6,2); px(x,PAL['k'],5,3,6,1);
              px(x,PAL['0'],3,4,10,2); px(x,PAL['j'],3,4,10,1);
              px(x,PAL['0'],10,0,3,1); px(x,PAL['m'],10,1,3,1); px(x,PAL['l'],11,2,2,1); },
  // 鬼武者：鬼面兜。黑漆頭盔 + 兩支金色鬼角 + 面頰的赤色鬼面
  oni:   x=>{ px(x,PAL['0'],4,2,8,3); px(x,PAL['1'],5,3,6,2); px(x,PAL['3'],5,3,6,1);
              px(x,PAL['0'],2,4,12,2); px(x,PAL['1'],2,4,12,1); px(x,PAL['e'],4,5,8,1);
              px(x,PAL['0'],1,0,3,4); px(x,PAL['u'],1,1,2,2); px(x,PAL['v'],1,1,1,1);
              px(x,PAL['0'],12,0,3,4); px(x,PAL['u'],13,1,2,2); px(x,PAL['v'],13,1,1,1); },
};
/* body: 色盤索引；age: 'adult'|'old'|'child'；star: 主角的星芒記號 */
function makeBlob(body, {age='adult', star=false, hat=null, dark='0', skin='blob'}={}){
  const c = document.createElement('canvas'); c.width = T; c.height = T;
  const x = c.getContext('2d');
  const child = age === 'child';
  const m = shapeMask(child ? BLOB_CHILD : (BLOB_SKINS[skin] || BLOB_SKINS.blob));
  paintMask(x, m, PAL[body], PAL[dark], null, 99);

  // 眼睛放在身體的上三分之一。放在正中間的話，眼睛會跟最寬的那一排
  // 對齊，整隻生物就失去上下的方向感。
  // y6 而不是 y5：帽緣壓在 y4–5，眼睛放 y5 會被每一頂帽子蓋掉
  const ey = child ? 6 : 6, ex1 = child ? 5 : 4, ex2 = child ? 9 : 10;
  // 亮底 + 暗瞳。全暗的眼睛在深色體型（機械、幽靈）上等於沒有畫 ——
  // 跟怪物用同一套規則：剪影說「是什麼」，眼睛說「牠活著」。
  for(const ex of [ex1, ex2]){
    px(x,PAL['+'],ex,ey,2,2);
    px(x,PAL[dark],ex + (ex<8?1:0),ey+1,1,1);
  }

  // 腳的內側再壓一道暗色 —— 四隻腳之間才有厚度，不會變成一排柵欄
  const ly = child ? 11 : 12;
  // 腳縫只有「真的有腳」的體型才畫。幽靈與機械畫上去會變成浮在裙襬上的兩條線。
  const LEG = {blob:[3,6,10,13], biped:[], cat:[4,7,10], bird:[6,10], bot:[4,9], ghost:[]};
  for(const lx of (child ? [5,8,11] : (LEG[skin] || LEG.blob))) px(x,PAL[dark],lx,ly,1,2);

  // 左上受光：貼著剪影的頂端，不能寫死 y3 —— 矮的體型（史萊姆）
  // 頂端在 y4，寫死的話那一點會浮在身體外面。
  px(x,PAL['6'], child?5:4, maskTop(m)+1, 1, 1);

  if(age === 'old'){                                                    // 老人：白鬍與垂眼
    px(x,PAL['6'],6,9,4,1); px(x,PAL['6'],5,10,6,1);
    px(x,PAL[dark],5,10,1,1); px(x,PAL[dark],10,10,1,1);
    px(x,PAL[dark],ex1,ey+2,2,1); px(x,PAL[dark],ex2,ey+2,2,1);
  }
  if(star){
    // 菱形，不是九宮格。九宮格全填在 16px 下就只是一坨白。
    const sy = 9;
    px(x,PAL['+'],7,sy-1,2,1);
    px(x,PAL['+'],6,sy,4,1);
    px(x,PAL['+'],7,sy+1,2,1);
  }
  if(hat && HAT_ART[hat]) HAT_ART[hat](x);
  return c;
}

/* 「意識」自己畫。第一型態是一隻懸浮的眼睛 —— 它還沒有形體，
   所以不能長得像任何一種生物。 */
atlas.b_mind1 = (()=>{
  const c=document.createElement('canvas'); c.width=T; c.height=T;
  const x=c.getContext('2d');
  const m = shapeMask([[5,4,8],[6,2,12],[7,1,14],[8,1,14],[9,2,12],[10,4,8]]);
  paintMask(x, m, PAL['6'], PAL['0'], null, 99);
  px(x,PAL['n'],6,6,4,4); px(x,PAL['p'],7,7,2,2);       // 虹膜
  px(x,PAL['0'],7,7,1,1);                              // 瞳孔
  px(x,PAL['+'],6,6,1,1);                              // 高光
  return c;
})();
/* 第三型態：跟主角同一個剪影，但整個是暗的 —— 它已經取得了形體，
   而那個形體是你。 */
atlas.b_mind = makeBlob('4', {star:true, dark:'0'});
atlas.b_mind2 = atlas.b_mind;

/* ─── 主角：共用骨架 + 星芒核心 + 看得見的裝備 ────────────────
   為什麼是史萊姆：辨識度高、有記憶點，而且**不需要任何人的授權**。
   直接沿用他人的商標去吸引玩家，正是商標法最在意的用法；
   神韻留下、標誌不用，才是能安心散布的做法。

   為什麼要程序化而不是手打像素字串：裝備必須畫在身上。
   拿了劍卻看不出來，玩家就感覺不到自己變強 —— 而「感覺變強」
   正是這類遊戲唯一的驅動力。 */

function drawHeroWeapon(x, i){
  const bl = ['9','5','6','6','r','f','v','r'][i] || '6';
  const hi = ['8','9','5','t','u','e','u','u'][i] || '9';
  // 屠龍刀與通天之劍的刃比別把厚一格 —— 拿在手上就看得出來換了武器
  const w = (i===5 || i===7) ? 3 : 2;
  px(x,PAL['0'],11,0,3+w,11);
  px(x,PAL[bl],12,1,w,8); px(x,PAL[(i===6||i===7)?'+':'6'],12,1,1,5);   // 刃面高光
  px(x,PAL['0'],10,9,6,2); px(x,PAL[hi],10,9,6,1);       // 護手
  px(x,PAL['0'],12,11,2,4); px(x,PAL[hi],12,11,2,3);     // 握把
  if(i===7) px(x,PAL['v'],12,10,3,1);                    // 通天之劍：護手上的一道金
}
/* 盾牌要有盾牌的剪影。第一版是個長方形 —— 那讀起來是門板，不是盾。
   下緣收尖這一個細節，就是「這是盾」跟「這是一塊板子」的差別。 */
const HERO_SHIELD = [
  [4,1,4],[5,0,6],[6,0,6],[7,0,6],[8,0,6],[9,0,6],
  [10,1,5],[11,1,4],[12,2,3],[13,3,1],
];
function drawHeroShield(x, i){
  // 索引要跟 SHLD 一樣長。少一格不會報錯 —— PAL[undefined] 只是把
  // fillStyle 設成無效值，畫布會沿用上一個顏色，於是新盾牌長得像上一面。
  const fa = ['9','a','5','r','k','d'][i] || '9', rm = ['8','9','4','6','j','u'][i] || '8';
  const m = shapeMask(HERO_SHIELD);
  paintMask(x, m, PAL[rm], PAL['0'], null, 99);
  for(let y=1;y<T-1;y++) for(let j=0;j<T-1;j++)      // 內縮一圈當盾面
    if(m[y][j] && m[y-1][j] && m[y+1][j] && (j===0 || m[y][j-1]) && m[y][j+1]){
      x.fillStyle = PAL[fa]; x.fillRect(j,y,1,1);
    }
  px(x,PAL['d'],1,5,1,2);                             // 高光
  if(i===3){ px(x,PAL['6'],1,7,3,3); px(x,PAL['r'],2,8,2,1); }   // 鏡之盾
  else if(i===4){ px(x,PAL['l'],1,6,2,2); px(x,PAL['l'],2,8,2,2); px(x,PAL['m'],1,6,1,1); }  // 龍鱗
  // 聖域：主角手上這一面只留中央那顆石。整面塗滿的話，
  // 16px 下會變成一塊看不出輪廓的金色方塊，盾就不像盾了。
  else if(i===5){ px(x,PAL['t'],1,6,3,4); px(x,PAL['v'],2,7,2,2); px(x,PAL['+'],2,7,1,1); }
  else px(x,PAL['u'],2,7,2,2);                        // 盾徽
}
let heroCache = {};
/* 體型與顏色由呼叫端傳進來，不在這裡讀 VILLAGE ——
   美術層讀遊戲狀態的話，(1) 產生美術驗收頁時會爆掉，
   (2) 這支在模組初始化時就會跑，那時 VILLAGE 還在 TDZ 裡。 */
function heroSprite(wi, si, hi, skin, col0){
  const sk = SKINS.includes(skin) ? skin : 'blob';
  const col = BLOB_COLS.includes(col0) ? col0 : '#';
  // 快取鍵要含體型與顏色 —— 少了它，換了造型畫面上還是舊的那一隻
  const k = wi + '/' + si + '/' + (hi||'-') + '/' + sk + '/' + col;
  if(heroCache[k]) return heroCache[k];
  const c = document.createElement('canvas'); c.width = T; c.height = T;
  const x = c.getContext('2d');

  x.drawImage(makeBlob(col, {star:true, dark: col==='#' ? '@' : '0', hat:hi, skin:sk}), 0, 0);

  if(si >= 0) drawHeroShield(x, si);
  if(wi >= 0) drawHeroWeapon(x, wi);
  return heroCache[k] = c;
}
atlas.player = heroSprite(-1, -1, null);

/* ─── 道具圖示：參數化生成 ────────────────────────────────────
   81 張手繪不現實。改成「輪廓 x 配色」的生成器 —— 而且輪廓一定要變，
   只換顏色的話玩家會覺得所有草都是同一種。 */
function px(x,c,X,Y,W,H){ if(!c) return; x.fillStyle=c; x.fillRect(X,Y,W||1,H||1); }
function outline(x,pts,col){ x.fillStyle=col; for(const [a,b] of pts) x.fillRect(a,b,1,1); }

/* 由「跨距表」建出遮罩，再自動描邊。
   這樣每種輪廓可以真的長得不一樣，而不是同一個矩形換顏色 ——
   只換顏色的話，玩家會覺得所有草都是同一種，隨機外觀就失去意義了。 */
function shapeMask(spans){
  const m = Array.from({length:T}, ()=>new Array(T).fill(0));
  for(const [y,x0,w] of spans) for(let i=0;i<w;i++) if(x0+i<T && y<T) m[y][x0+i]=1;
  return m;
}
function paintMask(x, m, fill, edge, liquid, liqFrom){
  for(let y=0;y<T;y++) for(let px_=0;px_<T;px_++){
    if(m[y][px_]){
      x.fillStyle = (liquid && y>=liqFrom) ? liquid : fill;
      x.fillRect(px_,y,1,1);
    } else if((m[y-1]&&m[y-1][px_]) || (m[y+1]&&m[y+1][px_]) || m[y][px_-1] || m[y][px_+1]){
      x.fillStyle = edge; x.fillRect(px_,y,1,1);
    }
  }
}

/* 地形的四階色帶：[最暗, 暗, 中, 亮]。原本寫死 w/x/y/z（冷色石階），
   結果十五個章節長得一模一樣 —— 迷霧森林跟礦坑洞穴同一塊地板。
   章節的差別不能只有名字，那是玩家第一眼就會發現的事。 */
const RAMP = ['w','x','y','z'];
function makeFloor(seed, corridor, ramp, soft){
  const R4 = ramp || RAMP;
  const c=document.createElement('canvas'); c.width=T; c.height=T; const x=c.getContext('2d');
  const r = RNG(seed*2654435761);

  x.fillStyle=PAL[base]; x.fillRect(0,0,T,T);

       眼睛就會把它讀成土與草而不是磚。 */
    for(let i=0;i<6;i++){
      const cx0=r.i(0,15), cy0=r.i(0,15), n=r.i(2,4);
      for(let k=0;k<n;k++){
        const px_=Math.min(15,Math.max(0,cx0+r.i(-2,2))), py=Math.min(15,Math.max(0,cy0+r.i(-2,2)));
        x.fillStyle = r.chance(.5)?PAL[lit]:PAL[mortar];

    for(let i=0;i<4;i++) { x.fillStyle=PAL[lit]; x.fillRect(r.i(0,15),r.i(0,15),1,1); }
    return c;
  }
  // 磚縫
  x.fillStyle=PAL[mortar];
  x.fillRect(0,0,T,1); x.fillRect(0,8,T,1);
  x.fillRect(0,0,1,8); x.fillRect(8,8,1,8);
  // 顆粒
  for(let i=0;i<26;i++){
    const px_=r.i(1,15), py=r.i(1,15);
    x.fillStyle = r.chance(.55)?PAL[lit]:PAL[mortar];
    x.fillRect(px_,py,1,1);
  }
  return c;
}

    shade(PAL['0'], (X,Y)=> (X-10)*(X-10) + (Y-19)*(Y-19)*1.4 < 17);   // 眼窩
    shade(PAL['0'], (X,Y)=> (X-22)*(X-22) + (Y-19)*(Y-19)*1.4 < 17);
    shade(PAL['0'], (X,Y)=> Y > 26 && Y < 32 && Math.abs(X-16) < (Y-25)/2); // 鼻腔
    shade(PAL['0'], (X,Y)=> Y > 33 && Y < 43 && (X-16+40) % 4 === 0);       // 齒縫
    shade(PAL[R[2]], (X,Y)=> Y < 12 && hash(X,Y) % 7 === 0);                // 裂痕
  } else if(kind === 'stele'){               // 界碑：圓頂的刻字立石
    rect(4,44,24,4);                         // 基座
    taper(16, 9, 44, 15, 18);
    ell(16,10,8,7);                          // 圓頂
    paint(PAL[R[2]]);
    shade(PAL[R[3]], (X,Y)=> X < 13);
    shade(PAL[R[1]], (X,Y)=> X > 21);
    for(let i=0;i<5;i++) shade(PAL[R[0]], (X,Y)=> Y===19+i*5 && X>10 && X<22);
    shade(PAL[R[0]], (X,Y)=> Y>21 && Y<41 && X===16 && Y%3);
    shade(PAL['j'], (X,Y)=> Y>38 && (X*7+Y*3)%5===0);   // 底部青苔
  } else if(kind === 'lantern'){             // 石燈籠：全戰役唯一會發光的地標
    rect(9,42,14,6); taper(16,30,42,7,11);   // 基座與柱
    ell(16,23,10,8);                         // 火袋
    taper(16,10,17,22,15);                   // 笠
    ell(16,7,4,4);                           // 寶珠
    paint(PAL[R[2]]);
    shade(PAL[R[3]], (X,Y)=> X < 14);
    shade(PAL[R[1]], (X,Y)=> X > 20);
    px(x,O,11,19,10,9);                                 // 火口
    px(x,PAL['h'],12,20,8,7); px(x,PAL['i'],13,21,6,5); px(x,PAL['v'],14,22,4,3);
    px(x,PAL['v'],15,5,2,2);
  } else if(kind === 'torii'){               // 鳥居：一眼就知道進了另一個地方
    rect(4,14,6,34); rect(22,14,6,34);       // 柱
    rect(0,4,32,7);                          // 笠木
    rect(3,16,26,5);                         // 貫
    rect(14,10,4,7);                         // 額束
    paint(PAL[R[2]]);
    shade(PAL[R[3]], (X,Y)=> Y<7 || X===4 || X===22);
    shade(PAL[R[1]], (X,Y)=> Y>=9 && Y<11);
    shade(PAL[R[0]], (X,Y)=> Y>30 && (X*3+Y*5)%13===0);
  } else if(kind === 'mirror'){              // 立鏡：橢圓的鏡面，不是方框
    rect(11,38,10,8); rect(5,45,22,3);       // 支架與底座
    ell(16,21,13,18);                        // 鏡框
    paint(PAL[R[3]]);
    shade(PAL[R[2]], (X,Y)=> X > 18);
    clear(); ell(16,21,10,15);
    paint(PAL[R[0]]);                        // 鏡面：暗的，才照得出反光
    shade(PAL[R[2]], (X,Y)=> ((X*2 + Y) % 17) < 3);
    shade(PAL['6'],  (X,Y)=> ((X*2 + Y) % 17) === 0 && X < 16);
  } else if(kind === 'geode'){               // 水晶簇：高低錯落的柱體
    const sp = [[7,20,5,28],[13,8,7,40],[21,17,6,31],[3,31,5,17],[26,26,5,22]];
    for(const [sx,sy,sw,sh] of sp){ clear(); taper(sx+sw/2, sy, sy+sh, sw*0.5, sw);
      paint(PAL[R[1]]);
      shade(PAL[R[3]], (X,Y)=> X < sx+sw*0.5);
      shade(PAL['6'],  (X,Y)=> X < sx+sw*0.25 && Y < sy+sh*0.6); }
    clear(); rect(3,43,26,5); paint(PAL[R[1]]);
  } else if(kind === 'statue'){              // 守望像：有兜帽的人形，沒有臉
    rect(5,43,22,5);                         // 台座
    taper(16,20,43,11,20);                   // 衣襬
    rect(3,20,26,5);                         // 張開的雙臂
    ell(16,14,6,7);                          // 兜帽
    paint(PAL[R[2]]);
    shade(PAL[R[3]], (X,Y)=> X < 15);
    shade(PAL[R[1]], (X,Y)=> X > 20);
    shade(PAL[R[0]], (X,Y)=> Y>12 && Y<19 && X>12 && X<20);   // 兜帽下的暗
    shade(PAL[R[0]], (X,Y)=> Y>24 && Y<43 && (X-16+((Y-24)>>2))%6===0);
    px(x,PAL['u'],14,11,4,2);
  } else if(kind === 'rift'){                // 虛空的裂隙：不是物體，是缺口
    for(let i=0;i<15;i++){ const w = 3 + Math.abs(7-i)*1.4;
      rect(Math.round(16-w), 6+i*3, Math.round(w*2), 3); }
    paint(PAL['1']);
    shade(PAL['4'], (X,Y)=> Math.abs(X-16) < 4);
    shade(PAL['6'], (X,Y)=> Math.abs(X-16) < 2 && Y > 12 && Y < 38);
    for(let i=0;i<26;i++) px(x, i%3 ? PAL['5'] : PAL['6'], 16+r.i(-10,9), r.i(4,46), 1, 1);
  } else {                                   // stone：礦車
    rect(9,42,6,6); rect(19,42,6,6);         // 輪
    taper(16,26,43,26,18);                   // 車斗
    paint(PAL[R[2]]);
    shade(PAL[R[3]], (X,Y)=> Y < 29 || X < 8);
    shade(PAL[R[1]], (X,Y)=> X > 21);
    shade(PAL[R[0]], (X,Y)=> Y>32 && (Y-32)%5===0);          // 鉚接的橫帶
    shade(PAL[R[0]], (X,Y)=> Y>=42 && ((X-12)*(X-12)+(Y-45)*(Y-45) < 4 ||
                                       (X-22)*(X-22)+(Y-45)*(Y-45) < 4));
    px(x,PAL['a'],7,27,7,5); px(x,PAL['c'],9,28,4,3);        // 車裡的礦石
    px(x,PAL['b'],16,27,6,4); px(x,PAL['d'],18,28,3,2);
    clear(); rect(1,2,4,30); paint(PAL[R[1]]);               // 靠在旁邊的坑木
    shade(PAL[R[0]], (X,Y)=> Y%6===0);
  }
  return c;
}
const THEME_MARK = {};
function markFor(theme){
  if(THEME_MARK[theme] !== undefined) return THEME_MARK[theme];
  const th = THEMES[theme] || THEMES.stone;
  return THEME_MARK[theme] = th.mark ? makeLandmark(th.mark, th.ramp) : null;
}

const THEME_PROPS = {};
function propsFor(theme){
  if(THEME_PROPS[theme]) return THEME_PROPS[theme];
  const th = THEMES[theme] || THEMES.stone;
  if(!th.prop) return THEME_PROPS[theme] = PROPS;
  return THEME_PROPS[theme] = [0,1,2,3].map(i => themeProp(th.prop, i, th.ramp));
}
