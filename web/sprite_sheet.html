/* ─── 決定論亂數 ───────────────────────────────────────────── */
function RNG(seed){
  let s = seed >>> 0 || 1;
  const f = () => { s ^= s<<13; s>>>=0; s ^= s>>17; s ^= s<<5; s>>>=0; return s/4294967296; };
  f.i = (a,b) => a + Math.floor(f()*(b-a+1));
  f.pick = arr => arr[f.i(0,arr.length-1)];
  f.chance = p => f() < p;
  f.shuffle = arr => { for(let i=arr.length-1;i>0;i--){ const j=f.i(0,i); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; };
  f.weight = (arr, wf) => {
    let tot = 0; for(const a of arr) tot += wf(a);
    if(tot<=0) return null;
    let r = f()*tot;
    for(const a of arr){ r -= wf(a); if(r<=0) return a; }
    return arr[arr.length-1];
  };
  return f;
}

/* ─── 精靈圖集：把像素資料燒進離屏 canvas ─────────────────── */
const atlas = {};
function bake(rows, w=T, h=T){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const x = c.getContext('2d');
  for(let y=0;y<rows.length;y++){
    const row = rows[y];
    for(let i=0;i<row.length;i++){
      const col = PAL[row[i]];
      if(col){ x.fillStyle=col; x.fillRect(i,y,1,1); }
    }
  }
  return c;
}
for(const k in SPR) atlas[k] = bake(SPR[k]);

/* ─── 道具圖示：參數化生成 ────────────────────────────────────
   81 張手繪不現實。改成「輪廓 x 配色」的生成器 —— 而且輪廓一定要變，
   只換顏色的話玩家會覺得所有草都是同一種。 */
function px(x,c,X,Y,W,H){ if(!c) return; x.fillStyle=c; x.fillRect(X,Y,W||1,H||1); }
function outline(x,pts,col){ x.fillStyle=col; for(const [a,b] of pts) x.fillRect(a,b,1,1); }

/* 由「跨距表」建出遮罩，再自動描邊。
   這樣每種輪廓可以真的長得不一樣，而不是同一個矩形換顏色 ——
   只換顏色的話，玩家會覺得所有草都是同一種，隨機外觀就失去意義了。 */
function shapeMask(spans){
  const m = Array.from({length:T}, ()=>new Array(T).fill(0));
  for(const [y,x0,w] of spans) for(let i=0;i<w;i++) if(x0+i<T && y<T) m[y][x0+i]=1;
  return m;
}
function paintMask(x, m, fill, edge, liquid, liqFrom){
  for(let y=0;y<T;y++) for(let px_=0;px_<T;px_++){
    if(m[y][px_]){
      x.fillStyle = (liquid && y>=liqFrom) ? liquid : fill;
      x.fillRect(px_,y,1,1);
    } else if((m[y-1]&&m[y-1][px_]) || (m[y+1]&&m[y+1][px_]) || m[y][px_-1] || m[y][px_+1]){
      x.fillStyle = edge; x.fillRect(px_,y,1,1);
    }
  }
}
function maskTop(m){ for(let y=0;y<T;y++) for(let x2=0;x2<T;x2++) if(m[y][x2]) return y; return 0; }
function maskBottom(m){ for(let y=T-1;y>=0;y--) for(let x2=0;x2<T;x2++) if(m[y][x2]) return y; return T-1; }

/* 六種瓶形 —— 圓底燒瓶 / 高細瓶 / 扁圓罐 / 錐形瓶 / 葫蘆瓶 / 安瓿 */

  [[3,6,4],[4,5,6],[5,5,6],[6,6,4],[7,6,4],[8,4,8],[9,3,10],[10,3,10],[11,3,10],[12,4,8],[13,5,6]],

function makeHerb(v){
  const c=document.createElement('canvas'); c.width=T; c.height=T; const x=c.getContext('2d');
  const liquids=['g','h','v','r','l','q','m','u','p','f','i','k','6','b'];
  const m = shapeMask(BOTTLE[v % BOTTLE.length]);
  const top = maskTop(m), bot = maskBottom(m);
  paintMask(x, m, PAL['3'], PAL['0'], PAL[liquids[v % liquids.length]],
            top + Math.ceil((bot-top)*0.45));
  px(x,PAL['9'],7,top-3,2,3); px(x,PAL['8'],7,top-1,2,1);   // 軟木塞
  px(x,PAL['6'],Math.floor(T/2)-2, top+2, 1, 2);            // 玻璃高光
  return c;
}

/* 六種壺形 —— 圓肚 / 細頸 / 裂痕 / 素燒 / 藍紋 / 缺口 */
const JAR = [
  [[4,6,4],[5,4,8],[6,3,10],[7,3,10],[8,3,10],[9,3,10],[10,3,10],[11,3,10],[12,4,8],[13,5,6]],

  [[4,5,6],[5,4,8],[6,4,8],[7,4,8],[8,4,8],[9,4,8],[10,4,8],[11,4,8],[12,4,8],[13,4,8]],
  [[4,6,4],[5,4,8],[6,4,8],[7,4,8],[8,4,8],[9,4,8],[10,4,8],[11,4,8],[12,4,8],[13,3,10]],
  [[4,5,3],[4,9,2],[5,4,8],[6,3,10],[7,3,10],[8,3,10],[9,3,10],[10,3,10],[11,3,10],[12,3,10],[13,4,8]],
];
function makePot(v){
  const c=document.createElement('canvas'); c.width=T; c.height=T; const x=c.getContext('2d');
  const clays=['b','a','c','9','5','8'], marks=['p','g','j','u','r','1'];
  const shape = v % JAR.length;
  const m = shapeMask(JAR[shape]);
  paintMask(x, m, PAL[clays[v % clays.length]], PAL['0'], null, 99);
  const mk = PAL[marks[v % marks.length]];
  if(shape===2){ px(x,PAL['0'],7,6,1,6); px(x,PAL['0'],8,8,1,3); }        // 裂痕
  else if(shape===4){ px(x,mk,4,7,8,1); px(x,mk,4,10,8,1); }              // 環紋
  else if(shape===0){ px(x,mk,4,8,8,2); }

function makeFloor(seed, corridor){
  const c=document.createElement('canvas'); c.width=T; c.height=T; const x=c.getContext('2d');
  const r = RNG(seed*2654435761);
  const base = corridor?'8':'9', lit = corridor?'9':'a', mortar = corridor?'7':'8';
  x.fillStyle=PAL[base]; x.fillRect(0,0,T,T);
  // 磚縫
  x.fillStyle=PAL[mortar];
  x.fillRect(0,0,T,1); x.fillRect(0,8,T,1);
  x.fillRect(0,0,1,8); x.fillRect(8,8,1,8);
  // 顆粒
  for(let i=0;i<26;i++){
    const px_=r.i(1,15), py=r.i(1,15);
    x.fillStyle = r.chance(.55)?PAL[lit]:PAL[mortar];
    x.fillRect(px_,py,1,1);
  }
  return c;
}
function makeWall(face){
  const c=document.createElement('canvas'); c.width=T; c.height=T; const x=c.getContext('2d');
  const r=RNG(99173);
  x.fillStyle=PAL['1']; x.fillRect(0,0,T,T);
  // 石塊
  x.fillStyle=PAL['2'];
  x.fillRect(1,1,6,6); x.fillRect(9,1,6,6); x.fillRect(1,9,6,6); x.fillRect(9,9,6,6);
  x.fillStyle=PAL['3'];
  x.fillRect(1,1,6,1); x.fillRect(9,1,6,1); x.fillRect(1,9,6,1); x.fillRect(9,9,6,1);
  for(let i=0;i<18;i++){ x.fillStyle = r.chance(.5)?PAL['3']:PAL['0']; x.fillRect(r.i(0,15),r.i(0,15),1,1); }
  if(face){
    // 立面：下方有地板時畫出厚度，深度感就出來了
    x.fillStyle=PAL['4']; x.fillRect(0,10,T,1);
    x.fillStyle=PAL['3']; x.fillRect(0,11,T,2);
    x.fillStyle=PAL['1']; x.fillRect(0,13,T,3);
    x.fillStyle=PAL['0']; x.fillRect(0,15,T,1);
    for(let i=0;i<5;i++) x.fillRect(r.i(0,15),r.i(11,14),1,1);
  }
  return c;
}
function makeStairs(){

/* ─── 地圖生成 ────────────────────────────────────────────────
   30x30 切 3x3 區域 → 各區生成房間 → 區域鄰接圖取隨機生成樹保證連通
   → 注入環路（避免死路必死）→ Z 字形通道。 */
const MW=30, MH=30, ZW=10, ZH=10, MARGIN=1;
const WALL=0, ROOM=1, CORR=2, DOWN=3;

function genFloor(rng, depth){
  const t = new Uint8Array(MW*MH);
  const roomAt = new Int8Array(MW*MH).fill(-1);
  const zones=[];
  for(let zy=0;zy<3;zy++) for(let zx=0;zx<3;zx++)
    zones.push({i:zy*3+zx, zx, zy, x0:zx*ZW, y0:zy*ZH, x1:zx*ZW+ZW-1, y1:zy*ZH+ZH-1});

  const rooms={}, junc={};
  const emptyN = Math.min(rng.i(0,3), 3);
  const empties = new Set(rng.shuffle(zones.map(z=>z.i)).slice(0,emptyN));
  for(const z of zones){
    const ux0=z.x0+MARGIN, ux1=z.x1-MARGIN, uy0=z.y0+MARGIN, uy1=z.y1-MARGIN;
    if(empties.has(z.i)){ junc[z.i]={x:rng.i(ux0+1,ux1-1), y:rng.i(uy0+1,uy1-1)}; continue; }
    const w=rng.i(3,7), h=rng.i(3,7);
    const x=rng.i(ux0,ux1-w+1), y=rng.i(uy0,uy1-h+1);
    rooms[z.i]={x,y,w,h,doors:[]};
  }
  for(const k in rooms){ const r=rooms[k];
    for(let y=r.y;y<r.y+r.h;y++) for(let x=r.x;x<r.x+r.w;x++){ t[y*MW+x]=ROOM; roomAt[y*MW+x]=+k; } }

  // 生成樹 + 環路
  const cand=[];
  for(const a of zones) for(const b of zones)
    if(a.i<b.i && Math.abs(a.zx-b.zx)+Math.abs(a.zy-b.zy)===1) cand.push([a.i,b.i]);
  rng.shuffle(cand);
  const par=[...Array(9).keys()];
  const find=a=>{ while(par[a]!==a){ par[a]=par[par[a]]; a=par[a]; } return a; };
  const tree=[], rest=[];
  for(const e of cand){ const ra=find(e[0]), rb=find(e[1]);
    if(ra!==rb){ par[ra]=rb; tree.push(e); } else rest.push(e); }
  const loopP = Math.max(.08, .25 - depth*.005);
  const edges = tree.concat(rest.filter(()=>rng.chance(loopP)));

  const port=(zi,side)=>{
    if(junc[zi]) return junc[zi];
    const r=rooms[zi];
    if(side==='R') return {x:r.x+r.w,   y:rng.i(r.y,r.y+r.h-1)};
    if(side==='L') return {x:r.x-1,     y:rng.i(r.y,r.y+r.h-1)};
    if(side==='D') return {x:rng.i(r.x,r.x+r.w-1), y:r.y+r.h};
    return {x:rng.i(r.x,r.x+r.w-1), y:r.y-1};
  };
  const carveH=(a,b,y)=>{ for(let x=Math.min(a,b);x<=Math.max(a,b);x++) if(t[y*MW+x]===WALL) t[y*MW+x]=CORR; };
  const carveV=(a,b,x)=>{ for(let y=Math.min(a,b);y<=Math.max(a,b);y++) if(t[y*MW+x]===WALL) t[y*MW+x]=CORR; };
  const door=(zi,p)=>{ if(rooms[zi]) rooms[zi].doors.push(p.x+','+p.y); };

  for(const [ia,ib] of edges){
    const za=zones[ia], zb=zones[ib];
    if(za.zy===zb.zy){
      const L = za.zx<zb.zx?za:zb, R = za.zx<zb.zx?zb:za;
      const pa=port(L.i,'R'), pb=port(R.i,'L'), mid=rng.i(pa.x,pb.x);
      carveH(pa.x,mid,pa.y); carveV(pa.y,pb.y,mid); carveH(mid,pb.x,pb.y);
      door(L.i,pa); door(R.i,pb);
    } else {
      const U = za.zy<zb.zy?za:zb, D = za.zy<zb.zy?zb:za;
      const pa=port(U.i,'D'), pb=port(D.i,'U'), mid=rng.i(pa.y,pb.y);
      carveV(pa.y,mid,pa.x); carveH(pa.x,pb.x,mid); carveV(mid,pb.y,pb.x);
      door(U.i,pa); door(D.i,pb);
    }
  }

  // 出生點與樓梯：樓梯放在區域圖上最遠處，避免「落地就下樓」的退化玩法
  const keys=Object.keys(rooms);
  const spawnKey = rng.pick(keys);
  const sr = rooms[spawnKey];
  const spawn = {x:rng.i(sr.x,sr.x+sr.w-1), y:rng.i(sr.y,sr.y+sr.h-1)};
  const adj={}; for(const [a,b] of edges){ (adj[a]=adj[a]||[]).push(b); (adj[b]=adj[b]||[]).push(a); }
  const dist={[+spawnKey]:0}; const q=[+spawnKey];
  while(q.length){ const z=q.shift(); for(const n of (adj[z]||[])) if(dist[n]===undefined){ dist[n]=dist[z]+1; q.push(n); } }
  const far = keys.filter(k=>k!==spawnKey).sort((a,b)=>(dist[b]||0)-(dist[a]||0)).slice(0,3);
  const dk = far.length?rng.pick(far):spawnKey;
  const dr = rooms[dk];
  const stairs = {x:rng.i(dr.x,dr.x+dr.w-1), y:rng.i(dr.y,dr.y+dr.h-1)};
  t[stairs.y*MW+stairs.x]=DOWN;

  return {t, roomAt, rooms, spawn, stairs, depth};
}
