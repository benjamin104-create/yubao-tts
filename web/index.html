  if(flashCache[name]) return flashCache[name];
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0);
  x.globalCompositeOperation = 'source-in';
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  return flashCache[name] = c;
}

/* 火把：三張輪播的火焰。火焰不對稱才會像在燒，
   完全對稱的火焰看起來像一片葉子。 */
function makeTorch(f){
  const c = document.createElement('canvas'); c.width = T; c.height = T;
  const x = c.getContext('2d');
  px(x, PAL['0'], 6, 9, 4, 5);  px(x, PAL['9'], 7, 10, 2, 4);      // 壁座
  px(x, PAL['8'], 5, 13, 6, 1); px(x, PAL['0'], 5, 14, 6, 1);
  const S = [                                                       // 三張火焰的跨距
    [[3,7,2],[4,6,4],[5,6,4],[6,5,5],[7,6,4],[8,7,2]],
    [[2,8,2],[3,7,3],[4,6,4],[5,6,5],[6,6,4],[7,7,3],[8,7,2]],
    [[3,6,3],[4,6,4],[5,5,5],[6,6,4],[7,6,3],[8,7,2]],
  ][f];
  for(const [y,x0,w] of S){ px(x, PAL['g'], x0, y, w, 1); }         // 外焰
  for(const [y,x0,w] of S){ if(w>2) px(x, PAL['i'], x0+1, y, w-2, 1); }
  px(x, PAL['v'], 7, 6, 2, 3);                                      // 焰心
  return c;
}
const TORCH = [makeTorch(0), makeTorch(1), makeTorch(2)];

/* 幻獸：四隻共用一套「懸浮元素體」的骨架，只換顏色與外圈形狀。
   共用骨架是刻意的 —— 玩家要一眼認出「這是我召的東西」，
   然後才是分辨是哪一隻。剪影一致、顏色分派，就是這個順序。 */
function makeSummon(colKey, shape){
  const c = document.createElement('canvas'); c.width = T; c.height = T;
  const x = c.getContext('2d');
  const col = PAL[colKey], dark = PAL['0'], lite = PAL['6'];
  const CORE = [[5,7,2],[6,6,4],[7,5,6],[8,5,6],[9,6,4],[10,7,2]];
  paintMask(x, shapeMask(CORE), col, dark, null, 99);
  px(x,lite,7,6,1,2);
  px(x,dark,6,7,1,1); px(x,dark,9,7,1,1);              // 眼
  if(shape === 0){                                      // 炎：向上竄的火舌
    px(x,col,7,2,2,3); px(x,lite,7,2,1,1);
    px(x,col,5,4,1,2);  px(x,col,10,4,1,2);
  } else if(shape === 1){                               // 冰：六角結晶環
    px(x,col,2,7,2,2); px(x,col,12,7,2,2);
    px(x,col,7,3,2,2); px(x,col,7,11,2,2);
    px(x,lite,7,3,1,1);
  } else if(shape === 2){                               // 雷：外圍的閃電折線
    px(x,col,3,5,1,2); px(x,col,4,7,1,2); px(x,col,3,9,1,2);
    px(x,col,12,5,1,2); px(x,col,11,7,1,2); px(x,col,12,9,1,2);
    px(x,lite,7,1,2,2);
  } else {                                              // 風：環繞的氣旋
    px(x,col,3,6,3,1); px(x,col,2,8,3,1); px(x,col,3,10,3,1);
    px(x,col,10,6,3,1); px(x,col,11,8,3,1); px(x,col,10,10,3,1);
  }
  px(x,dark,5,13,6,1); px(x,col,6,14,4,1);              // 底下的懸浮尾焰
  return c;
}
const SUMMON_ART = {
  ifr: makeSummon('h', 0), niv: makeSummon('r', 1),
  ram: makeSummon('q', 2), syl: makeSummon('m', 3),
};

/* 店員：地牢裡唯一不會攻擊你的人形。用金紫配色跟所有怪物拉開距離 ——
   玩家必須在第一眼就知道「這個不能打」。 */
const KEEPER = (()=>{
  const c = document.createElement('canvas'); c.width = T; c.height = T;
  const x = c.getContext('2d');
  px(x,PAL['0'],4,1,8,6);  px(x,PAL['o'],5,2,6,4);                 // 帽子
  px(x,PAL['p'],5,2,6,1);  px(x,PAL['u'],5,5,6,1);
  px(x,PAL['0'],4,6,8,5);  px(x,PAL['d'],5,7,6,3);                 // 臉
  px(x,PAL['0'],6,8,1,1);  px(x,PAL['0'],9,8,1,1);
  px(x,PAL['0'],3,10,10,5); px(x,PAL['o'],4,11,8,4);               // 長袍
  px(x,PAL['u'],7,11,2,4);                                          // 前襟
  px(x,PAL['t'],4,11,1,3); px(x,PAL['t'],11,11,1,3);
  return c;
})();

/* 地面雜物：裂縫 / 碎石 / 苔 / 骨 / 水漬。
   一整層只鋪同一張地磚，走起來會像跑步機；雜物是打破重複感最便宜的手段。 */
function makeProp(i){
  const c = document.createElement('canvas'); c.width = T; c.height = T;
  const x = c.getContext('2d');
  // 全部壓在地形自己的冷色階裡。飽和的苔綠與水藍會被玩家讀成「可以撿的東西」，
  // 那就違反了整套配色規則：暖色與飽和色只屬於活的東西和道具。
  if(i === 0){ px(x,PAL['0'],4,9,1,3); px(x,PAL['0'],5,11,3,1); px(x,PAL['0'],8,10,1,2); }
  else if(i === 1){ px(x,PAL['z'],3,11,2,1); px(x,PAL['y'],9,9,2,1); px(x,PAL['z'],11,12,1,1);
                    px(x,PAL['0'],3,12,2,1); px(x,PAL['0'],9,10,2,1); }
  else if(i === 2){ px(x,PAL['w'],4,10,4,2); px(x,PAL['j'],5,10,2,1);
                    px(x,PAL['w'],10,8,3,2); px(x,PAL['j'],10,8,2,1); }
  else if(i === 3){ px(x,PAL['0'],5,10,6,1); px(x,PAL['z'],5,9,6,1);
                    px(x,PAL['z'],4,8,2,1); px(x,PAL['z'],10,8,2,1); px(x,PAL['0'],4,10,8,1); }
  else { px(x,PAL['0'],4,10,7,2); px(x,PAL['w'],5,10,5,1); px(x,PAL['x'],6,10,2,1); }
  return c;
}
const PROPS = [makeProp(0),makeProp(1),makeProp(2),makeProp(3),makeProp(4)];

/* 粒子：踩地的塵、命中的火星、死亡的爆散。
   全部共用一個陣列，畫面上永遠不會超過兩三百顆，直接畫矩形最快。 */
function burst(x, y, n, col, spd, up, life){
  if(!G || !G.parts) return;
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = spd*(0.35+Math.random()*0.65);
    G.parts.push({
      px: x*T + 4 + Math.random()*8, py: y*T + 6 + Math.random()*7,
      vx: Math.cos(a)*v, vy: Math.sin(a)*v - (up||0),
      t: 0, life: life || (0.35+Math.random()*0.3),
      col, s: Math.random()<.3 ? 2 : 1,
    });
  }
}
/* 空氣中的浮塵：跟著鏡頭在世界座標裡飄，不是貼在螢幕上。
   貼在螢幕上的粒子會在鏡頭移動時「跟著走」，一眼就穿幫。 */
const MOTES = [];
for(let i=0;i<16;i++) MOTES.push({
  x: Math.random(), y: Math.random(),
  sp: .12+Math.random()*.22, ph: Math.random()*Math.PI*2, a: .18+Math.random()*.3,
});

/* ═══ 繪製 ═══════════════════════════════════════════════════ */
const cv = document.getElementById('game'), cx = cv.getContext('2d');
cx.imageSmoothingEnabled = false;
let camX=0, camY=0;

// 背包面板寬度換算成格數 —— 面板是 CSS 尺寸、畫面是像素尺寸，
// 硬寫常數會在改版面時失準，直接量。
function panelTiles(){
  const w = cv.getBoundingClientRect().width;
  if(!w) return 6.6;
  return document.getElementById('panel').getBoundingClientRect().width / (w/VW);
}
let lastOx=0, lastOy=0, rockPat=null;

function draw(dt){
  if(!G) return;
  // 鏡頭永遠對準玩家，不夾在地圖邊界內。
  // 夾住的話玩家走到邊角時房間會被推到畫面一側，另一半是死黑；
  // 而地圖外和未探索一樣是黑的，不夾反而構圖永遠是平衡的。
  // 背包開著時把鏡頭往右推，玩家才不會被面板蓋住。
  const shift = panelMode ? panelTiles()/2 : 0;
  const tx = G.p.x - VW/2 + .5 + shift, ty = G.p.y - VH/2 + .5;
  camX += (tx - camX) * Math.min(1, dt*14);
  camY += (ty - camY) * Math.min(1, dt*14);

  const ox = -Math.round(camX*T), oy = -Math.round(camY*T);
  // 岩盤鋪底，隨鏡頭捲動 —— 對齊 32px 的圖樣週期就不會有接縫閃爍
  if(!rockPat) rockPat = cx.createPattern(TILE_ART.rock, 'repeat');
  cx.save();
  cx.translate(ox % 32, oy % 32);
  cx.fillStyle = rockPat;
  cx.fillRect(-32, -32, cv.width+64, cv.height+64);
  cx.restore();

  const x0=Math.max(0,Math.floor(camX)-1), x1=Math.min(MW-1,Math.ceil(camX+VW)+1);
  const y0=Math.max(0,Math.floor(camY)-1), y1=Math.min(MH-1,Math.ceil(camY+VH)+1);

  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const s = G.seen[key(x,y)]; if(!s) continue;
    const px_=ox+x*T, py=oy+y*T, t=tileAt(x,y);
    if(t===WALL){
      cx.drawImage(walkable(x,y+1) ? TILE_ART.wallFace : TILE_ART.wall, px_, py);
    } else if(t===DOWN){
      cx.drawImage(TILE_ART.stairs, px_, py);
    } else {
      const arr = t===CORR ? TILE_ART.corr : TILE_ART.floor;
      cx.drawImage(arr[(x*7+y*13)%arr.length], px_, py);
      // 地面雜物：用座標雜湊決定，所以同一格永遠長一樣，不會每幀閃爍
      const h = (x*73856093 ^ y*19349663) >>> 0;
      if(h % 9 === 0) cx.drawImage(PROPS[(h>>4) % PROPS.length], px_, py);
    }
    if(s===1){ cx.fillStyle='rgba(0,0,0,.62)'; cx.fillRect(px_,py,T,T); }   // 記憶：只記地形
  }

  // 店鋪地板鋪一層暖色地毯：踏進去就知道規則不一樣了
  if(G.shop){
    const r = G.f.rooms[G.shop.room];
    if(r) for(let y=r.y;y<r.y+r.h;y++) for(let x=r.x;x<r.x+r.w;x++){
      if(G.seen[key(x,y)] !== 2) continue;
      cx.fillStyle = 'rgba(168,60,50,.16)';
      cx.fillRect(ox+x*T, oy+y*T, T, T);
    }
  }

  // 牆上的火把（只在看得見的時候燒）
  const litTorches = [];
  for(const tc of G.torches){
    const s = G.seen[key(tc.x,tc.y)]; if(s !== 2) continue;
    const f = ((clock*9 + tc.x*2 + tc.y*3) | 0) % 3;      // 每支火把的相位不同才不會同步跳動
    cx.drawImage(TORCH[f], ox+tc.x*T, oy+tc.y*T);
    litTorches.push(tc);
  }

  // 地面物件（只在可見時畫 —— 記憶不記得道具與怪物）
  // 每個可拾取的東西都墊一圈黃銅底座：即使圖示本身看不懂，
  // 「這一格有東西可以撿」永遠是看得出來的。
  const plate=(x,y,col)=>{
    cx.fillStyle=col; cx.fillRect(ox+x*T+3, oy+y*T+13, 10, 2);
    cx.fillRect(ox+x*T+2, oy+y*T+14, 12, 1);
  };
  // 地上的東西會慢慢上下浮動 —— 靜止的圖示會被當成地板花紋，浮動的會被當成「可以撿」
  const bobItem = (x,y)=> Math.sin(clock*2.2 + (x*3+y*5)) > .2 ? -1 : 0;
  for(const k in G.gold){ const x=k%MW, y=(k/MW)|0;
    if(G.seen[k]===2){ const b=bobItem(x,y); plate(x,y,'rgba(220,174,53,.30)'); cx.drawImage(goldIcon, ox+x*T, oy+y*T+b); } }
  for(const k in G.traps){ const x=k%MW, y=(k/MW)|0;
    if(G.seen[k]===2) cx.drawImage(trapIcon, ox+x*T, oy+y*T); }
  for(const k in G.items){ const x=k%MW, y=(k/MW)|0;
    if(G.seen[k]===2){ const b=bobItem(x,y); plate(x,y,'rgba(220,174,53,.30)'); cx.drawImage(iconOf(G.items[k]), ox+x*T, oy+y*T+b); } }

  // 屍體：死掉之後還要留 0.4 秒往上飄散，不然怪物是「消失」不是「被打倒」
  for(const c of G.corpses){
    const k = c.t/0.4;
    cx.save(); cx.globalAlpha = Math.max(0, 1-k);
    cx.drawImage(c.img, Math.round(ox+c.x*T), Math.round(oy+c.y*T - k*6));
    cx.restore();
  }

  // 實體（含位移插值、待機起伏、攻擊前衝）
  const entPos=(o)=>{
    const a = G.anim.find(v=>v.o===o);
    if(!a) return [o.x, o.y];
    const k = 1-Math.min(1, a.t/.11);
    return [o.x + (a.fx-o.x)*k, o.y + (a.fy-o.y)*k];
  };
  // 待機起伏刻意用 1px 的離散跳動，不是平滑的次像素位移 ——
  // 像素風的動畫本來就該是一格一格的，平滑插值反而會糊掉。
  const bobOf = (o, ph)=>{
    if(o.st && (o.st['睡'] || o.st['麻'])) return 0;
    return Math.sin(clock*3.4 + ph) > .45 ? -1 : 0;
  };
  // 攻擊時往目標方向衝出去再回來（0→最遠→0），命中感有一半來自這個
  const lungeOf = (o)=>{
    if(!o.lunge) return [0,0];
    const k = Math.sin(Math.min(1, o.lunge.t/.19) * Math.PI);
    return [o.lunge.dx*k*5, o.lunge.dy*k*5];
  };
  // 影子：像素圖直接貼在地磚上會「浮」，一圈暗底就把它壓回地面，
  // 同時在生物與地板之間插進一道暗邊，剪影才切得乾淨。
  const shadow=(dx,dy)=>{
    cx.fillStyle='rgba(0,0,0,.42)';
    cx.fillRect(Math.round(ox+dx*T)+3, Math.round(oy+dy*T)+13, 10, 3);
    cx.fillRect(Math.round(ox+dx*T)+2, Math.round(oy+dy*T)+14, 12, 1);
  };
  const drawEnt=(o, img, name, ph)=>{
    const [dx,dy] = entPos(o);
    const [lx2,ly2] = lungeOf(o);
    const X = Math.round(ox+dx*T + lx2), Y = Math.round(oy+dy*T + ly2 + bobOf(o, ph||0));
    cx.drawImage(img, X, Y);
    if(o.flash > 0){                       // 受擊白閃：整個剪影瞬間打亮
      cx.save();
      cx.globalAlpha = Math.min(1, o.flash/0.09) * .85;
      cx.drawImage(whiteOf(img, name), X, Y);
      cx.restore();
    }
  };
  for(const m of G.mons){
    if(G.seen[key(m.x,m.y)]!==2) continue;
    const img = atlas[m.d.id] || atlas.rat;
    const [mx,my] = entPos(m);
    shadow(mx,my);
    cx.save();
    if(m.st['睡']||m.st['麻']) cx.globalAlpha=.55;
    drawEnt(m, img, m.d.id, m.id*1.7);
    cx.restore();
    if(m.st['睡']){ cx.fillStyle=PAL['r']; cx.fillRect(ox+m.x*T+11, oy+m.y*T+1, 3,1); cx.fillRect(ox+m.x*T+12, oy+m.y*T+2, 1,1); }
    // 血條（只在受傷時出現，不佔用畫面）
    if(m.hp < m.mhp){
      const w = Math.max(1, Math.round(12*m.hp/m.mhp));
      cx.fillStyle='#000'; cx.fillRect(ox+m.x*T+2, oy+m.y*T+14, 12, 2);
      cx.fillStyle= m.hp/m.mhp>.5 ? PAL['l'] : PAL['g'];
      cx.fillRect(ox+m.x*T+2, oy+m.y*T+14, w, 2);
    }
  }
  // 店員
  if(G.shop && G.seen[key(G.shop.keeper.x, G.shop.keeper.y)] === 2){
    const kx = G.shop.keeper.x, ky = G.shop.keeper.y;
    shadow(kx, ky);
    cx.drawImage(KEEPER, ox+kx*T, oy+ky*T + (Math.sin(clock*2.6) > .5 ? -1 : 0));
  }

  // 幻獸：畫在怪物之後、玩家之前，並用自己的元素色打一圈光
  for(const a of G.allies){
    const [ax,ay] = entPos(a);
    shadow(ax,ay);
    const bx0 = Math.round(ox+ax*T), by0 = Math.round(oy+ay*T);
    cx.fillStyle = PAL[a.d.col] + '66';
    cx.fillRect(bx0+3, by0+15, 10, 1);
    drawEnt(a, SUMMON_ART[a.d.id], 'sum'+a.d.id, a.id*1.3);
    if(a.ttl <= 5){                       // 快消失了就閃 —— 這是最需要提前知道的資訊
      cx.save(); cx.globalAlpha = .35 + Math.sin(clock*9)*.3;
      cx.drawImage(whiteOf(SUMMON_ART[a.d.id],'sum'+a.d.id), bx0, by0);
      cx.restore();
    }
  }

  // 玩家：底下多一圈黃銅光環。畫面上永遠只有一個東西是這個顏色，
  // 所以再亂的房間也能一眼找到自己在哪。
  {
    const [px2,py2] = entPos(G.p);
    shadow(px2,py2);
    const bx = Math.round(ox+px2*T), by = Math.round(oy+py2*T);
    cx.fillStyle = 'rgba(201,151,63,.55)';
    cx.fillRect(bx+3, by+15, 10, 1); cx.fillRect(bx+2, by+14, 1, 1); cx.fillRect(bx+13, by+14, 1, 1);
    drawEnt(G.p, heroNow(), 'hero'+(G.p.weap?G.p.weap.id:'-')+(G.p.shld?G.p.shld.id:'-'), 0);
  }

  // 粒子（塵、火星、爆散）
  for(const p of G.parts){
    const k = p.t/p.life;
    cx.globalAlpha = Math.max(0, 1-k*k);       // 尾端快速收掉，不要拖泥帶水
    cx.fillStyle = p.col;
    cx.fillRect(Math.round(ox+p.px), Math.round(oy+p.py), p.s, p.s);
  }
  cx.globalAlpha = 1;

  // 火把光暈：離玩家越遠越暗，房間也有邊界感
  // 半徑依畫布尺寸換算 —— 直式手機的畫布比桌機小，寫死半徑會整片變黑
  const R = Math.max(cv.width, cv.height) * 0.46;
  const g = cx.createRadialGradient(
    ox+G.p.x*T+8, oy+G.p.y*T+8, R*0.22,
    ox+G.p.x*T+8, oy+G.p.y*T+8, R);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.34)');
  cx.fillStyle=g; cx.fillRect(0,0,cv.width,cv.height);

  // 火把本身：玩家周圍一圈暖光。地形是冷色、光是暖色，
  // 兩者一疊才有「這裡有人拿著火把站著」的感覺，而不是一張平的貼圖。
  const lx = ox+G.p.x*T+8, ly = oy+G.p.y*T+8;
  const flick = 1 + Math.sin(performance.now()*0.005)*0.03
                  + Math.sin(performance.now()*0.017)*0.015;
  const g2 = cx.createRadialGradient(lx, ly, 0, lx, ly, R*0.72*flick);
  g2.addColorStop(0,   'rgba(150,96,36,.34)');
  g2.addColorStop(0.55,'rgba(110,64,22,.15)');
  g2.addColorStop(1,   'rgba(0,0,0,0)');
  cx.globalCompositeOperation = 'lighter';
  cx.fillStyle = g2; cx.fillRect(0,0,cv.width,cv.height);

  // 牆上火把也要真的照亮周圍，否則就只是一張貼在牆上的圖。
  // 每支的閃爍相位不同 —— 全部同步跳動會像壞掉的日光燈。
  for(const tc of litTorches){
    const fx = ox+tc.x*T+8, fy = oy+tc.y*T+7;
    const fk = 1 + Math.sin(clock*7.3 + tc.x*2.1 + tc.y*3.7)*.09;
    const tg = cx.createRadialGradient(fx, fy, 0, fx, fy, 46*fk);
    tg.addColorStop(0,   'rgba(190,110,40,.34)');
    tg.addColorStop(0.5, 'rgba(140,74,24,.14)');
    tg.addColorStop(1,   'rgba(0,0,0,0)');
    cx.fillStyle = tg; cx.fillRect(fx-52, fy-52, 104, 104);
  }
  cx.globalCompositeOperation = 'source-over';

  // 空氣中的浮塵：在火光範圍內才看得到，讓「有光的地方」有體積感
  cx.fillStyle = '#d9b98a';
  for(const m of MOTES){
    const wx = (m.x + clock*0.006*m.sp) % 1;
    const wy = (m.y + Math.sin(clock*m.sp + m.ph)*0.02 + clock*0.004) % 1;
    const sx2 = wx*cv.width, sy2 = wy*cv.height;
    const d = Math.hypot(sx2-lx, sy2-ly);
    if(d > R*0.7) continue;
    cx.globalAlpha = m.a * (1 - d/(R*0.7));
    cx.fillRect(sx2|0, sy2|0, 1, 1);
  }
  cx.globalAlpha = 1;

  // 飄字
  cx.font='7px ui-monospace, monospace'; cx.textAlign='center';
  for(const f of G.floats){
    const a = Math.max(0, 1 - f.t/0.85);
    cx.globalAlpha = a;
    cx.fillStyle='#000';
    cx.fillText(f.txt, ox+f.x*T+8+1, oy+f.y*T+3-f.t*16+1);
    cx.fillStyle=f.col;
    cx.fillText(f.txt, ox+f.x*T+8, oy+f.y*T+3-f.t*16);
  }
  cx.globalAlpha=1;

  lastOx=ox; lastOy=oy;
  updateTags();
}

/* ─── 名牌：把「那是什麼」直接寫在畫面上 ──────────────────────
   這是對「16x16 中文遊戲」最誠實的解法。原作靠玩家背圖鑑，
   但那是三十年前、而且是全螢幕電視的年代。 */
let tagsOn = true;
const tagLayer = document.getElementById('tags');
const tagPool = [];
function updateTags(){
  if(!tagLayer) return;
  let n = 0;
  if(tagsOn && !G.over){
    const rect = cv.getBoundingClientRect();
    const s = rect.width ? rect.width / cv.width : 0;
    if(s){
      // 先收集，再一次解決重疊。一格一格直接貼的話，三隻怪擠在一起時
      // 名牌會疊成一面看不懂的字牆 —— 那比沒有名牌更糟。
      const want = [];
      const near = (x,y,r)=> Math.max(Math.abs(x-G.p.x), Math.abs(y-G.p.y)) <= r;
      const push = (wx, wy, txt, cls, owner)=>{
        const sx = lastOx + wx*T + T/2, sy = lastOy + wy*T;
        if(sx < -20 || sy < -20 || sx > cv.width+20 || sy > cv.height+20) return;
        // 中文約 11px、其他約 6.4px，加上左右內距與框線
        let w = 10;
        for(const ch of txt) w += ch.charCodeAt(0) > 0x2e80 ? 10.5 : 6.2;
        // 上方是首選，下方是備位 —— 兩個都被佔了才往上疊
        want.push({x:sx*s, y:sy*s - 5, alt:(sy + T)*s + 18, w, txt, cls, owner});
      };

      for(const m of G.mons){
        if(G.seen[key(m.x,m.y)]!==2) continue;
        const stx = Object.keys(m.st)[0];
        push(m.x, m.y, stx ? `${m.d.nm}·${stx}` : m.d.nm, 'mon', 'm'+m.id);
      }
      // 道具名牌只標「走幾步就到得了」的範圍。整個房間的道具全標出來，
      // 畫面會變成一張型錄，反而看不到怪物。
      for(const k in G.items){
        if(G.seen[k]!==2) continue;
        const x=k%MW, y=(k/MW)|0;
        if(!near(x,y,4)) continue;
        const it = G.items[k];
        push(x, y, it.shop ? `${nameOf(it)}　${it.price}G` : nameOf(it), it.shop ? 'shop' : 'item');
      }
      for(const k in G.gold){
        if(G.seen[k]!==2) continue;
        const x=k%MW, y=(k/MW)|0;
        if(!near(x,y,4)) continue;
        push(x, y, G.gold[k]+' G', 'item');
      }
      for(const k in G.traps){
        if(G.seen[k]!==2) continue;
        push(k%MW, (k/MW)|0, '陷阱', 'mon');
      }
      for(const a of G.allies) push(a.x, a.y, `${a.d.nm}·${a.ttl}`, 'stair', 'a'+a.id);
      if(G.shop && G.seen[key(G.shop.keeper.x,G.shop.keeper.y)]===2)
        push(G.shop.keeper.x, G.shop.keeper.y, '店員', 'shop', 'keeper');
      const stt = G.f.stairs;
      if(G.seen[key(stt.x,stt.y)]) push(stt.x, stt.y, '下樓', 'stair');

      // 重疊解算：由上往下掃，跟已放好的框相撞就往上頂一層
      const H = 18;
      // 精靈本身也是障礙物。只讓名牌彼此閃避的話，名牌會準確地
      // 停在上一格那隻怪的臉上 —— 沒有撞到別的名牌，但擋住了角色。
      const placed = [];
      const tw = T*s;
      const block = (x,y,owner)=>{
        const bx = (lastOx + x*T + T/2)*s, top = (lastOy + y*T)*s;
        placed.push({x:bx, y:top + H,  w:tw, blocker:1, owner});
        placed.push({x:bx, y:top + tw, w:tw, blocker:1, owner});
      };
      block(G.p.x, G.p.y, 'p');
      for(const m of G.mons) if(G.seen[key(m.x,m.y)]===2) block(m.x, m.y, 'm'+m.id);
      for(const a of G.allies) block(a.x, a.y, 'a'+a.id);

      want.sort((a,b)=> a.y - b.y);
      // 自己的精靈不算擋自己的名牌 —— 不排除的話，名牌想放到腳下時
      // 會被自己的下緣擋住，又被頂回頭上那隻怪的臉上。
      const clash = t => placed.find(o =>
        (!o.owner || o.owner !== t.owner) &&
        Math.abs(o.y - t.y) < H && Math.abs(o.x - t.x) < (o.w + t.w)/2 + 3);
      for(const t of want){
        if(clash(t)){                       // 上方被佔 → 改放腳下
          const up = t.y; t.y = t.alt;
          if(clash(t)){                     // 兩邊都被佔 → 回到上方往外頂
            t.y = up;
            let guard = 0, hit;
            while((hit = clash(t)) && ++guard <= 8) t.y = hit.y - H;
          }
        }
        placed.push(t);
      }
      for(const t of placed){
        if(t.blocker) continue;
        let el = tagPool[n];
        if(!el){ el = document.createElement('div'); tagLayer.appendChild(el); tagPool[n] = el; }
        n++;
        el.className = 'tag ' + t.cls;
        if(el.textContent !== t.txt) el.textContent = t.txt;
        el.style.left = t.x + 'px';
        el.style.top  = t.y + 'px';
        el.style.display = '';
      }
    }
  }
  for(let i=n;i<tagPool.length;i++) tagPool[i].style.display='none';
}

/* ─── 小地圖：走過哪裡、還沒走哪裡 ────────────────────────────
   資料本來就在 G.seen（0 未探索 / 1 走過 / 2 視野內），
   缺的只是把它畫出來。 */
const mini = document.getElementById('mini');
const mcx = mini ? mini.getContext('2d') : null;
const MMS = 9;                       // 每格 9px：30x30 → 270x270
function drawMini(){
  if(!mcx || !G) return;
  mcx.fillStyle = '#07090a'; mcx.fillRect(0,0,mini.width,mini.height);
  let known = 0, total = 0;
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    const k = key(x,y), s = G.seen[k], t = G.f.t[k];
    if(t!==WALL){ total++; if(s) known++; }
    if(!s) continue;
    let col;
    if(t===WALL)      col = s===2 ? '#1b2329' : '#141a1e';
    else if(t===CORR) col = s===2 ? '#3d4a53' : '#1e262b';
    else              col = s===2 ? '#4b5c66' : '#232c32';
    mcx.fillStyle = col;
    mcx.fillRect(x*MMS, y*MMS, MMS, MMS);
  }
  // 樓梯：看過就永遠記得，這是玩家最需要的一格
  const st = G.f.stairs;
  if(G.seen[key(st.x,st.y)]){
    mcx.fillStyle = '#c9973f';
    mcx.fillRect(st.x*MMS+1, st.y*MMS+1, MMS-2, MMS-2);
    mcx.fillStyle = '#14110f';
    mcx.fillRect(st.x*MMS+3, st.y*MMS+3, MMS-6, MMS-6);
  }
  // 道具與金幣：只畫視野內的，跟畫面規則一致（記憶不記得會動的東西）
  const dot=(x,y,col,sz)=>{
    const o = Math.floor((MMS-sz)/2);
    mcx.fillStyle=col; mcx.fillRect(x*MMS+o, y*MMS+o, sz, sz);
  };
  for(const k in G.items) if(G.seen[k]===2) dot(k%MW,(k/MW)|0,'#dcae35',4);
  for(const k in G.gold)  if(G.seen[k]===2) dot(k%MW,(k/MW)|0,'#f5dc7a',3);
  for(const m of G.mons)  if(G.seen[key(m.x,m.y)]===2) dot(m.x,m.y,'#a83c32',5);
  for(const a of G.allies) dot(a.x,a.y,PAL[a.d.col],5);
  // 玩家：白點加一圈黑框，壓在所有東西上面
  mcx.fillStyle='#14110f'; mcx.fillRect(G.p.x*MMS, G.p.y*MMS, MMS, MMS);
  mcx.fillStyle='#e8dcc0'; mcx.fillRect(G.p.x*MMS+1, G.p.y*MMS+1, MMS-2, MMS-2);

  const el = document.getElementById('mapstat');
  if(el) el.textContent = total ? Math.round(100*known/total)+'% 已探索' : '';
}

/* 直式手機給直式視窗。手機畫面本來就是直的，塞一個 14x10 的橫視窗
   只會讓遊戲剩下薄薄一條、其餘全是按鈕。 */
function fitViewport(){
  const portrait = innerHeight > innerWidth && innerWidth <= 900;
  const nw = portrait ? 11 : 14, nh = portrait ? 10 : 10;
  if(nw === VW && nh === VH) return;
  VW = nw; VH = nh;
  cv.width = VW*T; cv.height = VH*T;
  // 明寫長寬比。只給 width:100% 時，畫布高度要靠瀏覽器從內在比例推算，
  // 在 iframe 裡（Artifact 就是）不同引擎推算的結果不一致，畫面會被壓扁。
  cv.style.aspectRatio = VW + ' / ' + VH;
  cx.imageSmoothingEnabled = false;       // 改 canvas.width 會把 context 狀態重設
  rockPat = null;                         // 圖樣綁在舊的繪圖狀態上，一起重建
  if(G){ camX = G.p.x - VW/2 + .5; camY = G.p.y - VH/2 + .5; }
}
addEventListener('resize', fitViewport);
addEventListener('orientationchange', fitViewport);

let last=0;
function loop(ts){
  const dt = Math.min(.05, (ts-last)/1000 || 0); last=ts;
  clock += dt;
  if(G){
    for(const a of G.anim) a.t += dt;
    G.anim = G.anim.filter(a=>a.t<.11);
    for(const f of G.floats) f.t += dt;
    G.floats = G.floats.filter(f=>f.t<.85);

    // 動態美術層的推進：前衝、白閃、屍體、粒子
    const tickFx = o=>{
      if(o.lunge){ o.lunge.t += dt; if(o.lunge.t > .19) o.lunge = null; }
      if(o.flash > 0) o.flash -= dt;
    };
    tickFx(G.p);
    for(const m of G.mons) tickFx(m);
    for(const c of G.corpses) c.t += dt;
    G.corpses = G.corpses.filter(c=>c.t < .4);
    for(const p of G.parts){
      p.t += dt;
      p.px += p.vx*dt; p.py += p.vy*dt;
      p.vy += 42*dt;                       // 一點重力，粒子才會落回地面而不是飄走
      p.vx *= (1 - 1.6*dt);
    }
    G.parts = G.parts.filter(p=>p.t < p.life);
    if(G.shake>0){
      G.shake = Math.max(0, G.shake - dt*46);
      const s = G.shake;
      document.getElementById('shake').style.transform =
        `translate(${(Math.random()-.5)*s}px,${(Math.random()-.5)*s}px)`;
    } else document.getElementById('shake').style.transform='';
    draw(dt);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ═══ UI ═════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
function refresh(){
  if(!G) return;
  const p=G.p;
  $('fnum').textContent = G.depth;
  $('lv').textContent = p.lv;
  $('hp').textContent = `${Math.max(0,p.hp)}/${p.mhp}`;
  $('hpbar').firstElementChild.style.width = Math.max(0,100*p.hp/p.mhp)+'%';
  $('hp').className = p.hp/p.mhp<=.25 ? 'crit' : (p.hp/p.mhp<=.5?'warn':'');
  const fp = p.sat/p.msat;
  $('full').textContent = p.sat<=0 ? '飢餓！' : (p.sat/1000).toFixed(0)+'%';
  $('full').className = p.sat<=0?'crit':(fp<=.3?'warn':'');
  $('fullbar').firstElementChild.style.width = Math.max(0,100*fp)+'%';
  $('mp').textContent = `${p.mp}/${p.mmp}`;
  $('mpbar').firstElementChild.style.width = Math.max(0,100*p.mp/Math.max(1,p.mmp))+'%';
  $('magbtn').classList.toggle('ping', p.sp > 0);
  $('btnB').classList.toggle('dim', !panelMode && !$('aim').classList.contains('show'));
  $('atk').textContent = pAtk();
  $('def').textContent = pDef();
  $('gold').textContent = p.gold;
  $('zone').textContent = zoneOf(G.depth).nm;

  // 狀態異常：原本只在訊息裡閃一行就沒了，玩家根本不知道自己還中著什麼
  const sb = $('stbar'); sb.innerHTML='';
  const GOOD = {'速':1,'力':1};
  const keys = Object.keys(p.st);
  if(!keys.length){ const s=document.createElement('span'); s.className='none'; s.textContent='正常'; sb.appendChild(s); }
  for(const k of keys){
    const b=document.createElement('b');
    if(GOOD[k]) b.className='ok';
    b.textContent = `${k} ${p.st[k]}`;
    sb.appendChild(b);
  }

  // 裝備一覽：原本只能開背包才知道自己拿著什麼，那是每回合都要看的資訊
  $('eqw').textContent = p.weap ? nameOf(p.weap) : '徒手';
  $('eqs').textContent = p.shld ? nameOf(p.shld) : '無';
  $('eqw').className = p.weap && p.weap.cursed && p.weap.known ? 'bad' : '';
  $('eqs').className = p.shld && p.shld.cursed && p.shld.known ? 'bad' : '';
  $('eqi').textContent = `${p.inv.length} / 20`;
  $('eqe').textContent = `${p.exp} / ${needExp(p.lv)}`;

  const lg = $('log'); lg.innerHTML='';
  for(const m of G.log.slice(-12)){
    const d=document.createElement('div');
    d.textContent = m.n>1 ? `${m.txt} ×${m.n}` : m.txt;
    if(m.cls) d.className=m.cls; lg.appendChild(d);
  }
  drawMini();
  if(panelMode) renderPanel();
}

let panelMode = null, sel = null;
function openPanel(mode){
  panelMode = mode; sel = null;
  $('panel').classList.add('open');
  renderPanel();
}
function closePanel(){ panelMode=null; sel=null; $('panel').classList.remove('open'); }

function renderPanel(){
  const list = $('list'), acts = $('acts'), p = G.p;
  list.innerHTML=''; acts.innerHTML='';
  if(panelMode==='magic'){
    $('ptitle').textContent = '魔法';
    $('pcount').textContent = `MP ${p.mp} / ${p.mmp}`;
    $('phint').textContent = p.sp ? `還有 ${p.sp} 點技能點可以分配。` : '打倒敵人升級可以獲得技能點。';

    const spRow = document.createElement('div'); spRow.id = 'sp';
    spRow.innerHTML = `<span>技能點</span><b>${p.sp}</b>`;
    list.appendChild(spRow);

    // 五系與加點。每一點都要立刻看得到威力差別，不然沒人願意投資。
    for(const sc of SCHOOLS){
      const lv = p.sch[sc.id] || 0;
      const row = document.createElement('div'); row.className = 'sch';
      const nm = document.createElement('div'); nm.className='nm'; nm.textContent = sc.nm;
      nm.style.color = sc.col;
      const pips = document.createElement('div'); pips.className='pips';
      for(let i=0;i<5;i++){
        const d = document.createElement('i');
        if(i < lv) d.style.background = sc.col;
        pips.appendChild(d);
      }
      row.appendChild(nm); row.appendChild(pips);
      const b = document.createElement('button');
      b.textContent = '＋';
      b.disabled = p.sp <= 0 || lv >= 5;
      b.onclick = ()=>{
        p.sp--; p.sch[sc.id] = lv + 1;
        p.mmp = maxMp(p); p.mp = Math.min(p.mmp, p.mp + 5);
        SFX.play('ident');
        say(`${sc.nm}系提升到 ${lv+1} 級。`,'good');
        refresh();
      };
      row.appendChild(b);
      list.appendChild(row);
    }

    const known = spellsFor(p);
    const head = document.createElement('div'); head.className='hint';
    head.textContent = known.length ? '學會的魔法' : '目前還沒有學會任何魔法 —— 先加點。';
    list.appendChild(head);
    for(const sp of known){
      const row = document.createElement('div');
      const ok = p.mp >= sp.mp;
      row.className = 'spell' + (ok ? '' : ' off');
      row.innerHTML =
        `<span class="nm" style="color:${SCHOOLS.find(x=>x.id===sp.sc).col}">${sp.nm}</span>` +
        `<span class="ds">${sp.desc}</span><span class="mp">${sp.mp} MP</span>`;
      if(ok) row.onclick = ()=>{
        const r = castSpell(sp);
        if(r === null){ closePanel(); openAim('施法方向'); return; }
        if(r) closePanel(); else refresh();
      };
      list.appendChild(row);
    }

    const av = summonsFor(p);
    const sh = document.createElement('div'); sh.className='hint';
    sh.textContent = av.length ? `幻獸　召喚代價：胃袋 ${Math.round(SUMMON_COST*100)}%`
                               : `幻獸　需要任一系 ${SUMMON_AT} 級`;
    list.appendChild(sh);
    for(const sm of av){
      const row = document.createElement('div');
      const cost = Math.floor(p.msat * SUMMON_COST);
      const ok = p.sat >= cost;
      row.className = 'spell' + (ok ? '' : ' off');
      row.innerHTML =
        `<span class="nm" style="color:${PAL[sm.col]}">${sm.nm}</span>` +
        `<span class="ds">攻 ${sm.atk}　${sm.ttl} 回合</span>` +
        `<span class="mp">胃袋 −30%</span>`;
      if(ok) row.onclick = ()=>{ if(callSummon(sm)) closePanel(); else refresh(); };
      list.appendChild(row);
    }
    return;
  }
  if(panelMode==='inv'){
    $('ptitle').textContent = '背包';
    $('pcount').textContent = `${p.inv.length} / 20`;
    $('phint').textContent = sel ? nameOf(sel) : '點選道具查看可用的操作。';
    for(const it of p.inv){
      const row = document.createElement('div');
      row.className='row';
      const c = document.createElement('canvas'); c.width=T; c.height=T;
      c.getContext('2d').drawImage(iconOf(it),0,0);
      const nm = document.createElement('div'); nm.className='nm'; nm.textContent=nameOf(it);
      row.appendChild(c); row.appendChild(nm);
      if(it===p.weap||it===p.shld){ const e=document.createElement('span'); e.className='eq'; e.textContent='裝備中'; row.appendChild(e); }
      if(it===sel) row.style.background='rgba(201,151,63,.13)';
      row.onclick = ()=>{ sel = (sel===it?null:it); renderPanel(); };
      list.appendChild(row);
    }
    if(sel) buildActions(sel, false);
  } else if(panelMode==='ground'){
    const it = G.items[key(p.x,p.y)];
    $('ptitle').textContent = '腳下';
    $('pcount').textContent = '';
    if(!it){ $('phint').textContent='腳下沒有東西。'; return; }
    $('phint').textContent = nameOf(it);
    const row=document.createElement('div'); row.className='row';
    const c=document.createElement('canvas'); c.width=T;c.height=T;
    c.getContext('2d').drawImage(iconOf(it),0,0);
    const nm=document.createElement('div'); nm.className='nm'; nm.textContent=nameOf(it);
    row.appendChild(c); row.appendChild(nm); list.appendChild(row);
    buildActions(it, true);
  }
}
function btn(label, fn, dis){
  const b=document.createElement('button'); b.textContent=label;
  if(dis) b.disabled=true; else b.onclick=fn;
  $('acts').appendChild(b); return b;
}
function buildActions(it, ground){
  const p=G.p;
  const verb = {food:'吃', herb:'喝', scroll:'讀', wand:'揮動'}[it.cat];
  if(verb) btn(ground?verb+'（不撿起）':verb, ()=>{
    const r = useItem(it, ground);
    if(r===null){ closePanel(); openAim('揮杖方向'); return; }   // 杖進入瞄準
    if(r){ if(!ground) {} closePanel(); endTurn(); } else refresh();
  });
  if(it.cat==='weap'||it.cat==='shld'){
    const eq = (it===p.weap||it===p.shld);
    btn(eq?'卸下':'裝備', ()=>{
      if(ground){ say('要先撿起來才能裝備。'); refresh(); return; }
      if(eq){
        if(it.cursed){ it.known=1; say('被詛咒了，拿不下來！','bad'); refresh(); return; }
        if(it===p.weap) p.weap=null; else p.shld=null;
        say('卸下了裝備。');
      } else {
        const cur = it.cat==='weap'?p.weap:p.shld;
        if(cur && cur.cursed){ cur.known=1; say('身上的裝備被詛咒了，換不下來！','bad'); refresh(); return; }
        if(it.cat==='weap') p.weap=it; else p.shld=it;
        it.known=1;
        say(`裝備了「${nameOf(it)}」。`);
        if(it.cursed) say('……手上傳來一陣寒意。這是被詛咒的裝備！','bad');
      }
      closePanel(); endTurn();
    });
  }
  if(ground && it.shop){
    btn(`購買（${it.price} G）`, ()=>{
      if(p.gold < it.price){ say('金錢不足。','bad'); refresh(); return; }
      if(p.inv.length>=20){ say('背包已經滿了。'); refresh(); return; }
      p.gold -= it.price; delete it.shop; delete it.price;
      SFX.play('coin');
      p.inv.push(it); delete G.items[key(p.x,p.y)];
      say(`買下了「${nameOf(it)}」。`,'gold'); closePanel(); endTurn();
    }, p.gold < it.price);
  }
  if(ground){
    btn(it.shop ? '拿起（未結帳）' : '撿起', ()=>{
      if(p.inv.length>=20){ say('背包已經滿了。'); refresh(); return; }
      SFX.play('pick');
      if(it.shop) say('店員的視線跟了過來。','bad');
      p.inv.push(it); delete G.items[key(p.x,p.y)];
      say(`撿起了「${nameOf(it)}」。`); closePanel(); endTurn();
    }, p.inv.length>=20);
    btn('替換', ()=>{ swapMode = it; panelMode='inv'; sel=null; renderPanel();
      $('phint').textContent='選一件背包道具與腳下的交換。'; });
    btn('踏過', closePanel);
  } else {
    if(swapMode){
      btn('與腳下交換', ()=>{
        const g = swapMode; swapMode=null;
        if(it.cursed && (it===p.weap||it===p.shld)){ it.known=1; say('被詛咒了，脫不下來！','bad'); refresh(); return; }
        if(it===p.weap) p.weap=null; if(it===p.shld) p.shld=null;
        const i = p.inv.indexOf(it);
        p.inv[i] = g; G.items[key(p.x,p.y)] = it;
        say(`將「${nameOf(it)}」放在地上，換取了「${nameOf(g)}」。`);
        closePanel(); endTurn();
      });
    }
    btn('投擲', ()=>{ pendThrow = it; closePanel(); openAim('投擲方向'); say('選擇投擲方向。','gold'); refresh(); });
    btn('放下', ()=>{
      if(G.items[key(p.x,p.y)]){ say('腳下已經有東西了。'); refresh(); return; }
      if(it.cursed && (it===p.weap||it===p.shld)){ it.known=1; say('被詛咒了，拿不下來！','bad'); refresh(); return; }
      SFX.play('drop');
      removeItem(it); G.items[key(p.x,p.y)] = it;
      say(`放下了「${nameOf(it)}」。`); closePanel(); endTurn();
    });
    if(!G.known[lookKey(it)] && LOOK[it.cat])
      btn('標註', ()=>{
        const n = prompt('給這個外觀一個備註（例如「?危險」）', G.notes[lookKey(it)]||'');
        if(n!==null){ if(n) G.notes[lookKey(it)]=n; else delete G.notes[lookKey(it)]; refresh(); }
      });
  }
}
let swapMode = null, pendThrow = null;

function doThrow(dx,dy){
  const it = pendThrow; pendThrow=null;
  removeItem(it);
  throwItem(it, dx, dy);
  endTurn();
}
/* 丟東西的飛行判定。背包裡丟出去、背包滿了把地上的東西往前撥開，
   走的是同一段程式 —— 兩份會不同步，而不同步的規則玩家一定會發現。 */
function throwItem(it, dx, dy){
  SFX.play('throw');
  let x=G.p.x+dx, y=G.p.y+dy, target=null;
  for(let i=0;i<10;i++){
    if(!walkable(x,y)) break;
    const m=monAt(x,y); if(m){ target=m; break; }
    x+=dx; y+=dy;
  }
  say(`投擲了「${nameOf(it)}」。`);
  if(target){
    if(it.cat==='herb' && it.d.self){
      target.st[it.d.self.st] = it.d.self.dur*2;
      say(`${target.d.nm} 陷入了${it.d.self.st}的狀態！`,'good');
      identify(it);
    } else {
      const dmg = rollDmg(8, target.d.def, false, 1);
      SFX.play('hit');
      target.hp -= dmg; float(target.x,target.y,String(dmg),'#e8dcc0');
      say(`命中 ${target.d.nm}，造成 ${dmg} 點傷害。`);
      if(target.hp<=0) kill(target);
    }
  } else {
    let lx=G.p.x, ly=G.p.y;
    while(walkable(lx+dx,ly+dy) && !G.items[key(lx+dx,ly+dy)]){ lx+=dx; ly+=dy; }
    if(!G.items[key(lx,ly)]) G.items[key(lx,ly)] = it;
  }
}

/* ─── 輸入 ──────────────────────────────────────────────────── */
const KEYDIR = {
  ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
  w:[0,-1], s:[0,1], a:[-1,0], d:[1,0],
  q:[-1,-1], e:[1,-1], z:[-1,1], c:[1,1],
};
/* 瞄準模式：投擲 / 揮杖 / 施法共用。
   全部收斂到一個方向盤，鍵盤與滑鼠走同一條路徑，不會有一邊做得到、
   另一邊做不到的功能。 */
function openAim(label){
  const el = $('aim'); if(!el) return;
  const padOn = $('pad').classList.contains('show');
  $('aimlbl').textContent = (label || '選擇方向') + (padOn ? '　（十字鍵）' : '');
  el.classList.toggle('lite', padOn);
  el.classList.add('show');
}
function closeAim(){ const el = $('aim'); if(el) el.classList.remove('show'); }
function cancelAim(){
  pendWand = null; pendThrow = null; pendSpell = null;
  closeAim(); say('取消了。'); refresh();
}
function handleDir(dx,dy){
  if(pendSpell){ closeAim(); fireSpell(dx,dy); return; }
  if(pendWand){ closeAim(); fireWand(dx,dy); return; }
  if(pendThrow){ closeAim(); doThrow(dx,dy); return; }
  tryMove(dx,dy);
}
// 瀏覽器規定音訊必須由使用者手勢啟動 —— 第一次互動時解鎖就好
addEventListener('keydown', ()=>{ SFX.unlock(); BGM.start(); }, {once:true});
addEventListener('pointerdown', ()=>{ SFX.unlock(); BGM.start(); }, {once:true});

function toggleTags(){
  tagsOn = !tagsOn;
  SFX.play('open');
  say(tagsOn ? '顯示名稱：開' : '顯示名稱：關','gold');
  refresh();
}
function toggleMute(){
  const on = SFX.toggle();
  say(on ? '音效：開' : '音效：關','gold');
  refresh();
}

addEventListener('keydown', ev=>{
  if(!G || coverUp) return;
  if(ev.target.tagName==='INPUT') return;
  const k = ev.key;
  if(G.over){ if(k==='r'||k==='R'){ restart(); } return; }
  if(k==='Escape'){ pendWand=null; pendThrow=null; pendSpell=null; swapMode=null; closeAim(); closePanel(); refresh(); return; }
  const d = KEYDIR[k] || KEYDIR[k.toLowerCase?.()];
  if(d){ ev.preventDefault(); handleDir(d[0],d[1]); return; }
  if(k===' '){ ev.preventDefault(); endTurn(); return; }
  if(k==='g'||k==='G'){ SFX.play('open'); openPanel('ground'); return; }
  if(k==='i'||k==='I'){ SFX.play('open'); panelMode==='inv'?closePanel():openPanel('inv'); return; }
  if(k==='k'||k==='K'){ SFX.play('open'); panelMode==='magic'?closePanel():openPanel('magic'); return; }
  if(k==='l'||k==='L'){ toggleTags(); return; }
  if(k==='m'||k==='M'){ toggleMute(); return; }
  if(k==='>'||k==='.'){ descend(); return; }
});
document.querySelectorAll('[data-dir]').forEach(b=>{
  b.onclick = ()=>{ if(G&&!G.over&&!coverUp){ const [x,y]=b.dataset.dir.split(',').map(Number); handleDir(x,y); } };
});

/* ─── 虛擬手把 ──────────────────────────────────────────────────
   十字鍵按住會連續走。一步一點在地牢裡走三十格是折磨，
   但連走的節奏又不能快到讓人衝進怪堆裡 —— 145ms 是實測後的折衷。 */
(function gamepad(){
  const pad = $('pad'); if(!pad || !pad.addEventListener) return;
  const REPEAT = 145;
  let timer = null, held = null;

  const live = ()=> G && !G.over && !coverUp;
  function step(dir){
    if(!live()) return;
    handleDir(dir[0], dir[1]);
  }
  function release(){
    if(timer){ clearInterval(timer); timer = null; }
    if(held){ held.classList.remove('on'); held = null; }
  }
  for(const b of pad.querySelectorAll('[data-dir]')){
    const dir = b.dataset.dir.split(',').map(Number);
    b.onclick = null;                       // 改由 pointer 事件處理，避免點一下走兩步
    b.addEventListener('pointerdown', ev=>{
      ev.preventDefault(); ev.stopPropagation();
      if(!live()) return;
      release();
      held = b; b.classList.add('on');
      b.setPointerCapture && b.setPointerCapture(ev.pointerId);
      SFX.unlock(); BGM.start();
      step(dir);                            // 第一步立刻走，不等節拍
      timer = setInterval(()=>{ if(!live()) release(); else step(dir); }, REPEAT);
    });
    // 不要監聽 pointerleave：setPointerCapture 本身就會觸發一次 leave，
    // 長按會在第一步之後隨機停掉。捕捉之後手指滑出按鈕仍該繼續走。
    for(const e of ['pointerup','pointercancel','lostpointercapture'])
      b.addEventListener(e, release);
  }
  $('padwait').addEventListener('pointerdown', ev=>{
    ev.preventDefault(); ev.stopPropagation();
    if(live()) endTurn();
  });

  /* A＝確定：看情況做「現在最該做的那件事」。
     開著視窗就執行第一個動作、站在樓梯上就下樓、腳下有東西就打開選單，
     什麼都沒有就待機一回合。一顆按鍵解決九成操作。 */
  $('btnA').addEventListener('pointerdown', ev=>{
    ev.preventDefault(); ev.stopPropagation();
    if(!live()) return;
    if($('aim').classList.contains('show')) return;      // 瞄準時要選方向，不是按確定
    if(panelMode){
      const b2 = [...$('acts').querySelectorAll('button')].find(x=>!x.disabled);
      if(b2){ b2.click(); return; }
      const row = $('list').querySelector('.row');
      if(row){ row.click(); return; }
      closePanel(); refresh(); return;
    }
    const p = G.p;
    if(tileAt(p.x,p.y) === DOWN){ descend(); return; }
    const k = key(p.x,p.y), it = G.items[k];
    if(it){
      // 商店的東西不能一按就走 —— 拿不拿走是要玩家自己決定的事
      if(it.shop){ SFX.play('open'); openPanel('ground'); return; }
      if(p.inv.length < 20){
        SFX.play('pick');
        p.inv.push(it); delete G.items[k];
        say(`撿起了「${nameOf(it)}」。`);
        endTurn(); return;
      }
      // 背包滿了：往面向的方向拋出去，至少把腳下這一格空出來
      delete G.items[k];
      say('背包已經滿了 —— 把它往前拋開。','bad');
      throwItem(it, p.face[0], p.face[1]);
      endTurn(); return;
    }
    endTurn();
  });
  /* B＝取消：關視窗、退出瞄準。沒有東西可取消時會變暗 —— 
     一顆永遠亮著卻沒反應的按鍵，比一顆變暗的按鍵更讓人困惑。 */
  $('btnB').addEventListener('pointerdown', ev=>{
    ev.preventDefault(); ev.stopPropagation();
    if(!G) return;
    if($('aim').classList.contains('show')){ cancelAim(); return; }
    if(panelMode){ SFX.play('open'); closePanel(); refresh(); return; }
  });
  // 吃掉手把區域的滑動，否則按著方向鍵會同時觸發畫面的拖曳移動
  for(const el of [$('cross'), $('ab')])
    el.addEventListener('pointerdown', ev=>ev.stopPropagation());

  // 預設就打開 —— 這是主要操作方式，不該藏在設定裡
  pad.classList.add('show');
})();
$('aimx').onclick = cancelAim;
$('pclose').onclick = ()=>{ SFX.play('open'); closePanel(); refresh(); };
document.querySelectorAll('[data-act]').forEach(b=>{
  b.onclick = ()=>{
    if(!G||G.over||coverUp) return;
    const a=b.dataset.act;
    if(a==='pick'){ SFX.play('open'); openPanel('ground'); }
    if(a==='inv'){ SFX.play('open'); panelMode==='inv'?closePanel():openPanel('inv'); }
    if(a==='down') descend();
    if(a==='wait') endTurn();
    if(a==='mag'){ SFX.play('open'); panelMode==='magic'?closePanel():openPanel('magic'); }
    if(a==='dpad'){
      const on = $('pad').classList.toggle('show');
      $('dpadbtn').textContent = on ? '收起手把' : '虛擬手把';
      SFX.play('open');
    }
    if(a==='tags') toggleTags();
    if(a==='mute') toggleMute();
    if(a==='help'){
      say('畫面上的十字鍵可按住連走，中央圓點＝待機。','gold');
      say('A＝確定：站樓梯上就下樓、腳下有東西就直接撿（背包滿了會往前拋開）','gold');
      say('B＝取消（關視窗、退出瞄準）　G 鍵開腳下選單可以不撿起直接使用','gold');
      say('鍵盤：方向鍵/WASD 移動　QEZC 斜向　G 腳下　I 背包　K 魔法　> 下樓','gold');
      say('L 名稱標籤　M 音效　Esc 取消　右側是樓層圖','gold');
      refresh();
    }
  };
});
$('restart').onclick = restart;
function restart(){
  $('over').classList.remove('show');
  closePanel(); pendWand=null; pendThrow=null; swapMode=null;
  newGame((Math.random()*1e9)|0);
  camX = G.p.x - VW/2 + .5; camY = G.p.y - VH/2 + .5;
  refresh();
}

/* ─── 進場卡 ────────────────────────────────────────────────── */
function showCard(){
  const el = $('card'); if(!el) return;
  const z = zoneOf(G.depth);
  $('cardf').textContent = 'B' + G.depth + 'F';
  $('cardz').textContent = z.nm;
  $('cards').textContent = z.sub;
  el.classList.remove('show');
  void el.offsetWidth;                 // 強制重排，動畫才會從頭播
  el.classList.add('show');
}

/* ─── 側欄分頁（窄螢幕） ────────────────────────────────────── */
document.querySelectorAll('#railtabs button').forEach(b=>{
  b.onclick = ()=>{
    const t = b.dataset.tab;
    document.querySelectorAll('#railtabs button').forEach(o=>o.classList.toggle('on', o===b));
    document.querySelectorAll('#rail [data-pane]').forEach(p=>p.classList.toggle('on', p.dataset.pane===t));
    SFX.play('open');
  };
});

/* ─── 觸控：滑動走路、點擊走一步 ────────────────────────────
   手機上方向鍵不是最自然的操作 —— 拇指想做的是「往那邊」。
   壓著往一個方向滑 = 持續朝那個方向走；輕點某一格 = 朝那格走一步。
   兩種都保留，因為狹窄通道裡點擊比滑動精準。 */
(function touchControls(){
  const el = $('screenwrap'); if(!el || !el.addEventListener) return;
  const STEP_MS = 135, TH = 26;        // 連續移動的節奏與觸發門檻（CSS px）
  let id = null, sx = 0, sy = 0, cx_ = 0, cy_ = 0, t0 = 0, dragging = false, timer = null;

  const dirOf = (dx,dy)=>{
    const k = Math.round(Math.atan2(dy,dx) / (Math.PI/4));
    return DIRS[(k%8+8)%8];
  };
  function tick(){
    if(!dragging || coverUp || !G || G.over) return;
    const d = dirOf(cx_-sx, cy_-sy);
    handleDir(d[0], d[1]);
  }
  function stop(){
    dragging = false; id = null;
    if(timer){ clearInterval(timer); timer = null; }
  }
  const blocked = t => !!(t.closest && (t.closest('#panel') || t.closest('#over')
                       || t.closest('#cover') || t.closest('#pad') || t.closest('#aim')));

  el.addEventListener('pointerdown', ev=>{
    if(coverUp || !G || G.over || blocked(ev.target)) return;
    if(panelMode){ closePanel(); refresh(); return; }    // 點畫面 = 關視窗
    id = ev.pointerId; sx = cx_ = ev.clientX; sy = cy_ = ev.clientY;
    t0 = performance.now(); dragging = false;
    SFX.unlock();
  });
  el.addEventListener('pointermove', ev=>{
    if(ev.pointerId !== id) return;
    cx_ = ev.clientX; cy_ = ev.clientY;
    if(!dragging && Math.hypot(cx_-sx, cy_-sy) > TH){
      dragging = true;
      tick();                                  // 第一步立刻走，不要等節拍
      timer = setInterval(tick, STEP_MS);
    }
  });
  el.addEventListener('pointerup', ev=>{
    if(ev.pointerId !== id) return;
    const wasDrag = dragging, dt = performance.now() - t0;
    stop();
    if(wasDrag || dt > 400 || coverUp || !G || G.over) return;

    // 輕點：換算成格座標，朝那一格走一步（點自己 = 開腳下選單）
    const r = cv.getBoundingClientRect(); if(!r.width) return;
    const s = r.width / cv.width;
    const gx = Math.floor(((ev.clientX - r.left)/s - lastOx) / T);
    const gy = Math.floor(((ev.clientY - r.top )/s - lastOy) / T);
    if(gx === G.p.x && gy === G.p.y){ SFX.play('open'); openPanel('ground'); return; }
    const dx = Math.sign(gx - G.p.x), dy = Math.sign(gy - G.p.y);
    if(dx || dy) handleDir(dx, dy);
  });
  el.addEventListener('pointercancel', stop);
  el.addEventListener('lostpointercapture', stop);
})();

/* ─── 封面 ──────────────────────────────────────────────────── */
let coverUp = true;
(function buildCover(){
  const cov = $('cover');
  if(!cov) { coverUp = false; return; }

  // 主角放大 7 倍當主視覺。用的是遊戲裡「同一份」精靈資料 ——
  // 封面畫得比遊戲好看是最廉價的謊，點進來只會失望。
  const ca = $('coverart');
  if(ca) ca.getContext('2d').drawImage(atlas.player, 0, 0);

  // 岩壁用遊戲的岩盤圖樣，封面與地牢是同一種材質
  const rock = $('coverrock');
  if(rock && TILE_ART.rock.toDataURL) rock.style.backgroundImage = `url(${TILE_ART.rock.toDataURL()})`;

  const dust = $('coverdust');
  if(dust){
    for(let i=0;i<22;i++){
      const d = document.createElement('i');
      d.style.left = (Math.random()*100).toFixed(1)+'%';
      d.style.top  = (-5 + Math.random()*30).toFixed(1)+'%';
      d.style.setProperty('--d', (170+Math.random()*300).toFixed(0)+'px');
      d.style.animationDuration = (5.5+Math.random()*7).toFixed(1)+'s';
      d.style.animationDelay = (-Math.random()*9).toFixed(1)+'s';
      dust.appendChild(d);
    }
  }

  $('start').onclick = ()=>{
    coverUp = false;
    cov.classList.add('gone');
    try{ scrollTo(0,0); if(parent !== window) parent.scrollTo(0,0); }catch(e){}
    SFX.unlock();                 // 按鈕本身就是瀏覽器要求的那個「使用者手勢」
    SFX.play('stairs');
    BGM.start();
    refresh();
    // 滑動這件事在畫面上是看不見的，不講玩家不會知道
    showCard();
    if(matchMedia('(hover:none) and (pointer:coarse)').matches) $('hint').classList.add('show');
  };
})();

/* ─── 啟動 ──────────────────────────────────────────────────── */
fitViewport();
newGame((Math.random()*1e9)|0);
camX = G.p.x - VW/2 + .5;
camY = G.p.y - VH/2 + .5;
refresh();
</script>
