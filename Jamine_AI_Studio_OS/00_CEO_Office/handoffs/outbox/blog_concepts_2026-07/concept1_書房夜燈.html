<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"WenQuanYi Zen Hei",serif;background:#171310;color:#ece3d4;width:1440px;height:1100px;overflow:hidden;position:relative}
/* 書房夜燈：整站是潔米爸的書房，一盞為你留的暖燈 */
.lamp{position:absolute;top:-380px;left:50%;transform:translateX(-50%);width:1400px;height:1000px;
 background:radial-gradient(ellipse 50% 42% at 50% 45%,rgba(201,162,75,.28),rgba(201,162,75,.10) 38%,transparent 66%);pointer-events:none}
.nav{position:relative;display:flex;justify-content:space-between;align-items:center;padding:38px 90px;z-index:2}
.brand{display:flex;align-items:center;gap:14px;font-size:21px;letter-spacing:2px}
.seal{width:42px;height:42px;border:1.5px solid #c9a24b;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#c9a24b;font-size:19px}
.nav-links{display:flex;gap:40px;font-size:15px;color:#b7a992;letter-spacing:3px}
.hero{position:relative;z-index:2;padding:70px 90px 0;display:grid;grid-template-columns:1.2fr .8fr;gap:60px}
.kicker{color:#c9a24b;letter-spacing:6px;font-size:13px;margin-bottom:30px}
h1{font-size:74px;line-height:1.28;letter-spacing:3px;font-weight:700;text-shadow:0 2px 30px rgba(201,162,75,.15)}
h1 .g{color:#c9a24b}
.lead{margin-top:34px;max-width:30ch;color:#c2b6a1;font-size:17px;line-height:2.1;letter-spacing:1px}
.window{position:relative;align-self:center;height:420px;border-radius:6px;
 background:linear-gradient(160deg,#0d1826,#0a1119);border:1px solid rgba(201,162,75,.25);overflow:hidden;
 box-shadow:0 30px 80px rgba(0,0,0,.5)}
.window::before{content:"";position:absolute;inset:0;background:
 radial-gradient(1.5px 1.5px at 30% 25%,#e8d9a8,transparent),
 radial-gradient(1.5px 1.5px at 65% 40%,#e8d9a8,transparent),
 radial-gradient(2px 2px at 50% 60%,#c9a24b,transparent),
 radial-gradient(1px 1px at 80% 70%,#e8d9a8,transparent),
 radial-gradient(1px 1px at 20% 75%,#e8d9a8,transparent)}
.window .cap{position:absolute;bottom:22px;left:26px;color:#8fa3bb;font-size:13px;letter-spacing:3px}
.cards{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:26px;padding:70px 90px 0}
.card{border-radius:14px;padding:38px 40px;position:relative;overflow:hidden;min-height:190px}
.c-warm{background:linear-gradient(155deg,rgba(201,162,75,.16),rgba(201,162,75,.04));border:1px solid rgba(201,162,75,.28)}
.c-cool{background:linear-gradient(155deg,#0e1a29,#0b1017);border:1px solid rgba(120,150,190,.22)}
.card h3{font-size:30px;letter-spacing:3px;margin-bottom:14px}
.c-warm h3{color:#f0dcae}.c-cool h3{color:#d8e2f0}
.card p{color:#b3a892;font-size:14px;letter-spacing:1px;line-height:1.8}
.c-cool p{color:#8fa0b8}
.card .n{position:absolute;top:26px;right:34px;font-size:52px;opacity:.12;font-weight:700}
.foot{position:absolute;bottom:34px;left:90px;color:#6b6152;font-size:13px;letter-spacing:4px}
</style></head><body>
<div class="lamp"></div>
<div class="nav"><div class="brand"><div class="seal">潔</div>潔米爸的書房</div>
<div class="nav-links"><span style="color:#ece3d4">首頁</span><span>語寶</span><span>紫微筆記</span><span>關於</span></div></div>
<div class="hero">
 <div><div class="kicker">概念一 · 書房夜燈</div>
 <h1>夜深了，<br>我為你留<span class="g">一盞燈</span>。</h1>
 <p class="lead">你好，我是潔米爸。這裡是我的書房——你迷路的時候可以進來坐坐。向外，我陪女兒認識世界；向內，我用命盤慢慢讀懂自己。</p></div>
 <div class="window"><div class="cap">— 窗外的夜空，是紫微筆記</div></div>
</div>
<div class="cards">
 <div class="card c-warm"><div class="n">01</div><h3>語寶</h3><p>向外的理解——育兒 · 語言自學 · 旅遊 · 各國文化。燈下我們一起認識世界。</p></div>
 <div class="card c-cool"><div class="n">02</div><h3>紫微筆記</h3><p>向內的理解——紫微斗數自學筆記與漫畫。窗外的星空，映照心裡的問題。</p></div>
</div>
<div class="foot">一盞深夜還亮著的燈 · JAMINEPA.COM</div>
</body></html>
