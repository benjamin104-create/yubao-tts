<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"WenQuanYi Zen Hei",sans-serif;background:#faf7f1;color:#2a2621;width:1440px;height:1100px;overflow:hidden;position:relative}
/* 兩種理解：潔米爸是向外與向內之間的那個定點。一條中軸線分開卻連著兩個世界 */
.axis{position:absolute;top:150px;bottom:150px;left:50%;width:1px;background:linear-gradient(#c9a24b00,#c9a24b,#c9a24b00)}
.axis::before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;background:#b5751f;box-shadow:0 0 0 6px rgba(181,117,31,.14)}
.axis .lbl{position:absolute;top:50%;left:50%;transform:translate(-50%,26px);white-space:nowrap;color:#9a8f7d;font-size:12px;letter-spacing:3px}
.nav{position:relative;display:flex;justify-content:space-between;align-items:center;padding:40px 80px;z-index:3}
.brand{display:flex;align-items:center;gap:13px;font-size:20px;letter-spacing:2px;font-weight:700}
.seal{width:40px;height:40px;background:#2a2621;color:#f3ead6;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px}
.nav-links{display:flex;gap:38px;font-size:14px;color:#8a8072;letter-spacing:3px}
.kicker{text-align:center;color:#b5751f;letter-spacing:8px;font-size:13px;margin:40px 0 6px;position:relative;z-index:3}
.title{text-align:center;font-size:64px;letter-spacing:4px;font-weight:700;position:relative;z-index:3;line-height:1.3}
.sub{text-align:center;color:#6f6659;font-size:16px;letter-spacing:2px;margin-top:22px;position:relative;z-index:3}
.split{position:relative;z-index:3;display:grid;grid-template-columns:1fr 1fr;margin-top:70px;height:520px}
.side{padding:60px 70px;display:flex;flex-direction:column;justify-content:center}
.out{align-items:flex-end;text-align:right;background:linear-gradient(90deg,transparent,rgba(201,162,75,.10))}
.in{align-items:flex-start;background:linear-gradient(-90deg,transparent,rgba(40,54,74,.09))}
.side .dir{font-size:13px;letter-spacing:5px;margin-bottom:18px}
.out .dir{color:#b5751f}.in .dir{color:#3d5573}
.side h2{font-size:44px;letter-spacing:4px;margin-bottom:20px}
.out h2{color:#1f1c17}.in h2{color:#22303f}
.side p{max-width:26ch;color:#6f6659;font-size:15px;line-height:2;letter-spacing:1px}
.icon{width:70px;height:70px;border-radius:50%;margin-bottom:26px;display:flex;align-items:center;justify-content:center;font-size:30px}
.out .icon{border:1.5px solid #d8b878;color:#b5751f}.in .icon{border:1.5px solid #6d8199;color:#3d5573}
.foot{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);color:#a89d8a;font-size:12px;letter-spacing:5px}
</style></head><body>
<div class="axis"><div class="lbl">潔米爸 · 定點</div></div>
<div class="nav"><div class="brand"><div class="seal">潔</div>潔米爸的書房</div>
<div class="nav-links"><span style="color:#2a2621">首頁</span><span>語寶</span><span>紫微筆記</span><span>關於</span></div></div>
<div class="kicker">概念二 · 兩種理解</div>
<div class="title">向外，也向內。</div>
<div class="sub">一個父親，站在世界與自己之間的那個定點。</div>
<div class="split">
 <div class="side out"><div class="icon">☀</div><div class="dir">向外的理解 · OUTWARD</div><h2>語寶</h2><p>陪女兒認識世界：育兒觀、語言自學、旅遊、各國地理與文化。</p></div>
 <div class="side in"><div class="icon">◇</div><div class="dir">INWARD · 向內的理解</div><h2>紫微筆記</h2><p>用紫微斗數慢慢讀懂自己：自學筆記與漫畫，理解而非算命。</p></div>
</div>
<div class="foot">向外是為了孩子，向內是為了自己 · JAMINEPA.COM</div>
</body></html>
