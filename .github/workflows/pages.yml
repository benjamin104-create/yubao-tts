# 把 web/ 直接發到 GitHub Pages。
#
# 這款遊戲是零依賴的單檔 HTML —— 沒有建置步驟、沒有 node_modules、
# 沒有要編譯的東西。所以這支流程只做一件事：把資料夾原封不動送上去。
# 任何「先 build 再部署」的寫法在這裡都只是多一個會壞掉的地方。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；排隊中的舊版本直接讓位給新的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 邏輯測試（壞掉的版本不該上線）
        run: |
          node web/sim.js
          node web/connect.js
          node web/items.js
          node web/i18n.js
          # 靜態掃：有沒有中文直接送到玩家眼前而沒有經過 TX()。
          # 前面每一支多語言檢查都是「跑起來才掃得到」，
          # 但施法、錢不夠、按開關這些路徑機器人跑不到 —— 這一支從原始碼掃。
          node web/strings.js
          node web/music.js
          node web/save.js
          node web/msgs.js
          # 走通測試：十五章有沒有哪一章根本過不去。九秒，值得 ——
          # 「拿掉開場裝備」那一次改動就是靠它抓到的：單看 sim.js 一切正常，
          # 實際上第 8、13 章已經完全走不完了。
          node web/campaign.js
      # 版面與名牌的位置 node 測不到 —— 那是「畫布縮放後的 CSS 座標」，
      # 沒有真的瀏覽器就沒有 getBoundingClientRect。名牌錯位不會報錯、
      # 字也是對的，只有量出來才看得到，所以這一步值得多花一分鐘裝瀏覽器。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 版面與多語言測試（需要真的瀏覽器）
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python tools/check_tags.py
          python tools/check_screens.py
          # 版面：玩家非看到不可的東西有沒有真的在畫面上（九種視窗尺寸）。
          # 這一類 bug 不報錯、字也是對的、其他測試全綠 —— 只是看不到。
          python tools/check_layout.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
