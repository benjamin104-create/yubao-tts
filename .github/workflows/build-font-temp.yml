name: Build font subset (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet fonttools brotli
      - run: python tools/build_font.py
      - uses: actions/upload-artifact@v4
        with:
          name: rebuilt-fonts
          path: web/font/*.woff2
          if-no-files-found: error
