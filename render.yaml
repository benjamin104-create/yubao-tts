services:
  - type: web
    name: yubao-tts
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn tts_gateway:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY      # 拍照辨識 + 字卡插圖生成用（Google Gemini）；程式實際讀的就是這個名字
        sync: false
      - key: IMAGE_MODEL         # 字卡插圖用的影像模型；可不填，預設 gemini-2.5-flash-image
        sync: false
      - key: ADMIN_TOKEN         # 後台密碼；自己設一組
        sync: false
      - key: GOOGLE_TTS_KEY      # 粵語(雲端)發音 / 翻譯用；沒有粵語需求可不填
        sync: false
      - key: MEMBER_CODES        # 會員碼清單(逗號分隔)，如 JAMINE2026,VIP-AAA；可不填
        sync: false
