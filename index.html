// 內建暫用品牌標誌（原創，之後用 LOGO_URL 換成你的正式 logo）
function Logo({ size = 46 }) {
  if (LOGO_URL) return <img src={LOGO_URL} alt="潔米爸" style={{ width: size, height: size, borderRadius: "50%", objectFit: "cover", display: "block", border: `2px solid ${C.brandSoft}` }} />;
  return (
    <svg width={size} height={size} viewBox="0 0 64 64" style={{ display: "block" }}>
      <rect x="2" y="2" width="60" height="60" rx="18" fill={C.navy} />
      <path d="M16 50c0-9 5-15 12-15s12 6 12 15z" fill="#fff" opacity="0.95" />
      <path d="M37 51c0-6 3.5-10 8-10s8 4 8 10z" fill={C.camel} />
      <circle cx="28" cy="25" r="9" fill={C.camel} />
      <circle cx="45" cy="33" r="6" fill="#fff" />
      <path d="M50 13l1.8 3.7 4 .6-2.9 2.8.7 4-3.6-1.9-3.6 1.9.7-4-2.9-2.8 4-.6z" fill={C.sun} />
    </svg>
  );
}

// 字卡視覺：有去背照片(img)就用照片，否則用 emoji
const pic = (card, size, style) => {
  if (card && card.img) return <img src={card.img} alt="" style={{ width: size, height: size, objectFit: "contain", ...style }} />;
  const e = card ? (card.emoji || "") : "";
  // 數字等「文字型圖示」會超出小框 → 依字數自動縮小；真正的 emoji 維持原大小
  const isTextIcon = /[0-9A-Za-z]/.test(e);
  const len = Array.from(e).length;
  const fs = isTextIcon && len > 1 ? Math.max(10, Math.min(size, Math.floor(size * 1.7 / len))) : size;
  return <span style={{ fontSize: fs, lineHeight: 1, fontWeight: 800, whiteSpace: "nowrap", ...style }}>{e}</span>;
};

// ============================================================
// 裝置端記憶：進度存 localStorage、拍照卡存 IndexedDB。
// 全程 try/catch 優雅降級——若環境不支援（如 claude.ai 預覽沙箱），
// 會自動退回「只存在記憶體」，不會報錯、不會白畫面。
// ============================================================
const CAP_MAX = 60; // 拍照卡最多保留張數（避免裝置塞爆）
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function idbOpen() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open("yubao", 1);
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains("cards")) r.result.createObjectStore("cards", { keyPath: "id" }); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
async function idbAll() {
  try { const db = await idbOpen(); return await new Promise((res) => { const q = db.transaction("cards").objectStore("cards").getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); }); }
  catch { return []; }
}
async function idbPut(card) { try { const db = await idbOpen(); db.transaction("cards", "readwrite").objectStore("cards").put(card); } catch {} }
async function idbDel(id) { try { const db = await idbOpen(); db.transaction("cards", "readwrite").objectStore("cards").delete(id); } catch {} }

// 數字：個位→十位→百位→千位→萬，自動生成（中／英／日讀法正確，含日語連音變化）
function buildNumbers() {
  const oZh = ["零","一","二","三","四","五","六","七","八","九"];
  const oEn = ["zero","one","two","three","four","five","six","seven","eight","nine"];
  const oJa = ["ゼロ","いち","に","さん","よん","ご","ろく","なな","はち","きゅう"];
  const teenZh = ["十","十一","十二","十三","十四","十五","十六","十七","十八","十九"];
  const teenEn = ["ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  const teenJa = ["じゅう","じゅういち","じゅうに","じゅうさん","じゅうよん","じゅうご","じゅうろく","じゅうなな","じゅうはち","じゅうきゅう"];
  const tEn = {2:"twenty",3:"thirty",4:"forty",5:"fifty",6:"sixty",7:"seventy",8:"eighty",9:"ninety"};
  const tJa = {2:"にじゅう",3:"さんじゅう",4:"よんじゅう",5:"ごじゅう",6:"ろくじゅう",7:"ななじゅう",8:"はちじゅう",9:"きゅうじゅう"};
  const hJa = {1:"ひゃく",2:"にひゃく",3:"さんびゃく",4:"よんひゃく",5:"ごひゃく",6:"ろっぴゃく",7:"ななひゃく",8:"はっぴゃく",9:"きゅうひゃく"};
  const kJa = {1:"せん",2:"にせん",3:"さんぜん",4:"よんせん",5:"ごせん",6:"ろくせん",7:"ななせん",8:"はっせん",9:"きゅうせん"};
  const mk = (n, zh, en, ja, level, emoji) => ({ emoji: emoji || String(n), cat: "數字", zh, en, ja, tl: "", ko: "", ind: "", vi: "", th: "", yue: zh, level, type: "數字" });
  const out = [mk(0, "零", "zero", "ゼロ", "幼兒", "0️⃣")];
  for (let n = 11; n <= 19; n++) out.push(mk(n, teenZh[n-10], teenEn[n-10], teenJa[n-10], "幼兒"));
  for (let t = 2; t <= 9; t++) for (let o = 0; o <= 9; o++) { const n = t*10+o; out.push(mk(n, oZh[t] + "十" + (o ? oZh[o] : ""), tEn[t] + (o ? "-" + oEn[o] : ""), tJa[t] + (o ? oJa[o] : ""), n <= 20 ? "幼兒" : "兒童")); }
  for (let h = 1; h <= 9; h++) out.push(mk(h*100, oZh[h] + "百", oEn[h] + " hundred", hJa[h], "兒童"));
  for (let k = 1; k <= 9; k++) out.push(mk(k*1000, oZh[k] + "千", oEn[k] + " thousand", kJa[k], "兒童"));
  out.push(mk(10000, "一萬", "ten thousand", "いちまん", "兒童"));
  return out;
}

let VOICES = [];
function loadVoices() { try { VOICES = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; } catch { VOICES = []; } }
if (typeof window !== "undefined" && window.speechSynthesis) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(code) {
  if (!code || !VOICES.length) return null;
  const lc = code.toLowerCase();
  const exact = VOICES.filter((v) => v.lang && v.lang.toLowerCase() === lc);
  const tw = exact.find((v) => /mei|jia|taiwan|臺|台|hanhan|yating/i.test(v.name));
  if (tw) return tw; if (exact[0]) return exact[0];
  const base = lc.split("-")[0];
  return VOICES.find((v) => v.lang && v.lang.toLowerCase().startsWith(base)) || null;
}
function speakSys(text, code) {
  if (!window.speechSynthesis || !code || !text) return;
  try { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = code; const v = pickVoice(code); if (v) u.voice = v; u.rate = 0.8; u.pitch = 1.05; window.speechSynthesis.speak(u); } catch {}
}

function cardText(card, L) {
  if (!L) return card.zh;
  const direct = card[L.field];
  if (direct) return direct;
  const filled = fillGet(card.zh, L.key);   // 補字層
  if (filled) return filled;
  const cached = i18n[L.key] && i18n[L.key][card.id];
  return cached || card.zh; // 還沒翻好 → 先顯示中文
}
async function translateWord(card, L) {
  const target = L && TRANSLATABLE[L.key];
  if (!target) return;
  if (card[L.key] || fillGet(card.zh, L.key) || (i18n[L.key] && i18n[L.key][card.id])) return;
  try {
    const r = await fetch(`${TTS_BASE}/translate?text=${encodeURIComponent(card.zh)}`);
    if (!r.ok) return;
    const d = await r.json();
    const tx = d && d[L.key];
    if (tx) { fillMerge(card.zh, d); saveFill(); bumpI18n(); }
  } catch {}
}

// ── 後端語音（台語/客語=意傳；粵語=雲端）──
const audioCache = {};
async function playBackend(L, input) {
  if (!TTS_BASE || !input) return false;
  const ck = `${L.key}:${input}`;
  try {
    let url = audioCache[ck];
    if (!url) { const r = await fetch(`${TTS_BASE}/tts?lang=${encodeURIComponent(L.key)}&text=${encodeURIComponent(input)}`); if (!r.ok) throw new Error(); url = URL.createObjectURL(await r.blob()); audioCache[ck] = url; }
    new Audio(url).play(); return true;
  } catch { return false; }
}

// 統一發音入口（保持 say(card, lang, langObj) 簽名）
function say(card, lang, L) {
  if (!L) return;
  if (L.provider === "browser") { speakSys(cardText(card, L), L.code); translateWord(card, L); return; }
  playBackend(L, resolveText(card, L.key) || card[L.field] || card.zh); // ithuan / cloud
}

function shrink(dataUrl, max = 1024) {
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => { let w = img.width, h = img.height; const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s); const cv = document.createElement("canvas"); cv.width = w; cv.height = h; cv.getContext("2d").drawImage(img, 0, 0, w, h); try { res(cv.toDataURL("image/jpeg", 0.82)); } catch { res(dataUrl); } };
    img.onerror = () => res(dataUrl); img.src = dataUrl;
  });
}

function Home({ lang, langObj, onCollect, collected }) {
  useI18n();
  const [cat, setCat] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [burst, setBurst] = useState(null);
  const touch = useRef(null);
  const list = useMemo(() => (cat === "全部" ? [...DECK].sort(byTag) : DECK.filter((c) => c.cat === cat).sort(byTag)), [cat]);
  useEffect(() => setIdx(0), [cat]);
  const card = list[idx] || list[0];
  useEffect(() => { translateWord(card, langObj); }, [card, langObj]);
  const tap = (e) => { say(card, lang, langObj); onCollect(card.id); const r = e.currentTarget.getBoundingClientRect(); setBurst({ x: r.width / 2, y: 30 }); setTimeout(() => setBurst(null), 700); };
  const go = (d) => setIdx((i) => (i + d + list.length) % list.length);

  return (

      <div className="bob" onTouchStart={(e) => (touch.current = e.touches[0].clientX)} onTouchEnd={(e) => { const dx = e.changedTouches[0].clientX - touch.current; if (dx < -40) go(1); if (dx > 40) go(-1); }} style={{ position: "relative" }}>

          {collected.has(card.id) && <div style={{ position: "absolute", top: 12, right: 16, fontSize: 22 }}>⭐</div>}
          {burst && <Burst x={burst.x} y={burst.y} />}
          <div style={{ height: 188, display: "flex", alignItems: "center", justifyContent: "center", animation: "wob 2s ease-in-out infinite" }}>{pic(card, 180)}</div>
          <div style={{ fontSize: 50, fontWeight: 900, marginTop: 12 }}>{cardText(card, langObj)}</div>
          {(langObj.key === "ja" || langObj.key === "ko") && <div style={{ fontSize: 18, color: "#9a6420", marginTop: 6, fontWeight: 800 }}>中文：{card.zh}</div>}
          {needBackend && <div style={{ fontSize: 13, color: C.berry, marginTop: 6, fontWeight: 700 }}>{t("home_needbackend")}</div>}
          {langObj.key === "tl" && TTS_BASE && <div style={{ fontSize: 12, color: C.teal, marginTop: 4, fontWeight: 700 }}>台羅：{card.tl}</div>}
          <div style={{ marginTop: 14, display: "inline-flex", alignItems: "center", gap: 6, background: C.brand, color: "#fff", padding: "8px 18px", borderRadius: 20, fontWeight: 800 }}>🔊 {t("say_once")}</div>
        </div>
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 16 }}>
        <button onClick={() => go(-1)} className="press" style={navBtn(C.sky)}>{t("prev")}</button>
        <button onClick={() => go(1)} className="press" style={navBtn(C.berry)}>{t("next")}</button>
      </div>
      <div style={{ textAlign: "center", color: "#bcae98", fontWeight: 700, marginTop: 10 }}>{idx + 1} / {list.length}</div>
    </div>
  );
}

function mapLabelToCard(label) {
  const s = (label || "").toLowerCase();
  for (const [kw, zh] of LABEL2ZH) {
    if (s.includes(kw)) { const card = DECK.find((d) => d.zh === zh); if (card) return { ...card }; }
  }

const AI_FREE = 3; // 每台裝置「一生」免費辨識次數（用完需購買會員，不再每天重置）
function aiLeft() {
  try { const r = LS.get("yb_ai", { used: 0 }); return Math.max(0, AI_FREE - (r.used || 0)); } catch { return AI_FREE; }
}
function aiUse() {
  try { const r = LS.get("yb_ai", { used: 0 }); LS.set("yb_ai", { used: (r.used || 0) + 1 }); } catch {}
}

function Scan({ lang, langObj, captured, addCaptured, removeCaptured }) {
  useI18n();
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [last, setLast] = useState(null);
  const [aiRemain, setAiRemain] = useState(aiLeft());
  const [memberCode, setMemberCode] = useState(() => LS.get("yb_member_code", ""));
  const [showCode, setShowCode] = useState(false);
  const [codeInput, setCodeInput] = useState("");
  const fileRef = useRef(null);
  const isMember = !!memberCode;

  const saveCode = () => { const v = (codeInput || "").trim(); LS.set("yb_member_code", v); setMemberCode(v); setShowCode(false); setErr(null); };
  const clearCode = () => { LS.set("yb_member_code", ""); setMemberCode(""); };

  const onPick = async (e) => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    setErr(null); setLast(null);
    if (!isMember && aiRemain <= 0) { setErr(t("err_quota_device")); if (fileRef.current) fileRef.current.value = ""; return; }
    const raw = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
    const dataUrl = await shrink(String(raw), 1024); const base64 = String(dataUrl).split(",")[1];
    setBusy(true);
    try {
      if (!TTS_BASE) throw new Error(t("err_not_enabled"));
      const resp = await fetch(`${TTS_BASE}/scan`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ image: base64, media_type: "image/jpeg", code: memberCode }) });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        const be = data && data.error;
        if (be) throw new Error("後端：" + String(be).slice(0, 160));
        if (resp.status === 429) throw new Error(t("err_quota_global"));
        throw new Error(tt("err_service", { s: resp.status }));
      }
      const obj = JSON.parse(String(data.raw || "").replace(/```json/g, "").replace(/```/g, "").trim());
      if (!obj.zh || obj.zh === "???") { setErr(t("err_unclear")); }
      else {
        const c = { ...obj, id: "cap-" + Date.now(), photo: dataUrl };
        await addCaptured(c); setLast(c); say(c, lang, langObj);
        if (!data.member) { aiUse(); setAiRemain(aiLeft()); }
      }
    } catch (e2) { setErr((e2 && e2.message) ? e2.message : t("err_fail")); }
    finally { setBusy(false); if (fileRef.current) fileRef.current.value = ""; }
  };

  return (
    <div className="bob">
      <div style={{ fontWeight: 800, fontSize: 18, color: C.teal, marginBottom: 4 }}>📷 {t("scan_title")}</div>
      <p style={{ color: "#a89878", fontWeight: 600, marginTop: 0, marginBottom: 12, fontSize: 14 }}>{t("scan_sub")}</p>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, background: C.card, border: `2px solid ${C.brandSoft}`, borderRadius: 16, padding: "8px 12px", marginBottom: 12 }}>
        {isMember ? (
          <><span style={{ fontWeight: 800, color: C.brand, fontSize: 14 }}>{t("scan_member_on")}</span><button onClick={clearCode} style={{ border: "none", background: "transparent", color: "#a89878", fontSize: 12, cursor: "pointer", fontFamily: "inherit", textDecoration: "underline" }}>{t("cancel")}</button></>
        ) : (
          <><span style={{ fontWeight: 700, color: C.ink, fontSize: 14 }}>{tt("scan_left", { n: aiRemain })}</span><button onClick={() => setShowCode((s) => !s)} style={{ border: "none", background: "transparent", color: C.teal, fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>{t("scan_have_code")}</button></>
        )}
      </div>

      {showCode && !isMember && (
        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
          <input value={codeInput} onChange={(e) => setCodeInput(e.target.value)} placeholder={t("scan_code_ph")} style={{ flex: 1, border: `2px solid ${C.brandSoft}`, borderRadius: 14, padding: "10px 12px", fontSize: 15, fontFamily: "inherit", outline: "none" }} />
          <button onClick={saveCode} className="press" style={{ border: "none", cursor: "pointer", background: C.brand, color: "#fff", padding: "0 18px", borderRadius: 14, fontWeight: 800, fontFamily: "inherit" }}>{t("scan_activate")}</button>
        </div>
      )}

      <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={onPick} style={{ display: "none" }} />
      {busy ? (<div style={{ textAlign: "center", padding: "40px 0", background: C.card, borderRadius: 28, border: `5px solid ${C.sun}` }}><div style={{ fontSize: 56, animation: "wob 1s ease-in-out infinite" }}>🔍</div><div style={{ fontWeight: 800, fontSize: 18, marginTop: 10, color: C.coral }}>{t("scan_busy")}</div></div>) : (
        <button onClick={() => fileRef.current && fileRef.current.click()} className="press" style={{ width: "100%", border: "none", cursor: "pointer", background: C.coral, color: "#fff", padding: "22px 0", borderRadius: 26, fontWeight: 800, fontSize: 22, fontFamily: "inherit", boxShadow: `0 6px 0 ${C.berry}` }}>📸 {t("scan_btn")}{isMember ? "" : tt("scan_btn_left", { n: aiRemain })}</button>
      )}

      {err && <div style={{ marginTop: 14, background: "#ffe6e6", color: "#c0392b", padding: 14, borderRadius: 18, fontWeight: 700, fontSize: 14, lineHeight: 1.6 }}>{err}{(!isMember && (err === t("err_quota_device") || err === t("err_quota_global"))) && <div style={{ marginTop: 8 }}><button onClick={() => setShowCode(true)} style={{ border: "none", background: C.brand, color: "#fff", padding: "8px 16px", borderRadius: 14, fontWeight: 800, cursor: "pointer", fontFamily: "inherit" }}>{t("scan_enter_code")}</button></div>}</div>}

      {last && (
        <div onClick={() => say(last, lang, langObj)} className="press bob" style={{ marginTop: 18, cursor: "pointer", background: C.card, border: `5px solid ${C.teal}`, borderRadius: 28, overflow: "hidden", boxShadow: `0 8px 0 #ecddbf`, textAlign: "center" }}>
          <img src={last.photo} alt="" style={{ width: "100%", height: 200, objectFit: "cover", display: "block" }} />
          <div style={{ padding: "14px 12px 18px" }}><span style={{ background: C.teal, color: "#fff", fontSize: 12, fontWeight: 700, padding: "3px 12px", borderRadius: 12 }}>{catLabel(last.cat)} {last.emoji}</span><div style={{ fontSize: 40, fontWeight: 900, marginTop: 8 }}>{cardText(last, langObj)}</div><div style={{ marginTop: 10, display: "inline-flex", gap: 6, background: C.brand, color: "#fff", padding: "8px 18px", borderRadius: 20, fontWeight: 800 }}>🔊 {t("say_once")}</div></div>
        </div>
      )}
      {captured.length > 0 && (<><div style={{ fontWeight: 800, fontSize: 15, color: C.teal, margin: "22px 0 10px" }}>📦 {tt("scan_mycaps", { n: captured.length })}<span style={{ fontWeight: 600, fontSize: 12, color: "#a89878" }}>　{t("tap_x_delete")}</span></div><div className="grid-photo">{captured.map((c) => (<div key={c.id} style={{ position: "relative" }}><button onClick={(ev) => { ev.stopPropagation(); removeCaptured && removeCaptured(c.id); }} aria-label="刪除" style={{ position: "absolute", top: 4, right: 4, zIndex: 5, width: 24, height: 24, borderRadius: "50%", border: "none", cursor: "pointer", background: "rgba(0,0,0,.55)", color: "#fff", fontSize: 14, fontWeight: 700, lineHeight: "24px", padding: 0 }}>✕</button><div onClick={() => say(c, lang, langObj)} className="press" style={{ cursor: "pointer", background: C.card, borderRadius: 18, overflow: "hidden", border: `3px solid ${C.sun}` }}><img src={c.photo} alt="" style={{ width: "100%", height: 70, objectFit: "cover", display: "block" }} /><div style={{ fontSize: 13, fontWeight: 800, padding: "5px 2px", textAlign: "center" }}>{cardText(c, langObj)}</div></div></div>))}</div></>)}
    </div>
  );
}

function ymd(ms) { return new Date(ms).toISOString().slice(0, 10); }
function progTouchDay() {
  const d = ymd(Date.now());
  if (PROG.streakLast !== d) {
    const yest = ymd(Date.now() - 86400000);
    PROG.streakN = PROG.streakLast === yest ? (PROG.streakN || 0) + 1 : 1;
    PROG.streakLast = d;
  }
  if (PROG.todayDate !== d) { PROG.todayDate = d; PROG.todayCount = 0; PROG.todayCards = []; }
}

];
function achTest(id) {
  if (id === "m1") return masteredCount() >= 1;
  if (id === "m10") return masteredCount() >= 10;
  if (id === "m50") return masteredCount() >= 50;
  if (id === "m100") return masteredCount() >= 100;
  if (id === "s3") return (PROG.streakN || 0) >= 3;
  if (id === "s7") return (PROG.streakN || 0) >= 7;
  if (id === "d10") return (PROG.todayCount || 0) >= 10;
  return false;
}
function checkAch() { for (const a of ACHS) { if (PROG.ach.indexOf(a.id) < 0 && achTest(a.id)) PROG.ach.push(a.id); } }
function recordResult(card, correct) {
  if (!card) return;
  progTouchDay();
  const cur = PROG.srs[card.id] || 0;
  PROG.srs[card.id] = correct ? Math.min(2, cur + 1) : 0;
  if (correct) {
    PROG.todayCount = (PROG.todayCount || 0) + 1;
    if (card.emoji && PROG.todayCards.indexOf(card.emoji) < 0) PROG.todayCards = [card.emoji, ...PROG.todayCards].slice(0, 16);
  }
  checkAch();
  saveProg();
}
function todayCountSafe() { return PROG.todayDate === ymd(Date.now()) ? (PROG.todayCount || 0) : 0; }

function Memory({ lang, langObj }) {
  useI18n();
  const [pool] = useState(() => [...DECK].sort(() => Math.random() - 0.5).slice(0, 6));
  const [tiles, setTiles] = useState([]);
  const [open, setOpen] = useState([]);
  const [done, setDone] = useState([]);
  const [moves, setMoves] = useState(0);
  const build = () => { const t = [...pool, ...pool].map((c, i) => ({ ...c, key: i })).sort(() => Math.random() - 0.5); setTiles(t); setOpen([]); setDone([]); setMoves(0); };
  useEffect(build, []);
  useEffect(() => { pool.forEach((c) => translateWord(c, langObj)); }, [langObj]);
  const flip = (k) => {
    if (open.length === 2 || open.includes(k) || done.includes(tiles[k].id)) return;
    const next = [...open, k]; setOpen(next);
    if (next.length === 2) { setMoves((m) => m + 1); const [a, b] = next; if (tiles[a].id === tiles[b].id) { say(tiles[a], lang, langObj); setTimeout(() => { setDone((d) => [...d, tiles[a].id]); setOpen([]); }, 600); } else setTimeout(() => setOpen([]), 900); }
    else say(tiles[k], lang, langObj);
  };
  const win = done.length === pool.length && pool.length > 0;
  return (
    <div className="bob">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}><span style={{ fontWeight: 800, fontSize: 18, color: C.teal }}>🃏 {t("mem_title")}</span><span style={{ fontWeight: 700, color: C.coral }}>{tt("mem_moves", { n: moves })}</span></div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 10 }}>{tiles.map((t, k) => { const faceUp = open.includes(k) || done.includes(t.id); return (<button key={t.key} onClick={() => flip(k)} className="press" style={{ aspectRatio: "1", border: "none", cursor: "pointer", borderRadius: 20, fontSize: 44, fontFamily: "inherit", transition: "all .2s", background: faceUp ? C.card : C.teal, opacity: done.includes(t.id) ? 0.45 : 1, boxShadow: faceUp ? `0 4px 0 #ecddbf` : `0 4px 0 #1e8576`, overflow: "hidden" }}>{faceUp ? (<span style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 2, height: "100%", padding: "2px" }}><span style={{ fontSize: 36, lineHeight: 1 }}>{pic(t, 36)}</span><span style={{ fontSize: 12, fontWeight: 800, color: C.ink, lineHeight: 1.05, textAlign: "center", wordBreak: "break-word" }}>{cardText(t, langObj)}</span></span>) : "❓"}</button>); })}</div>
      )}
    </div>
  );
}

function Match({ langObj, lang }) {

  useEffect(() => { words.forEach((w) => translateWord(w, langObj)); }, [langObj]);
  const choose = (side, card) => {
    if (matched.includes(card.id)) return;
    if (side === "R") say(card, lang, langObj);

      else { setWrong(card.id); setTimeout(() => setWrong(null), 500); setSel(null); }

        <button onClick={() => say(q.target, lang, langObj)} className="press" style={{ border: "none", cursor: "pointer", background: C.coral, color: "#fff", padding: "8px 20px", borderRadius: 18, fontWeight: 800, fontFamily: "inherit" }}>🔊 {t("listen_again")}</button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(2,1fr)", gap: 12 }}>{q.opts.map((o) => { const st = picked[o.id]; const reveal = st === "ok" || st === "no"; const optLabel = lang === "zh" ? (o.en || o.zh) : o.zh; return (<button key={o.id} onClick={() => tap(o)} className="press" style={{ position: "relative", border: "none", cursor: "pointer", borderRadius: 22, fontFamily: "inherit", transition: "all .2s", background: st === "ok" ? "#dff3ee" : st === "no" ? "#ffe0e0" : "#cfc4ad", boxShadow: `0 5px 0 ${st === "ok" ? "#9bd9c9" : st === "no" ? "#f3b6b6" : "#b3a888"}`, overflow: "hidden", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 6, minHeight: 132, padding: "14px 8px" }}><span style={{ fontSize: 48, lineHeight: 1, opacity: st === "no" ? 0.5 : 1 }}>{pic(o, 48)}</span><span style={{ fontSize: 16, fontWeight: 800, color: C.ink, lineHeight: 1.1, textAlign: "center", wordBreak: "break-word", opacity: st === "no" ? 0.5 : 1 }}>{optLabel}</span>{st === "ok" && <span style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 66 }}>⭕</span>}{st === "no" && <span style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 66 }}>❌</span>}</button>); })}</div>
      <p style={{ color: "#bcae98", fontSize: 12, textAlign: "center", marginTop: 14 }}>{t("quiz_tip")}</p>
    </div>
  );
}

function Dex({ collected, lang, langObj, captured, learned, fav, toggleLearned, toggleFav, custom, addCustom, removeCustom }) {
  useI18n();
  const [q, setQ] = useState("");
  const [level, setLevel] = useState("全部");
  const [cat, setCat] = useState("全部");
  const [view, setView] = useState("all");
  const [limit, setLimit] = useState(120); // 一次只渲染一部分，避免 2000 張一起畫造成卡頓
  const [showAdd, setShowAdd] = useState(false);
  const [addText, setAddText] = useState("");
  const [draft, setDraft] = useState(null);
  const [adding, setAdding] = useState(false);
  const [addErr, setAddErr] = useState(null);
  const mkCard = (tr, fallback) => { const ascii = /^[\x00-\x7F\s]+$/.test(fallback || ""); return { id: "my-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6), emoji: "📝", cat: "自訂", level: "自訂", type: "自訂", custom: true, zh: tr.zh || fallback, en: tr.en || (ascii ? fallback : ""), ja: tr.ja || "", ko: tr.ko || "", ind: tr.ind || "", vi: tr.vi || "", th: tr.th || "", yue: tr.zh || fallback, tl: "" }; };
  const doTranslate = async () => {
    const t2 = addText.trim(); if (!t2) return;
    setAdding(true); setAddErr(null); setDraft(null);
    try {
      if (!TTS_BASE) throw new Error(t("tr_not_enabled"));
      const r = await fetch(`${TTS_BASE}/translate?text=${encodeURIComponent(t2)}`);
      if (!r.ok) throw new Error(tt("err_service", { s: r.status }));
      setDraft(mkCard(await r.json(), t2));
    } catch (e) { setAddErr(e && e.message ? e.message : t("tr_fail")); }
    finally { setAdding(false); }
  };
  const saveDraft = () => { if (draft) { addCustom(draft); setDraft(null); setAddText(""); } };
  const addWord = async (w) => { try { const r = await fetch(`${TTS_BASE}/translate?text=${encodeURIComponent(w)}`); addCustom(mkCard(r.ok ? await r.json() : {}, w)); } catch {} };
  const compWords = useMemo(() => {
    if (!draft || !draft.en) return [];
    const known = new Set(DECK.map((c) => (c.en || "").toLowerCase()));
    const stop = new Set(["a", "an", "the", "of", "to", "and", "is", "in", "on", "with", "for"]);
    const full = draft.en.toLowerCase();
    return [...new Set(full.split(/[^a-z]+/).filter(Boolean))].filter((w) => w.length > 1 && !stop.has(w) && !known.has(w) && w !== full).slice(0, 6);
  }, [draft]);
  const results = useMemo(() => {
    const kw = q.trim().toLowerCase();
    return DECK.filter((c) => {
      if (level !== "全部" && c.level !== level) return false;
      if (cat !== "全部" && c.cat !== cat) return false;
      if (view === "fav" && !fav.has(c.id)) return false;
      if (view === "learned" && !learned.has(c.id)) return false;
      if (view === "todo" && learned.has(c.id)) return false;
      if (!kw) return true;
      const f = FILL[c.zh] || {};
      return [c.zh, c.en, c.ja, c.ko, c.ind, c.vi, c.th, c.tl, c.yue, f.ko, f.ind, f.vi, f.th, f.tl, f.hak].some((s) => (s || "").toLowerCase().includes(kw));
    }).sort(byTag);
  }, [q, level, cat, view, fav, learned]);
  useEffect(() => { setLimit(120); }, [q, level, cat, view]); // 篩選改變時重置渲染數量
  const lv = LEVELS.map((l) => { const cs = DECK.filter((c) => c.level === l.key); const done = cs.filter((c) => learned.has(c.id)).length; return { ...l, total: cs.length, done }; });
  const VIEWS = [{ k: "all", t: t("view_all") }, { k: "todo", t: t("view_todo") }, { k: "learned", t: t("view_learned") }, { k: "fav", t: t("view_fav") }];
  return (
    <div className="bob">
      <div style={{ fontWeight: 800, fontSize: 18, color: C.teal, marginBottom: 10 }}>🔎 {tt("dex_title", { n: DECK.length })}</div>

      <div style={{ marginBottom: 14 }}>
        <button onClick={() => setShowAdd((s) => !s)} className="press" style={{ width: "100%", border: "none", cursor: "pointer", background: C.brand, color: "#fff", padding: "12px 0", borderRadius: 18, fontWeight: 800, fontFamily: "inherit", fontSize: 16, boxShadow: "0 4px 0 #9a5e1f" }}>{t("dex_addcustom")}</button>
        {showAdd && (
          <div style={{ marginTop: 10, background: C.card, border: `3px solid ${C.brandSoft}`, borderRadius: 18, padding: 12 }}>
            <div style={{ display: "flex", gap: 8 }}>
              <input value={addText} onChange={(e) => setAddText(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") doTranslate(); }} placeholder={t("dex_add_ph")} style={{ flex: 1, minWidth: 0, border: `2px solid ${C.sun}`, borderRadius: 14, padding: "10px 12px", fontSize: 15, fontFamily: "inherit", outline: "none" }} />
              <button onClick={doTranslate} className="press" style={{ border: "none", cursor: "pointer", background: C.teal, color: "#fff", padding: "0 16px", borderRadius: 14, fontWeight: 800, fontFamily: "inherit", flex: "0 0 auto" }}>{adding ? "…" : t("translate")}</button>
            </div>
            {addErr && <div style={{ color: "#c0392b", fontWeight: 700, fontSize: 13, marginTop: 8 }}>{addErr}</div>}
            {draft && (
              <div style={{ marginTop: 10, background: "#fff", borderRadius: 14, padding: 12, border: `2px solid ${C.brandSoft}` }}>
                <div style={{ fontSize: 20, fontWeight: 900 }}>{draft.zh || "—"} <span style={{ fontSize: 14, color: "#a89878", fontWeight: 700 }}>{draft.en || ""}</span></div>
                <div style={{ fontSize: 13, color: "#8a7a64", marginTop: 2 }}>JP {draft.ja || "—"}　KR {draft.ko || "—"}　ID {draft.ind || "—"}　VI {draft.vi || "—"}　TH {draft.th || "—"}</div>
                {(!draft.zh || !draft.en || !draft.ja) && <div style={{ fontSize: 12, color: "#c08a2e", fontWeight: 700, marginTop: 6, background: "#fff6e6", padding: "6px 8px", borderRadius: 10 }}>⚠️ 機器翻譯，部分語言可能空白；建議輸入單一、明確的詞，存檔後仍可手動編輯。</div>}
                <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                  <button onClick={() => say(draft, lang, langObj)} className="press" style={{ border: "none", cursor: "pointer", background: C.coral, color: "#fff", padding: "8px 14px", borderRadius: 12, fontWeight: 800, fontFamily: "inherit" }}>🔊 {t("listen_short")}</button>
                  <button onClick={saveDraft} className="press" style={{ border: "none", cursor: "pointer", background: C.brand, color: "#fff", padding: "8px 14px", borderRadius: 12, fontWeight: 800, fontFamily: "inherit" }}>{t("dex_save")}</button>
                </div>
                {compWords.length > 0 && (
                  <div style={{ marginTop: 10 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: C.teal, marginBottom: 4 }}>{t("dex_newwords")}</div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>{compWords.map((w) => (<button key={w} onClick={() => addWord(w)} className="press" style={{ border: `1.5px solid ${C.brandSoft}`, cursor: "pointer", background: "#fff", color: C.ink, padding: "5px 10px", borderRadius: 12, fontWeight: 700, fontFamily: "inherit", fontSize: 13 }}>➕ {w}</button>))}</div>
                  </div>
                )}
              </div>
            )}
          </div>
        )}
      </div>

      <div style={{ background: C.card, border: `3px solid ${C.brandSoft}`, borderRadius: 20, padding: "12px 14px", marginBottom: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", fontWeight: 800, fontSize: 14, marginBottom: 8 }}><span>📈 {t("rec_title")}</span><span style={{ color: C.brand }}>{tt("rec_stats", { a: learned.size, b: fav.size })}</span></div>
        {lv.map((l) => (
          <div key={l.key} style={{ marginBottom: 6 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, fontWeight: 700, color: "#8a7a64" }}><span>{l.emoji} {levelLabel(l.key)}</span><span>{l.done}/{l.total}</span></div>
            <div style={{ height: 8, background: "#efe4cd", borderRadius: 6, overflow: "hidden", marginTop: 2 }}><div style={{ width: (l.total ? Math.round(l.done / l.total * 100) : 0) + "%", height: "100%", background: l.col, transition: "width .3s" }} /></div>
          </div>
        ))}
      </div>

      <div style={{ position: "relative", marginBottom: 10 }}>
        <span style={{ position: "absolute", left: 14, top: 12, fontSize: 18 }}>🔍</span>
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder={t("dex_search_ph")} style={{ width: "100%", border: `3px solid ${C.sun}`, borderRadius: 18, padding: "11px 14px 11px 42px", fontSize: 16, fontWeight: 600, color: C.ink, background: "#fff", outline: "none" }} />
        {q && <button onClick={() => setQ("")} style={{ position: "absolute", right: 10, top: 8, border: "none", background: "#eee", borderRadius: 12, width: 28, height: 28, cursor: "pointer", fontWeight: 800 }}>✕</button>}
      </div>

      <div className="dot" style={{ display: "flex", gap: 8, overflowX: "auto", marginBottom: 8 }}>
        {["全部", ...LEVELS.map((l) => l.key)].map((k) => { const on = level === k; const obj = LEVELS.find((l) => l.key === k); return (
          <button key={k} onClick={() => setLevel(k)} className="press" style={{ flex: "0 0 auto", border: "none", cursor: "pointer", padding: "7px 14px", borderRadius: 16, fontWeight: 700, fontSize: 14, fontFamily: "inherit", background: on ? (obj ? obj.col : C.ink) : "#fff", color: on ? "#fff" : C.ink, boxShadow: on ? "0 3px 0 rgba(0,0,0,.15)" : "0 2px 0 #e8ddc8" }}>{obj ? obj.emoji + " " + levelLabel(obj.key) : t("level_all")}</button>
        ); })}
      </div>

      <div className="dot" style={{ display: "flex", gap: 8, overflowX: "auto", marginBottom: 8 }}>
        {VIEWS.map((v) => { const on = view === v.k; return (<button key={v.k} onClick={() => setView(v.k)} className="press" style={{ flex: "0 0 auto", border: "none", cursor: "pointer", padding: "6px 13px", borderRadius: 14, fontWeight: 700, fontSize: 13, fontFamily: "inherit", background: on ? C.teal : "#fff", color: on ? "#fff" : C.ink, boxShadow: on ? "0 3px 0 #1e8576" : "0 2px 0 #e8ddc8" }}>{v.t}</button>); })}
      </div>

      <div style={{ marginBottom: 12 }}><CatChips value={cat} onChange={setCat} /></div>

      <div style={{ color: "#bcae98", fontWeight: 700, fontSize: 13, marginBottom: 10 }}>{tt("dex_count", { n: results.length })}</div>
      <div className="grid-dex">{results.slice(0, limit).map((c) => { const isLearned = learned.has(c.id); const isFav = fav.has(c.id); return (
        <div key={c.id} style={{ background: C.card, borderRadius: 18, padding: "10px 8px", border: `3px solid ${isLearned ? (CAT_COLOR[c.cat] || C.brand) : "#ece1c9"}`, display: "flex", alignItems: "center", gap: 8 }}>
          <div onClick={() => say(c, lang, langObj)} className="press" style={{ cursor: "pointer", display: "flex", alignItems: "center", gap: 8, flex: 1, minWidth: 0 }}>
            <div style={{ width: 38, height: 38, display: "flex", alignItems: "center", justifyContent: "center", flex: "0 0 auto" }}>{pic(c, 34)}</div>
            <div style={{ minWidth: 0 }}><div style={{ fontSize: 16, fontWeight: 900, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{cardText(c, langObj)}</div><div style={{ fontSize: 11, color: "#a89878", fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{(langObj.key === "ja" || langObj.key === "ko") ? "中文：" + c.zh : typeLabel(c.type) + "・" + catLabel(c.cat)}</div></div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 4, flex: "0 0 auto" }}>
            <button onClick={() => toggleFav(c.id)} aria-label="收藏" className="press" style={{ border: "none", cursor: "pointer", background: isFav ? "#ffe0e6" : "#f3ece0", borderRadius: 10, width: 30, height: 24, fontSize: 13 }}>{isFav ? "❤️" : "🤍"}</button>
            <button onClick={() => toggleLearned(c.id)} aria-label="已學會" className="press" style={{ border: "none", cursor: "pointer", background: isLearned ? C.teal : "#f3ece0", color: isLearned ? "#fff" : "#b3a48c", borderRadius: 10, width: 30, height: 24, fontSize: 13, fontWeight: 900 }}>✓</button>
          </div>
        </div>
      ); })}</div>
      {results.length > limit && <div style={{ textAlign: "center", margin: "14px 0" }}><button onClick={() => setLimit(limit + 200)} className="press" style={{ border: "none", cursor: "pointer", background: C.brand, color: "#fff", padding: "10px 22px", borderRadius: 16, fontWeight: 800, fontFamily: "inherit", fontSize: 14 }}>顯示更多（剩 {results.length - limit}）</button></div>}
      {results.length === 0 && <div style={{ textAlign: "center", color: "#bcae98", padding: 30, fontWeight: 700 }}>{t("dex_empty")}</div>}
      {custom && custom.length > 0 && (<><div style={{ fontWeight: 800, fontSize: 15, color: C.brand, margin: "22px 0 10px" }}>📝 {tt("dex_mycustom", { n: custom.length })}</div><div className="grid-dex">{custom.filter((c) => { const kw = q.trim().toLowerCase(); return !kw || [c.zh, c.en, c.ja].some((s) => (s || "").toLowerCase().includes(kw)); }).map((c) => { const isFav = fav.has(c.id); const isLearned = learned.has(c.id); return (<div key={c.id} style={{ position: "relative", background: C.card, borderRadius: 18, padding: "10px 8px", border: `3px solid ${isLearned ? C.brand : "#ece1c9"}`, display: "flex", alignItems: "center", gap: 8 }}><button onClick={() => removeCustom(c.id)} aria-label="刪除" style={{ position: "absolute", top: 4, right: 4, zIndex: 5, width: 22, height: 22, borderRadius: "50%", border: "none", cursor: "pointer", background: "rgba(0,0,0,.5)", color: "#fff", fontSize: 12, lineHeight: "22px", padding: 0 }}>✕</button><div onClick={() => say(c, lang, langObj)} className="press" style={{ cursor: "pointer", display: "flex", alignItems: "center", gap: 8, flex: 1, minWidth: 0 }}><div style={{ fontSize: 26, flex: "0 0 auto" }}>📝</div><div style={{ minWidth: 0 }}><div style={{ fontSize: 16, fontWeight: 900, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{cardText(c, langObj)}</div><div style={{ fontSize: 11, color: "#a89878", fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{typeLabel("自訂")}・{c.en}</div></div></div><div style={{ display: "flex", flexDirection: "column", gap: 4, flex: "0 0 auto" }}><button onClick={() => toggleFav(c.id)} className="press" style={{ border: "none", cursor: "pointer", background: isFav ? "#ffe0e6" : "#f3ece0", borderRadius: 10, width: 28, height: 22, fontSize: 12 }}>{isFav ? "❤️" : "🤍"}</button><button onClick={() => toggleLearned(c.id)} className="press" style={{ border: "none", cursor: "pointer", background: isLearned ? C.teal : "#f3ece0", color: isLearned ? "#fff" : "#b3a48c", borderRadius: 10, width: 28, height: 22, fontSize: 12, fontWeight: 900 }}>✓</button></div></div>); })}</div></>)}
      {captured && captured.length > 0 && (<><div style={{ fontWeight: 800, fontSize: 15, color: C.coral, margin: "22px 0 10px" }}>📷 {tt("dex_photocollect", { n: captured.length })}</div><div className="grid-photo">{captured.map((c) => (<div key={c.id} onClick={() => say(c, lang, langObj)} className="press" style={{ cursor: "pointer", background: C.card, borderRadius: 18, overflow: "hidden", border: `3px solid ${C.teal}` }}><img src={c.photo} alt="" style={{ width: "100%", height: 70, objectFit: "cover", display: "block" }} /><div style={{ fontSize: 13, fontWeight: 800, padding: "5px 2px", textAlign: "center" }}>{cardText(c, langObj)}</div></div>))}</div></>)}
      <p style={{ color: "#bcae98", fontSize: 11, textAlign: "center", marginTop: 18, lineHeight: 1.6 }}>{t("dex_footer")}</p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
